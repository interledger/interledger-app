stages:
  - triggers

trigger_protea:
  stage: triggers
  trigger:
    include: typescript/protea/.gitlab-ci.yml
    strategy: depend
  rules:
    - changes:
        - typescript/protea/**/*

trigger_infra:
  stage: triggers
  trigger:
    include: infra/.gitlab-ci.yml
    strategy: depend
  rules:
    - changes:
        - infra/**/*