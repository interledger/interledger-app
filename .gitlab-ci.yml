# this will switch between branch and merge request pipelines
# https://docs.gitlab.com/ee/ci/yaml/index.html#workflowrules-templates
include:
  - template: "Workflows/Branch-Pipelines.gitlab-ci.yml"
  - template: "Workflows/MergeRequest-Pipelines.gitlab-ci.yml"
  - local: /.gitlab-refs.yaml
  - local: go/backend/.gitlab-ci.yml
  - local: go/discordbot/.gitlab-ci.yml
  - local: go/.gitlab-ci.yml
  - local: typescript/**/.gitlab-ci.yml
  - local: typescript/protea/.chromatic.gitlab-ci.yml
  - local: infra/gitlab/runner-image/.gitlab-ci.yml

variables:
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  CACHE_COMPRESSION_LEVEL: "fast"

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

trigger_deploy_dev_eu1:
  tags:
    - hetzner
  environment: !reference [.dev_eu1_environment, environment]
  needs:
    - build_backend
    - build_protea
  when: manual
  variables:
    GIT_STRATEGY: none
  image: alpine:3.17
  before_script:
    - apk add --no-cache git
    - wget -qO- https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv4.5.5/kustomize_v4.5.5_linux_amd64.tar.gz | tar xvz -C /usr/local/bin/
    - rm -rf rooibos && mkdir rooibos
    - git clone --single-branch --branch main https://$CI_USERNAME:$CI_PUSH_TOKEN@gitlab.com/fynbos/rooibos.git rooibos
    - git config --global user.email "${GITLAB_USER_EMAIL}"
    - git config --global user.name "${GITLAB_USER_NAME}"
  script:
    - echo "Deploying $CI_ENVIRONMENT_NAME found at $CI_ENVIRONMENT_URL"
    - cd rooibos
    - git checkout -b gitlabcd/deploy-eu1-dev-$CI_COMMIT_SHORT_SHA
    - (cd backend/envs/dev-eu1 && kustomize edit set image 823058932981.dkr.ecr.eu-west-1.amazonaws.com/backend=823058932981.dkr.ecr.eu-west-1.amazonaws.com/backend:$CI_COMMIT_SHORT_SHA)
    - (cd backend/envs/dev-eu1 && kustomize edit set image 823058932981.dkr.ecr.eu-west-1.amazonaws.com/discordbot=823058932981.dkr.ecr.eu-west-1.amazonaws.com/discordbot:$CI_COMMIT_SHORT_SHA)
    - (cd protea/envs/dev-eu1 && kustomize edit set image 823058932981.dkr.ecr.eu-west-1.amazonaws.com/protea=823058932981.dkr.ecr.eu-west-1.amazonaws.com/protea:$CI_COMMIT_SHORT_SHA)
    - (cd botanist/envs/dev-eu1 && kustomize edit set image 823058932981.dkr.ecr.eu-west-1.amazonaws.com/botanist=823058932981.dkr.ecr.eu-west-1.amazonaws.com/botanist:$CI_COMMIT_SHORT_SHA)
    - git commit -am "Dev EU1 image update for ${CI_COMMIT_SHORT_SHA}"
    - git push -o merge_request.create -o merge_request.target=main -o merge_request.title="Deploy dev-eu1 $CI_COMMIT_SHORT_SHA" -o merge_request.assign="$GITLAB_USER_ID" -o merge_request.remove_source_branch --set-upstream origin gitlabcd/deploy-eu1-dev-$CI_COMMIT_SHORT_SHA

