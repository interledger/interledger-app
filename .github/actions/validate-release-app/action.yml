name: Validate Release App
description: |
  Mints a GitHub App installation token from RELEASE_APP_ID and
  RELEASE_APP_PRIVATE_KEY, then validates that the app is installed on the
  current repository with the permissions semantic-release requires. Fails the
  job with an explicit error if anything is misconfigured.

inputs:
  app-id:
    description: The GitHub App ID (typically secrets.RELEASE_APP_ID).
    required: true
  private-key:
    description: The GitHub App PEM private key (typically secrets.RELEASE_APP_PRIVATE_KEY).
    required: true

outputs:
  token:
    description: The minted installation access token.
    value: ${{ steps.app-token.outputs.token }}
  app-slug:
    description: The slug of the GitHub App.
    value: ${{ steps.app-token.outputs.app-slug }}
  installation-id:
    description: The auto-discovered installation ID.
    value: ${{ steps.app-token.outputs.installation-id }}

runs:
  using: composite
  steps:
    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}

    - name: Verify App token and installation
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
      run: |
        set -euo pipefail
        echo "App slug: ${APP_SLUG}"
        echo "Installation id: ${INSTALLATION_ID}"

        # Confirm the token is accepted by the API.
        if ! gh api /installation/repositories --jq '.repository_selection' >/dev/null 2>&1; then
          echo "::error::App token did not authenticate against /installation/repositories. Check RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY secrets."
          exit 1
        fi

        # Confirm the installation includes the current repository.
        if ! gh api --paginate /installation/repositories --jq '.repositories[].full_name' \
          | grep -Fxq "${GITHUB_REPOSITORY}"; then
          echo "::error::App is not installed on ${GITHUB_REPOSITORY}. Install the app on this repo or check the installation."
          exit 1
        fi
