name: Argo CD Refresh and Sync
description: Refresh a root Argo CD app via the Argo CD HTTP API, wait for it to become healthy, then refresh and sync either a target app or all apps matching a label selector.

inputs:
  argocd-endpoint:
    description: Argo CD endpoint host or URL.
    required: true
  argocd-auth-token:
    description: Argo CD API token.
    required: true
  cf-access-client-id:
    description: Cloudflare Access service token client ID.
    required: true
  cf-access-client-secret:
    description: Cloudflare Access service token client secret.
    required: true
  root-application:
    description: Root Argo CD application to refresh before syncing the target app.
    required: false
    default: root-appset
  target-application:
    description: Argo CD application to refresh and sync.
    required: false
    default: interledger-app
  application-selector:
    description: Label selector for Argo CD applications to refresh and sync after the root app becomes healthy. When set, this takes precedence over target-application.
    required: false
    default: ''
  timeout-seconds:
    description: Maximum seconds to wait for each application to become healthy and synced.
    required: false
    default: '1800'
  poll-interval-seconds:
    description: Seconds between Argo CD status polls.
    required: false
    default: '20'

runs:
  using: composite
  steps:
    - name: Refresh root app and sync Argo CD applications
      shell: bash
      env:
        ARGOCD_ENDPOINT: ${{ inputs.argocd-endpoint }}
        ARGOCD_AUTH_TOKEN: ${{ inputs.argocd-auth-token }}
        CF_ACCESS_CLIENT_ID: ${{ inputs.cf-access-client-id }}
        CF_ACCESS_CLIENT_SECRET: ${{ inputs.cf-access-client-secret }}
        ROOT_APPLICATION: ${{ inputs.root-application }}
        TARGET_APPLICATION: ${{ inputs.target-application }}
        APPLICATION_SELECTOR: ${{ inputs.application-selector }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        POLL_INTERVAL_SECONDS: ${{ inputs.poll-interval-seconds }}
      run: |
        set -euo pipefail

        echo "::add-mask::${ARGOCD_AUTH_TOKEN}"
        echo "::add-mask::${CF_ACCESS_CLIENT_SECRET}"

        require_command() {
          local command_name="$1"
          if ! command -v "${command_name}" >/dev/null 2>&1; then
            echo "::error::Missing required command: ${command_name}"
            exit 1
          fi
        }

        require_command curl
        require_command jq

        for required_name in ARGOCD_ENDPOINT ARGOCD_AUTH_TOKEN CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
          if [[ -z "${!required_name:-}" ]]; then
            echo "::error::${required_name} is required. Check the selected GitHub Environment variables and secrets."
            exit 1
          fi
        done

        ARGOCD_BASE="${ARGOCD_ENDPOINT%/}"
        if [[ "${ARGOCD_BASE}" != http://* && "${ARGOCD_BASE}" != https://* ]]; then
          ARGOCD_BASE="https://${ARGOCD_BASE}"
        fi

        curl_argocd() {
          curl -fsS \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            -H "Authorization: Bearer ${ARGOCD_AUTH_TOKEN}" \
            "$@"
        }

        refresh_application() {
          local app_name="$1"
          echo "Refreshing Argo CD application '${app_name}'..."
          curl_argocd \
            -X GET \
            "${ARGOCD_BASE}/api/v1/applications/${app_name}?refresh=normal" \
            >/dev/null
        }

        list_selected_applications() {
          local selector="$1"
          local response_file
          response_file="$(mktemp)"

          curl_argocd \
            -X GET \
            "${ARGOCD_BASE}/api/v1/applications" \
            > "${response_file}"

          jq -r --arg selector "${selector}" '
            def parse_selector($selector):
              ($selector | split(",") | map(gsub("^\\s+|\\s+$"; "") | select(length > 0)));
            def selector_matches($selector):
              all(parse_selector($selector)[]; 
                if test("^[^!=]+=[^=]+$") then
                  capture("^(?<key>[^=]+)=(?<value>.+)$") as $m
                  | (.metadata.labels[$m.key] // "") == $m.value
                elif test("^[^!]+!=.+$") then
                  capture("^(?<key>[^!]+)!=(?<value>.+)$") as $m
                  | (.metadata.labels[$m.key] // "") != $m.value
                else
                  false
                end
              );
            .items[]
            | select(selector_matches($selector))
            | .metadata.name
          ' "${response_file}"

          rm -f "${response_file}"
        }

        sync_application() {
          local app_name="$1"
          echo "Syncing Argo CD application '${app_name}'..."
          curl_argocd \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{"prune":false,"dryRun":false}' \
            "${ARGOCD_BASE}/api/v1/applications/${app_name}/sync" \
            >/dev/null
        }

        wait_for_green() {
          local app_name="$1"
          local deadline=$((SECONDS + TIMEOUT_SECONDS))
          local status_file
          status_file="$(mktemp)"

          echo "Waiting for '${app_name}' to become Healthy and Synced..."
          while (( SECONDS < deadline )); do
            curl_argocd \
              -X GET \
              "${ARGOCD_BASE}/api/v1/applications/${app_name}" \
              > "${status_file}"

            local health_status
            local sync_status
            local operation_phase
            health_status="$(jq -r '.status.health.status // "Unknown"' "${status_file}")"
            sync_status="$(jq -r '.status.sync.status // "Unknown"' "${status_file}")"
            operation_phase="$(jq -r '.status.operationState.phase // ""' "${status_file}")"

            echo "${app_name}: health=${health_status}, sync=${sync_status}, operation=${operation_phase:-none}"

            if [[ "${health_status}" == "Healthy" && "${sync_status}" == "Synced" ]]; then
              echo "${app_name} is Healthy and Synced."
              rm -f "${status_file}"
              return 0
            fi

            sleep "${POLL_INTERVAL_SECONDS}"
          done

          echo "::error::Timed out waiting for '${app_name}' to become Healthy and Synced."
          jq -r '.status.conditions // []' "${status_file}" || true
          rm -f "${status_file}"
          return 1
        }

        declare -a applications_to_sync

        refresh_application "${ROOT_APPLICATION}"
        wait_for_green "${ROOT_APPLICATION}"

        if [[ -n "${APPLICATION_SELECTOR}" ]]; then
          mapfile -t applications_to_sync < <(list_selected_applications "${APPLICATION_SELECTOR}")
          if [[ ${#applications_to_sync[@]} -eq 0 ]]; then
            echo "::error::No Argo CD applications matched selector '${APPLICATION_SELECTOR}'."
            exit 1
          fi
          echo "Selected Argo CD applications: ${applications_to_sync[*]}"
        else
          applications_to_sync=("${TARGET_APPLICATION}")
        fi

        for app_name in "${applications_to_sync[@]}"; do
          refresh_application "${app_name}"
        done

        for app_name in "${applications_to_sync[@]}"; do
          sync_application "${app_name}"
        done

        for app_name in "${applications_to_sync[@]}"; do
          wait_for_green "${app_name}"
        done

        {
          echo "### Argo CD deployment"
          echo ""
          echo "- Refreshed root application: \`${ROOT_APPLICATION}\`"
          if [[ -n "${APPLICATION_SELECTOR}" ]]; then
            echo "- Refreshed and synced applications matching: \`${APPLICATION_SELECTOR}\`"
            echo "- Matched applications: \`${applications_to_sync[*]}\`"
          else
            echo "- Synced target application: \`${TARGET_APPLICATION}\`"
          fi
          echo "- Endpoint: \`${ARGOCD_BASE}\`"
        } >> "${GITHUB_STEP_SUMMARY}"