name: Validate Release Config

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release Config
    runs-on: ubuntu-latest
    # PRs from forks or Dependabot cannot access secrets — skip rather than fail.
    if: |
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release app
        id: app
        uses: ./.github/actions/validate-release-app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: semantic-release dry run
        run: pnpm exec semantic-release --dry-run --no-ci --branches main
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
