name: Go Test Template

# If you are looking at this file to understand where test coverange thresholds come from,
# go and look at the MAIN_COVERAGE repository variable configured in the GitHub repository settings.

on:
  workflow_call:
    inputs:
      test_path:
        required: true
        type: string
      coverage_key:
        required: true
        type: string
      db_name:
        required: true
        type: string
      additional-tests:
        required: false
        type: string
        description: 'Additional commands to run after unit tests (e.g., "make test")'

jobs:
  run-go-tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/interledger/builders/gotester:v1.1.0
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGSSLMODE: disable
      GOFLAGS: -buildvcs=false
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Go modules and build cache
        uses: actions/cache@v3
        with:
          path: |
            ${{ github.workspace }}/.cache/go-build
            ${{ github.workspace }}/.cache/go-mod
          key: ${{ runner.os }}-go-container-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-container-

      - name: Wait for Postgres to be ready
        run: |
          until pg_isready -h postgres -p 5432; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Generate test migrations
        if: ${{ inputs.db_name == 'backend' }}
        run: |
          set -e
          echo "Generating test migrations for ${{ inputs.test_path }}"
          cd ${{ inputs.test_path }}
          # If the current folder has a sub folder called db
          if [ -d "db" ]; then
            export DB_URL=postgres://postgres:password@postgres:5432?sslmode=disable
            atlas migrate diff create_all \
              --dir "file://db/testmigrations" \
              --to  "file://db/schema.hcl" \
              --dev-url "${DB_URL}"
          else
            echo "No db directory found in ${{ inputs.test_path }}, skipping migration generation."
          fi

      - name: Run go tests and check coverage
        env:
          DB_URL: "postgres://postgres:password@postgres:5432/%s?sslmode=disable"
        run: |
          go test -coverprofile=coverage.out ${{ inputs.test_path }}/...
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          # strip the trailing '%' so bc can do its math
          COVERAGE_NUM=${COVERAGE%\%}
          echo "${{ inputs.coverage_key }} coverage: $COVERAGE_NUM%"
          THRESHOLD=$(cat "./go/coverage.thresholds" | grep -oP '${{ inputs.coverage_key }}=\K[0-9.]+')
          echo "${{ inputs.coverage_key }} coverage threshold: $THRESHOLD%"
          
          if ! command -v bc >/dev/null 2>&1; then
            echo "::error::bc not found, cannot compare coverage"
            exit 1
          fi
          
          if (( $(echo "$COVERAGE_NUM < $THRESHOLD" | bc -l) )); then
            echo "::error::${{ inputs.coverage_key }} coverage ($COVERAGE_NUM%) is below threshold ($THRESHOLD%)"
            exit 1
          else
            echo "::notice::coverage check passed ($COVERAGE_NUM% ≥ $THRESHOLD%)"
          fi
        shell: bash

      - name: Run additional tests
        if: ${{ inputs.additional-tests != '' }}
        run: |
          set -e
          ${{ inputs.additional-tests }}
        shell: bash

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.coverage_key }}-coverage-report
          path: coverage.out