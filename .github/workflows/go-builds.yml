name: Go build

# This whole pipeline is an experiment to figure out the linting issues we are having with the golangci-lint-action

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 21 * * *'
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - experiment-different-golang-linting-issues

jobs:


  golangci_go1_20_linter_v1_51_1:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '~1.20'
          check-latest: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: go
          version: 'v1.51.1'

  golangci_go1_21_linter_v1_51_1:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
