name: Test GitHub Actions Tooling

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tooling/github-actions/**'

  push:
    branches:
      - main
    paths:
      - 'tooling/github-actions/**'

jobs:
  test-tooling:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        working-directory: tooling/github-actions
        shell: bash
        run: |
          node --test
