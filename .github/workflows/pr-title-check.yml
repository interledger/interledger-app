name: Check PR title

# pull_request_target evaluates the workflow definition from the BASE branch,
# so a fork cannot weaken or delete this check by editing the file in its own
# PR — which a plain `pull_request` trigger would allow. It also never checks
# out the PR head, so no PR-authored code runs here.
#
# The only untrusted input is the PR title, which the action reads via the API
# rather than having it interpolated into a shell command.
on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

# pull_request_target runs with a fully-privileged GITHUB_TOKEN by default.
# Pin it to the minimum the action needs so a compromised dependency cannot
# write to the repository.
permissions:
  contents: read
  pull-requests: read

jobs:
  check-pr-title:
    name: Check PR Title
    runs-on: ubuntu-22.04
    steps: 
      - uses: amannn/action-semantic-pull-request@v5
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            local
