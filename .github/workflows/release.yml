name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'documentation/**'

permissions:
  contents: read

# Serialise releases on main so two rapid merges can't both compute
# the same next version and race to create the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tags_after.outputs.latest != steps.tags_before.outputs.latest && steps.tags_after.outputs.latest || '' }}
    steps:
      - name: Checkout (for composite action)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate release app
        id: app
        uses: ./.github/actions/validate-release-app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout (full history with app token)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
          persist-credentials: true

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Capture latest tag before release
        id: tags_before
        run: echo "latest=$(git tag --sort=-v:refname | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

      - name: Capture latest tag after release
        id: tags_after
        run: echo "latest=$(git tag --sort=-v:refname | head -n 1)" >> "$GITHUB_OUTPUT"

  publish_release_artifacts:
    needs: release
    if: needs.release.outputs.release_tag != ''
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/build-and-publish.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets: inherit
