name: Build and Publish test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"
  push:
    branches:
      - main
      - 'release/v*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - "**"

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  select_packages:
    # Selects and outputs the list of packages to be used in subsequent matrix builds
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.select_packages.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
      - name: Select packages
        id: select_packages
        uses: actions/github-script@v7
        with:
          script: |
            const { default: selectPackages } = await import('${{ github.workspace }}/tooling/github-actions/select-packages.js')
            await selectPackages({ github, core, context })

