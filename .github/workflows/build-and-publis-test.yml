name: Build and Publish test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"
  push:
    branches:
      - main
      - 'release/v*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - "**"

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  select_packages:
    # Selects and outputs the list of packages to be used in subsequent matrix builds
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.select_packages.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
      - name: Select packages
        id: select_packages
        uses: actions/github-script@v7
        with:
          script: |
            const { default: selectPackages } = await import('${{ github.workspace }}/tooling/github-actions/select-packages.js')
            await selectPackages({ github, core, context })

  version_generator:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_generator.outputs.NEW_VERSION }}
      tagPushed: ${{ steps.version_generator.outputs.SHOULD_PUSH_TAG }}
      dockerPush: ${{ steps.version_generator.outputs.PUSH_DOCKER_IMAGE }}
      generateRelease: ${{ steps.version_generator.outputs.GENERATE_RELEASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Generate version properties
        id: version_generator
        uses: actions/github-script@v7
        with:
          script: |
            const { default: versionGenerator } = await import('${{ github.workspace }}/tooling/github-actions/version-generator.js')
            await versionGenerator({ github, core, context })
