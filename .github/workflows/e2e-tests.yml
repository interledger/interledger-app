name: E2E Tests (PR)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency: e2e-tests

jobs:
  start-vm:
    runs-on: ubuntu-latest
    environment: e2e-tester
    timeout-minutes: 10
    
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GSA }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.PROJECT_ID }}
      
      - name: Check VM status and start if needed
        env:
          VM_NAME: ${{ vars.INSTANCE_NAME }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          VM_ZONE: ${{ vars.ZONE }}
        run: |
          echo "Checking VM: $VM_NAME in zone $VM_ZONE"
          
          # Check if VM exists
          if ! gcloud compute instances describe "$VM_NAME" \
               --zone="$VM_ZONE" \
               --project="$PROJECT_ID" &>/dev/null; then
            echo "❌ VM '$VM_NAME' does not exist"
            exit 1
          fi
          
          # Get current VM status
          STATUS=$(gcloud compute instances describe "$VM_NAME" \
            --zone="$VM_ZONE" \
            --project="$PROJECT_ID" \
            --format="value(status)")
          
          echo "Current VM status: $STATUS"
          
          if [ "$STATUS" = "RUNNING" ]; then
            echo "✅ VM is already running"
            exit 0
          fi
          
          # Start the VM
          echo "🚀 Starting VM..."
          gcloud compute instances start "$VM_NAME" \
            --zone="$VM_ZONE" \
            --project="$PROJECT_ID"
          
          # Wait for VM to be running (up to 5 minutes)
          echo "⏳ Waiting for VM to start..."
          for i in {1..30}; do
            STATUS=$(gcloud compute instances describe "$VM_NAME" \
              --zone="$VM_ZONE" \
              --project="$PROJECT_ID" \
              --format="value(status)")
            
            if [ "$STATUS" = "RUNNING" ]; then
              echo "✅ VM is now RUNNING"
              # Additional wait for full initialization (runner startup, docker, etc.)
              echo "⏳ Waiting 60 seconds for runner initialization..."
              sleep 60
              exit 0
            fi
            
            echo "Attempt $i/30: Status is $STATUS, waiting..."
            sleep 10
          done
          
          echo "❌ Timed out waiting for VM to start"
          exit 1

  e2e:
    needs: start-vm
    runs-on: e2e-tester
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GHCR (private images)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'

      - name: Configure local hosts and certs
        working-directory: local
        run: |
          make hosts
          make certs
          mkdir -p "$HOME/.pki/nssdb"
          certutil -d sql:"$HOME/.pki/nssdb" -N --empty-password
          make trust-debian

      - name: Install Playwright browsers
        working-directory: local/e2e-playwright
        run: |
          go mod download
          go run github.com/playwright-community/playwright-go/cmd/playwright install chromium

      - name: Build local-dev-tool
        working-directory: local/scripts
        run: make build

      - name: Cache Docker images
        uses: actions/cache@v4
        id: docker-cache
        with:
          path: /tmp/docker-images
          key: docker-images-${{ hashFiles('local/*.yaml') }}
          restore-keys: |
            docker-images-

      - name: Load cached Docker images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          for tar in /tmp/docker-images/*.tar; do
            docker load -i "$tar" || true
          done

      - name: Start infrastructure
        working-directory: local
        run: docker compose --profile infrastructure up -d

      - name: Wait for infrastructure
        working-directory: local
        run: |
          set -e

          wait_for_health() {
            local service="$1"
            local timeout="$2"
            local cid
            local status

            cid=$(docker compose ps -q "$service")
            if [ -z "$cid" ]; then
              echo "Service not started: $service"
              exit 1
            fi

            for i in $(seq 1 "$timeout"); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo "none")
              if [ "$status" = "healthy" ]; then
                echo "$service is healthy"
                return 0
              fi
              sleep 2
            done

            echo "Timed out waiting for health on $service"
            exit 1
          }

          wait_for_port() {
            local port="$1"
            local name="$2"

            for i in $(seq 1 60); do
              if nc -z localhost "$port"; then
                echo "$name is listening on $port"
                return 0
              fi
              sleep 2
            done

            echo "Timed out waiting for $name on port $port"
            exit 1
          }

          wait_for_health postgres 30
          wait_for_port 6379 redis
          wait_for_port 443 traefik

          for i in $(seq 1 30); do
            if curl -k -sSf https://traefik.test >/dev/null; then
              echo "Traefik is responding"
              exit 0
            fi
            sleep 2
          done

          echo "Traefik did not respond in time"
          exit 1

      - name: Start services
        working-directory: local
        run: docker compose --profile services up -d

      - name: Wait for services
        working-directory: local
        run: |
          set -e

          wait_for_port() {
            local port="$1"
            local name="$2"

            for i in $(seq 1 60); do
              if nc -z localhost "$port"; then
                echo "$name is listening on $port"
                return 0
              fi
              sleep 2
            done

            echo "Timed out waiting for $name on port $port"
            exit 1
          }

          wait_for_port 4433 kratos
          wait_for_port 4434 kratos-admin
          wait_for_port 7233 temporal
          wait_for_port 3001 rafiki-backend
          wait_for_port 3003 rafiki-auth

      - name: Seed Rafiki assets
        working-directory: local/scripts
        run: ./local-dev-tool rafiki --skip-ui --wait-for-ready 120

      - name: Start application
        working-directory: local
        run: docker compose --profile application up -d

      - name: Wait for application
        working-directory: local
        run: |
          set -e

          wait_for_port() {
            local port="$1"
            local name="$2"

            for i in $(seq 1 60); do
              if nc -z localhost "$port"; then
                echo "$name is listening on $port"
                return 0
              fi
              sleep 2
            done

            echo "Timed out waiting for $name on port $port"
            exit 1
          }

          wait_for_port 8080 backend

          for i in $(seq 1 60); do
            if curl -k -sSf https://interledger.test >/dev/null; then
              echo "interledger.test is responding"
              exit 0
            fi
            sleep 2
          done

          echo "interledger.test did not respond in time"
          exit 1

      - name: Run e2e tests
        working-directory: local/e2e-playwright
        run: go test -v -timeout 20m

      - name: Export Docker images for cache
        if: always() && steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          FREE_KB=$(df --output=avail /tmp | tail -1)
          if [ "$FREE_KB" -lt 5242880 ]; then
            echo "Less than 5GB free, skipping cache export"
            exit 0
          fi
          mkdir -p /tmp/docker-images
          docker images --format '{{.Repository}}:{{.Tag}}' | grep -v '<none>' | while read -r img; do
            name=$(echo "$img" | tr '/:' '_')
            docker save -o "/tmp/docker-images/${name}.tar" "$img" 2>/dev/null || true
          done

      - name: Dump docker logs on failure
        if: failure()
        working-directory: local
        run: |
          docker compose ps
          docker compose --profile "*" logs --no-color