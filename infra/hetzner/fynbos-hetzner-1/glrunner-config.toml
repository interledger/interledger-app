concurrent = 10
check_interval = 0
shutdown_timeout = 0

[session_server]
    session_timeout = 1800

[[runners]]
    url = "https://gitlab.com/"
    token = ""
    executor = "docker"
    [runners.docker]
        tls_verify = false
        image = "golang:1.19.5"
        privileged = false
        disable_entrypoint_overwrite = false
        oom_kill_disable = false
        disable_cache = false
        volumes = ["/cache:/cache", "/builds:/builds", "/var/run/docker.sock:/var/run/docker.sock", "/root/.aws:/root/.aws"]
        shm_size = 0