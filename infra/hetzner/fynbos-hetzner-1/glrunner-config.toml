concurrent = 20

[[runners]]
    url = "https://gitlab.com/"
    token = ""
    executor = "docker"
    [runners.docker]
        tls_verify = false
        image = "golang:1.19.5"
        privileged = false
        disable_entrypoint_overwrite = false
        oom_kill_disable = false
        disable_cache = false
        volumes = ["/cache"]
        shm_size = 0
