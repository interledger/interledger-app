cookies:
  same_site: Strict
courier:
  message_retries: 0
  delivery_strategy: http
  http:
    request_config:
      url: https://api.sendgrid.com/v3/mail/send
      method: POST
      headers:
        "Content-Type": "application/json"
      body: file:///local/sendgrid.jsonnet
      auth:
        type: api_key
        config:
          in: header
          name: Authorization
  smtp:
    from_address: hello@fynbos.app
    from_name: Fynbos
    connection_uri: smtps://localhost
hashers:
  algorithm: argon2
  argon2:
    dedicated_memory: 1GB
    expected_deviation: 500ms
    expected_duration: 500ms
    iterations: 1
    key_length: 16
    memory: 128MB
    parallelism: 1
    salt_length: 16
identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///local/identity.schema.json
log:
  format: text
  leak_sensitive_values: false
  level: debug
selfservice:
  allowed_return_urls:
    - https://fynbos.app
  default_browser_return_url: https://fynbos.app
  flows:
    error:
      ui_url: https://fynbos.app/error
    login:
      after:
        default_browser_return_url: https://fynbos.app
        hooks:
          - hook: web_hook
            config:
              url: "http://backend.backend:80/kratos/login"
              method: POST
              response:
                ignore: true
              body: base64://ZnVuY3Rpb24oY3R4KSB7CiAgdXNlcklkOiBjdHguaWRlbnRpdHkuaWQsCiAgZW1haWw6IGN0eC5pZGVudGl0eS50cmFpdHMuZW1haWwsCiAgZmlyc3ROYW1lOiBjdHguaWRlbnRpdHkudHJhaXRzLmZpcnN0TmFtZSwKICBsYXN0TmFtZTogY3R4LmlkZW50aXR5LnRyYWl0cy5sYXN0TmFtZSwKfQo=
      lifespan: 10m
      ui_url: https://fynbos.app/login
    logout:
      after:
        default_browser_return_url: https://fynbos.app
    recovery:
      enabled: true
      lifespan: 15m
      ui_url: https://fynbos.app/error
    registration:
      after:
        default_browser_return_url: https://fynbos.app
        password:
          default_browser_return_url: https://fynbos.app
          hooks:
            - hook: web_hook
              config:
                url: "http://backend.backend:80/kratos/signup"
                method: POST
                response:
                  ignore: true
                body: base64://ZnVuY3Rpb24oY3R4KSB7CiAgdXNlcklkOiBjdHguaWRlbnRpdHkuaWQsCiAgZW1haWw6IGN0eC5pZGVudGl0eS50cmFpdHMuZW1haWwsCiAgZmlyc3ROYW1lOiBjdHguaWRlbnRpdHkudHJhaXRzLmZpcnN0TmFtZSwKICBsYXN0TmFtZTogY3R4LmlkZW50aXR5LnRyYWl0cy5sYXN0TmFtZSwKfQo=
            - hook: session
      enabled: true
      lifespan: 10m
      ui_url: https://fynbos.app/signup
    settings:
      privileged_session_max_age: 15m
      ui_url: https://fynbos.app/settings
    verification:
      after:
        default_browser_return_url: https://fynbos.app
      enabled: true
      ui_url: https://fynbos.app/verify
  methods:
    link:
      config:
        base_url: https://fynbos.app
        lifespan: 1h
      enabled: true
    password:
      enabled: true
serve:
  admin:
    port: 4434
  public:
    base_url: https://fynbos.app
    cors:
      enabled: true
    port: 4433
session:
  cookie:
    domain: ""
    name: ory_kratos_session
    path: ""
    persistent: true
    same_site: Strict
  earliest_possible_extend: 24h
  lifespan: 1h
  whoami:
    required_aal: aal1
