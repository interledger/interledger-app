apiVersion: getambassador.io/v3alpha1
kind:  Mapping
metadata:
  name:  kratos-mapping
spec:
  hostname: "*"
  prefix: /self-service/
  rewrite: /self-service/
  service: kratos-public
---
apiVersion: getambassador.io/v3alpha1
kind:  Mapping
metadata:
  name:  kratos-sessions
spec:
  hostname: "*"
  prefix: /sessions/
  rewrite: /sessions/
  service: kratos-public