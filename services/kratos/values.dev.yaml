kratos:
  autoscaling:
    enabled: false
  kratos:
    autoMigrate: true
    identitySchemas:
      "identity.default.schema.json": |
        {
           "$id": "https://schemas.ory.sh/presets/kratos/identity.email.schema.json",
           "$schema": "http://json-schema.org/draft-07/schema#",
           "title": "Person",
           "type": "object",
           "properties": {
              "traits": {
                 "type": "object",
                 "properties": {
                    "email": {
                       "type": "string",
                       "format": "email",
                       "title": "E-Mail",
                       "ory.sh/kratos": {
                          "credentials": {
                             "password": {
                                "identifier": true
                             }
                          },
                          "recovery": {
                             "via": "email"
                          },
                          "verification": {
                             "via": "email"
                          }
                       }
                    }
                 },
                 "required": [
                    "email"
                 ],
                 "additionalProperties": false
              }
           }
        }
    config:
      dsn: "cockroach://kratos@cockroachdb-public:26257/kratos?sslmode=verify-full&max_conns=20&max_idle_conns=4&sslcert=/cockroach-certs/client.kratos.crt&sslkey=/cockroach-certs/client.kratos.key&sslrootcert=/cockroach-certs/ca.crt"
      selfservice:
        default_browser_return_url: http://127.0.0.1:4455/
        methods:
          password:
            enabled: true
      log:
        level: debug
      secrets:
        session:
          - PLEASE-CHANGE-ME-I-AM-VERY-INSECURE
      hashers:
        argon2:
          parallelism: 1
          memory: 128MB
          iterations: 2
          salt_length: 16
          key_length: 16
      identity:
        default_schema_url: file:///etc/config/kratos/identity.default.schema.json
      courier:
        smtp:
          connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true
  ingress:
    admin:
      enabled: true
    public:
      enabled: true

  deployment:
    extraVolumes:
      - name: cockroach-certs
        secret:
          secretName: cockroachdb.client.kratos
    extraVolumeMounts:
      - name: cockroach-certs
        mountPath: "/cockroach-certs"