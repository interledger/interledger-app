apiVersion: v1
kind: ServiceAccount
metadata:
  name: mailhog
  labels:
    app: mailhog
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mailhog
  labels:
    app: mailhog
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mailhog
  labels:
    app: mailhog
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mailhog
subjects:
  - kind: ServiceAccount
    name: mailhog
    namespace: default