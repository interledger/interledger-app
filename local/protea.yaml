services:
  protea:
    build:
      context: ../typescript
      dockerfile: protea/Dockerfile
      target: dev
    profiles:
      - application
      - frontend
    restart: always
    # Resolve the local wallet-address hosts back to the host gateway (Traefik),
    # so server-side fetches (e.g. quick-pay wallet address validation in
    # utils.server.ts) can reach https://local.ilp.link from inside the container.
    extra_hosts:
      - "local.ilp.link:host-gateway"
      - "auth.local.ilp.link:host-gateway"
    volumes:
      - ../typescript/protea/app:/app/protea/app:rw
      # Trust the local self-signed cert (served by Traefik) so server-side
      # HTTPS fetches to local.ilp.link etc. verify instead of being skipped.
      - ./config/certs/local.crt:/certs/local.crt:ro
      # Override any value by creating local/config-override/protea.yaml
      # (the file is created empty by `make prep`).
      - ./config/protea.yaml:/etc/protea/config.yaml:ro
      - ./config-override/protea.yaml:/etc/protea/config-override.yaml:ro
    ports:
      - "3000:3000" # http port
      - "8002:8002" # websocket port
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.protea.rule=Host(`interledger.test`)"
      - "traefik.http.routers.protea.service=protea"
      - "traefik.http.services.protea.loadbalancer.server.port=3000"

      - "traefik.http.routers.protea-ws.rule=Host(`interledger.test`) && PathPrefix(`/socket`)"
      - "traefik.http.routers.protea-ws.service=protea-ws"
      - "traefik.http.services.protea-ws.loadbalancer.server.port=8002"

    environment:
      # Trust our local CA rather than disabling TLS verification wholesale.
      - NODE_EXTRA_CA_CERTS=/certs/local.crt
      - CHOKIDAR_USEPOLLING=true
      # Everything else is loaded from the mounted config.yaml/config-override.yaml
      # below (see local/config/protea.yaml) — override values there instead of here.
      - CONFIG=/etc/protea/config.yaml,/etc/protea/config-override.yaml

    depends_on:
      - backend
