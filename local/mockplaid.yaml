services:
  mockplaid:
    build:
      context: ..
      dockerfile: go/mock/mockplaid/Dockerfile
    profiles:
      - application
    restart: always
    expose:
      - "8080"
    labels:
      - "traefik.enable=true"
      # Debug / health host
      - "traefik.http.routers.mockplaid.rule=Host(`mockplaid.interledger.test`)"
      - "traefik.http.routers.mockplaid.entrypoints=websecure"
      # Redirected Plaid CDN host (browser loads the mock Link SDK from here)
      - "traefik.http.routers.mockplaid-cdn.rule=Host(`cdn.plaid.com`)"
      - "traefik.http.routers.mockplaid-cdn.entrypoints=websecure"
      # Shared service backend for both routers
      - "traefik.http.services.mockplaid.loadbalancer.server.port=8080"
    environment:
      LOG_LEVEL: debug

      # Storage configuration
      MOCKPLAID_REDIS_URL: redis://redis:6379
      MOCKPLAID_REDIS_DB: '6'

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
