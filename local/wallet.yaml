services:
  # 1. Migrations
  migration:
    build:
      context: ../go
      dockerfile: backend/Dockerfile
      target: builder
    profiles:
      - application
      - backend
    command: "migrate"
    develop:
      watch:
        - path: ../go
          action: rebuild
    restart: on-failure
    environment:
      - CONFIG=/etc/backend/config.yaml,/etc/backend/config-override.yaml
    volumes:
      - ./config/backend.migration.yaml:/etc/backend/config.yaml:ro
      - ./config-override/backend.migration.yaml:/etc/backend/config-override.yaml:ro

  # 2. Backend
  backend:
    build:
      context: ../go
      dockerfile: backend/Dockerfile
      # dockerfile: backend/Dockerfile.debug # for debugging
      target: builder
    profiles:
      - application
      - backend
    command: "dev"
    develop:
      watch:
        - path: ../go
          action: rebuild
    restart: always
    ports:
      - "8080:8080" # http port
      - "8081:8081" # open payments port
      - "8082:8082" # authorisation port
      - "8443:8443" # grpc port
      - "8448:8448" # wallet admin port
      - "2345:2345" # debug port
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.backend.service=backend"
      - "traefik.http.routers.backend.rule=Host(`interledger.test`) && (PathPrefix(`/webhooks`) || PathPrefix(`/.well-known`))"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"

      - "traefik.tcp.routers.delve.service=delve"
      - "traefik.tcp.routers.delve.rule=HostSNI(`*`)"
      - "traefik.tcp.services.delve.loadbalancer.server.port=2345"

    environment:
      - CONFIG=/etc/backend/config.yaml,/etc/backend/config-override.yaml
      # OTEL is configured in the YAML config under `otel:`. The standard
      # OTEL_EXPORTER_OTLP_* env vars still take priority if set (a warning is
      # logged when they override the config).
    volumes:
      - ./config/backend.yaml:/etc/backend/config.yaml:ro
      - ./config-override/backend.yaml:/etc/backend/config-override.yaml:ro


    depends_on:
      - migration
      - mockgatehub
      - mockxago
      - mockpti
