services:
  # 1. Migrations
  migration:
    build:
      context: ../go
      dockerfile: backend/Dockerfile
      target: builder
    profiles:
      - application
      - backend
    command: "migrate"
    develop:
      watch:
        - path: ../go
          action: rebuild
    restart: on-failure
    environment:
      - FYNBOS_ENV=${MIGRATION_FYNBOS_ENV:-local}
      - RAFIKI_DB_URL=${MIGRATION_RAFIKI_DB_URL:-postgres://postgres:postgres@postgres:5432/rafiki_backend?sslmode=disable}
      - RAFIKI_AUTH_DB_URL=${MIGRATION_RAFIKI_AUTH_DB_URL:-postgres://postgres:postgres@postgres:5432/rafiki_auth?sslmode=disable}
      - DB_URL_WITH_CERTS=${MIGRATION_DB_URL_WITH_CERTS:-postgres://postgres:postgres@postgres:5432/backend?sslmode=disable}
      - PACIOLI_DB_URL_WITH_CERTS=${MIGRATION_PACIOLI_DB_URL_WITH_CERTS:-postgres://postgres:postgres@postgres:5432/pacioli?sslmode=disable}
      - KRATOS_URL=${MIGRATION_KRATOS_URL:-http://kratos:4434} # check it if is public or admin
      - LOG_LEVEL=${MIGRATION_LOG_LEVEL:-info}

  # 2. Backend
  backend:
    build:
      context: ../go
      dockerfile: backend/Dockerfile
      # dockerfile: backend/Dockerfile.debug # for debugging
      target: builder
    profiles:
      - application
      - backend
    command: "dev"
    develop:
      watch:
        - path: ../go
          action: rebuild
    restart: always
    ports:
      - "8080:8080" # http port
      - "8081:8081" # open payments port
      - "8082:8082" # authorisation port
      - "8443:8443" # grpc port
      - "8448:8448" # wallet admin port
      - "2345:2345" # debug port
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.backend.service=backend"
      - "traefik.http.routers.backend.rule=Host(`interledger.test`) && PathPrefix(`/webhooks`)"
      - "traefik.http.routers.backend.rule=Host(`interledger.test`) && PathPrefix(`/.well-known`)"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"

      - "traefik.tcp.routers.delve.service=delve"
      - "traefik.tcp.routers.delve.rule=HostSNI(`*`)"
      - "traefik.tcp.services.delve.loadbalancer.server.port=2345"

    environment:
      # Core runtime
      - LOG_LEVEL=${BACKEND_LOG_LEVEL:-info}
      - FYNBOS_ENV=${BACKEND_FYNBOS_ENV:-local}

      # Service ports
      - PORT=${BACKEND_PORT:-8080}
      - OPEN_PAYMENTS_PORT=${BACKEND_OPEN_PAYMENTS_PORT:-8081}
      - AUTHORISATION_PORT=${BACKEND_AUTHORISATION_PORT:-8082}

      # Data stores
      - REDIS_URL=${BACKEND_REDIS_URL:-redis://redis:6379/0}
      - DB_URL=${BACKEND_DB_URL:-postgres://postgres:postgres@postgres:5432/backend?sslmode=disable}
      - DB_URL_WITH_CERTS=${BACKEND_DB_URL_WITH_CERTS:-postgres://postgres:postgres@postgres:5432/backend?sslmode=disable}
      - PACIOLI_DB_URL=${BACKEND_PACIOLI_DB_URL:-postgres://postgres:postgres@postgres:5432/pacioli?sslmode=disable}
      - PACIOLI_DB_URL_WITH_CERTS=${BACKEND_PACIOLI_DB_URL_WITH_CERTS:-postgres://postgres:postgres@postgres:5432/pacioli?sslmode=disable}
      - RAFIKI_DB_URL=${BACKEND_RAFIKI_DB_URL:-postgres://postgres:postgres@postgres:5432/rafiki_backend?sslmode=disable}
      - RAFIKI_AUTH_DB_URL=${BACKEND_RAFIKI_AUTH_DB_URL:-postgres://postgres:postgres@postgres:5432/rafiki_auth?sslmode=disable}

      # Internal services
      - KRATOS_URL=${BACKEND_KRATOS_URL:-http://kratos:4433}
      - KRATOS_ADMIN_URL=${BACKEND_KRATOS_ADMIN_URL:-http://kratos:4434}
      - TEMPORAL_URL=${BACKEND_TEMPORAL_URL:-temporal:7233}
      - RAFIKI_BACKEND_GRAPHQL_URL=${BACKEND_RAFIKI_BACKEND_GRAPHQL_URL:-http://rafiki_backend:3001/graphql}
      - RAFIKI_AUTH_GRAPHQL_URL=${BACKEND_RAFIKI_AUTH_GRAPHQL_URL:-http://rafiki_auth:3003/graphql}

