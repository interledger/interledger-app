services:
  # 1. Migrations
  migration:
    build:
      context: ../go
      dockerfile: backend/Dockerfile
      target: builder
    profiles:
      - application
      - backend
    command: "migrate"
    develop:
      watch:
        - path: ../go
          action: rebuild
    restart: on-failure
    environment:
      - FYNBOS_ENV=local
      - RAFIKI_DB_URL=postgres://postgres:postgres@postgres:5432/rafiki_backend?sslmode=disable
      - RAFIKI_AUTH_DB_URL=postgres://postgres:postgres@postgres:5432/rafiki_auth?sslmode=disable
      - DB_URL_WITH_CERTS=postgres://postgres:postgres@postgres:5432/backend?sslmode=disable
      - PACIOLI_DB_URL_WITH_CERTS=postgres://postgres:postgres@postgres:5432/pacioli?sslmode=disable
      - KRATOS_URL=http://kratos:4434 # check it if is public or admin
      - LOG_LEVEL=info

  # 2. Backend
  backend:
    build:
      context: ../go
      dockerfile: backend/Dockerfile
      target: builder
    profiles:
      - application
      - backend
    command: "dev"
    develop:
      watch:
        - path: ../go
          action: rebuild
    restart: always
    ports:
      - "8080:8080" # http port
      - "8081:8081" # open payments port
      - "8082:8082" # authorisation port
      - "8443:8443" # grpc port
      - "8448:8448" # wallet admin port
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`interledger.test`) && PathPrefix(`/webhooks`)"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"

    environment:
      - LOG_LEVEL=debug
      - ENV_FILE=
      - FYNBOS_ENV=local

      - RAFIKI_DB_URL=postgres://postgres:postgres@postgres:5432/rafiki_backend?sslmode=disable
      - RAFIKI_AUTH_DB_URL=postgres://postgres:postgres@postgres:5432/rafiki_auth?sslmode=disable

      - DB_URL_WITH_CERTS=postgres://postgres:postgres@postgres:5432/backend?sslmode=disable
      - DB_URL=postgres://postgres:postgres@postgres:5432/backend?sslmode=disable
      - PACIOLI_DB_URL_WITH_CERTS=postgres://postgres:postgres@postgres:5432/pacioli?sslmode=disable
      - PACIOLI_DB_URL=postgres://postgres:postgres@postgres:5432/pacioli?sslmode=disable

      - KRATOS_URL=http://kratos:4433
      - KRATOS_ADMIN_URL=http://kratos:4434

