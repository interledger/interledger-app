services:
  mockpti:
    build:
      context: ..
      dockerfile: go/mock/mockpti/Dockerfile
    profiles:
      - application
    restart: always
    expose:
      - "8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mockpti.rule=Host(`mockpti.interledger.test`)"
      - "traefik.http.routers.mockpti.entrypoints=websecure"
      - "traefik.http.services.mockpti.loadbalancer.server.port=8080"
    environment:
      LOG_LEVEL: debug

      # Storage configuration
      MOCKPTI_REDIS_URL: redis://redis:6379
      MOCKPTI_REDIS_DB: '5'

      # Provider auth compatibility
      MOCKPTI_CLIENT_ID: ${BACKEND_PTI_CLIENT_ID:-04d3e1b5-96d4-47e4-9eaa-13e9b4b0f219}

      # Webhook configuration
      MOCKPTI_WEBHOOK_URL: http://backend:8080/webhooks/pti
      WEBHOOK_MIN_DELAY_SEC: '0.2'
      MOCKPTI_WEBHOOK_SIGNING_KEY: ${MOCKPTI_WEBHOOK_SIGNING_KEY:------BEGIN PRIVATE KEY-----\nMC4CAQAwBQYDK2VwBCIEIO49I4fkirtnEKgxcZsToTO9y5FS6sRddjmOik17QhVS\n-----END PRIVATE KEY-----}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
