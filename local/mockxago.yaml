services:
  mockxago:
    build:
      context: ..
      dockerfile: go/mock/mockxago/Dockerfile
    profiles:
      - application
    restart: always
    expose:
      - "8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mockxago.rule=Host(`mockxago.interledger.test`)"
      - "traefik.http.routers.mockxago.entrypoints=websecure"
      - "traefik.http.services.mockxago.loadbalancer.server.port=8080"
    environment:
      LOG_LEVEL: debug
      # Storage configuration
      MOCKXAGO_REDIS_URL: redis:6379
      MOCKXAGO_REDIS_DB: '4'  # Use DB 4 (separate from other services)
      
      # Webhook configuration
      WEBHOOK_URL: http://backend:8080/webhooks/xago
      WEBHOOK_SECRET: ${BACKEND_XAGO_WEBHOOK_SECRET:-xago-webhook-secret}
      PERSONA_WEBHOOK_TOKEN: ${BACKEND_PERSONA_WEBHOOK_TOKEN:-test-persona-webhook-token}
      WEBHOOK_MIN_DELAY_SEC: '2'
      
      # API credentials
      XAGO_API_PUBLIC_KEY: ${BACKEND_XAGO_API_PUBLIC_KEY:-test-public-key}
      XAGO_API_SECRET: ${BACKEND_XAGO_API_SECRET:-test-secret}
      XAGO_MOCK_TEST_MODE: "true"

      # Login auth is validated against XAGO_API_PUBLIC_KEY and XAGO_API_SECRET.
      # Protected routes then use bearer-token authentication.
      MOCKXAGO_ENFORCE_AUTHENTICATION: "true"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
