services:
  botanist:
    build:
      context: ../typescript
      dockerfile: botanist/Dockerfile
      target: ${BOTANIST_BUILD_TARGET:-dev}
    profiles:
      - application
      - frontend
    restart: always
    volumes:
      - ../typescript/botanist/app:/app/botanist/app:rw
      # Exclude node_modules from sync - use container's version
      - ./config/botanist.yaml:/etc/botanist/config.yaml:ro
      - ./config-override/botanist.yaml:/etc/botanist/config-override.yaml:ro
    ports:
      - "13000:3000" # http port
      - "18002:8002" # websocket port
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.botanist.rule=Host(`admin.mgnt.interledger.test`)"
      - "traefik.http.routers.botanist.service=botanist"
      - "traefik.http.services.botanist.loadbalancer.server.port=3000"

      - "traefik.http.routers.botanist-ws.rule=Host(`admin.mgnt.interledger.test`) && PathPrefix(`/socket`)"
      - "traefik.http.routers.botanist-ws.service=botanist-ws"
      - "traefik.http.services.botanist-ws.loadbalancer.server.port=8002"

    environment:
      - CHOKIDAR_USEPOLLING=true
      # Everything else is loaded from the mounted config.yaml/config-override.yaml
      # above (see local/config/botanist.yaml) — override values there instead of here.
      - CONFIG=/etc/botanist/config.yaml,/etc/botanist/config-override.yaml

    depends_on:
      - backend
