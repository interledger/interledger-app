services:
  botanist:
    build:
      context: ../typescript/botanist
      target: dev
    profiles:
      - application
      - frontend
    restart: always
    volumes:
      - ../typescript/botanist:/app:rw
      # Exclude node_modules from sync - use container's version
      - /app/node_modules
    ports:
      - "13000:3000" # http port
      - "18002:8002" # websocket port
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.botanist.rule=Host(`admin.mgnt.interledger.test`)"
      - "traefik.http.routers.botanist.service=botanist"
      - "traefik.http.services.botanist.loadbalancer.server.port=3000"

      - "traefik.http.routers.botanist-ws.rule=Host(`admin.mgnt.interledger.test`) && PathPrefix(`/socket`)"
      - "traefik.http.routers.botanist-ws.service=botanist-ws"
      - "traefik.http.services.botanist-ws.loadbalancer.server.port=8002"

    environment:
      - FYNBOS_ENV=local

      - CHOKIDAR_USEPOLLING=true
      - BACKEND_GRPC_URL=backend:8448
      
      - PAYMENT_POINTER_BASE=${BOTANIST_PAYMENT_POINTER_BASE:-local.ilp.link}

    depends_on:
      - backend
