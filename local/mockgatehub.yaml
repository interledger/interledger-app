services:
  mockgatehub:
    # image: ghcr.io/interledger/mockgatehub:1.8
    build:
      context: ../../mockgatehub
    profiles:
      - application
    restart: always
    expose:
      - "8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mockgatehub.rule=Host(`mockgatehub.interledger.test`)"
      - "traefik.http.routers.mockgatehub.entrypoints=websecure"
      - "traefik.http.services.mockgatehub.loadbalancer.server.port=8080"
    environment:
      LOG_LEVEL: info
      # Storage configuration
      MOCKGATEHUB_REDIS_URL: redis://redis:6379
      MOCKGATEHUB_REDIS_DB: '2'  # Use DB 2 (separate from other services)
      WEBHOOK_MIN_DELAY_SEC: '0.1'
      # Webhook configuration - for KYC and deposit events
      WEBHOOK_URL: http://backend:8080/webhooks/gatehub
      WEBHOOK_SECRET: ${GATEHUB_WEBHOOK_SECRET:-6d6f636b5f776562686f6f6b5f736563726574}

      # Auth configuration
      MOCKGATEHUB_VALID_CREDENTIALS: local-test-app-id:local-test-app-secret
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
