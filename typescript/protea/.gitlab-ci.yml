include:
  - //.gitlab-refs.yaml

.job_rules:
  rules:
    - changes:
        - typescript/protea/**/*
    # we need to configure this pipeline to run on merge requests
    # https://gitlab.com/gitlab-org/gitlab/-/merge_requests/25611/diffs
#    - if: $CI_MERGE_REQUEST_ID

variables:
  PROTEA_PROJECT_PATH: $CI_PROJECT_DIR/typescript/protea
  PROTEA_IMAGE_HASH: $CI_COMMIT_SHORT_SHA

image: public.ecr.aws/docker/library/node:16-alpine3.11

build_protea:
  interruptible: true
  tags:
    - hetzner
  image:
    name: registry.gitlab.com/fynbos/fynbos/debian-runner-base:b59a3751
  before_script:
    - docker login -u AWS -p $(aws ecr get-login-password --profile shared
      --region eu-west-1) 823058932981.dkr.ecr.eu-west-1.amazonaws.com
    - cd $PROTEA_PROJECT_PATH
  script:
    - docker build -t
      "823058932981.dkr.ecr.eu-west-1.amazonaws.com/protea:${PROTEA_IMAGE_HASH}"
      .
    - docker push
      "823058932981.dkr.ecr.eu-west-1.amazonaws.com/protea:${PROTEA_IMAGE_HASH}"
    - echo "SENTRY_ORG=fynbos\nSENTRY_PROJECT=frontend\nSENTRY_AUTH_TOKEN=${SENTRY_DSN}" > .env.sentry
    - docker build --target=upload-sourcemaps --secret id=sentry,src=.env.sentry --build-arg IMAGE_HASH="${PROTEA_IMAGE_HASH}" .
