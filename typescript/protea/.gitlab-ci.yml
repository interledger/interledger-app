include:
  - //.gitlab-refs.yaml

.job_rules:
  rules:
    - changes:
        - typescript/protea/**/*
    # we need to configure this pipeline to run on merge requests
    # https://gitlab.com/gitlab-org/gitlab/-/merge_requests/25611/diffs
#    - if: $CI_MERGE_REQUEST_ID

variables:
  PROTEA_PROJECT_PATH: $CI_PROJECT_DIR/typescript/protea
  PROTEA_IMAGE_HASH: $CI_COMMIT_SHORT_SHA

image: public.ecr.aws/docker/library/node:16-alpine3.11

build_protea:
  interruptible: true
  tags:
    - hetzner
  variables:
    DOCKER_AUTH_CONFIG: |
      {
        "credHelpers": {
          "public.ecr.aws": "ecr-login",
          "823058932981.dkr.ecr.eu-west-1.amazonaws.com": "ecr-login"
        }
      }
  image:
    name: registry.gitlab.com/fynbos/fynbos/debian-runner-base:bf6f63da
  before_script:
    - echo "changing directory to $PROTEA_PROJECT_PATH"
    - cd $PROTEA_PROJECT_PATH
  script:
    - docker build -t "823058932981.dkr.ecr.eu-west-1.amazonaws.com/protea:${PROTEA_IMAGE_HASH}" .
    - AWS_PROFILE=shared docker push "823058932981.dkr.ecr.eu-west-1.amazonaws.com/protea:${PROTEA_IMAGE_HASH}"
