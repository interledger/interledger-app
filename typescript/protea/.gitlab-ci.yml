include:
  - //.gitlab-refs.yaml

.job_rules:
  rules:
    - changes:
        - typescript/protea/**/*
    # we need to configure this pipeline to run on merge requests
    # https://gitlab.com/gitlab-org/gitlab/-/merge_requests/25611/diffs
#    - if: $CI_MERGE_REQUEST_ID

variables:
  PROTEA_PROJECT_PATH: $CI_PROJECT_DIR/typescript/protea
  PROTEA_IMAGE_HASH: $CI_COMMIT_SHORT_SHA
  REMIX_PUBLIC_PATH: https://cdn.fynbos.app/protea

image: public.ecr.aws/docker/library/node:16-alpine3.11

build_protea:
  interruptible: true
  tags:
    - hetzner
  image:
    name: registry.gitlab.com/fynbos/fynbos/debian-runner-base:b59a3751
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u
      $CI_REGISTRY_USER --password-stdin
    - cd $PROTEA_PROJECT_PATH
  script:
    - echo -en
      "SENTRY_ORG=fynbos\nSENTRY_PROJECT=frontend\nSENTRY_AUTH_TOKEN=$SENTRY_DSN"
      > .env.sentry
    - echo -en "[cdn]\ntype = s3\nprovider = Cloudflare\nregion=auto\nacl =
      private\nendpoint =
      https://583f5af724d9d4b0ba6d77be24d732b3.r2.cloudflarestorage.com/cdn\naccess_key_id=$CDN_ACCESS_KEY_ID\nsecret_access_key
      = $CDN_ACCESS_KEY" > .env.rclone
    - docker build --build-arg REMIX_PUBLIC_PATH=${REMIX_PUBLIC_PATH}
      --build-arg IMAGE_HASH="${PROTEA_IMAGE_HASH}" -t
      "$CI_REGISTRY/fynbos/fynbos/protea:${PROTEA_IMAGE_HASH}" .
    - docker push "$CI_REGISTRY/fynbos/fynbos/protea:${PROTEA_IMAGE_HASH}"
