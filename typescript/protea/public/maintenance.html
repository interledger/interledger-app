<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#FFE4E6">
    <meta name="og:url" content="https://interledger.app/">

    <title>Interledger Wallet</title>
    <meta property="og:title" content="Interledger Wallet">
    <meta name="description"
        content="Unlock the potential of Open Payments and Web Monetization through the Interledger Wallet and help drive the evolution of digital financial services.">
    <meta property="og:description"
        content="Unlock the potential of Open Payments and Web Monetization through the Interledger Wallet and help drive the evolution of digital financial services.">
    <meta property="og:locale" content="en">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Interledger Wallet">

    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: 248 250 252;
            --text-strong: 15 23 42;
            --bg-primary: 59 130 246;
        }

        @media (prefers-color-scheme: dark) {
            .theme-system {
                --bg-page: 2 6 23;
                --text-strong: 255 255 255;
                --bg-primary: 59 130 246;
            }
        }

        .theme-system {}

        .bg-page {
            background-color: rgb(var(--bg-page) / 1);
        }

        .font-sans {
            font-family: Inter, sans-serif;
        }

        .text-base {
            font-size: 1rem;
            line-height: 1.5rem;
        }

        .font-normal {
            font-weight: 400;
        }

        .text-strong {
            color: rgb(var(--text-strong) / 1);
        }

        .antialiased {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .selection\:bg-brand\/50::selection {
            background-color: rgb(var(--bg-primary) / 0.5);
        }

        /* Responsive Layout */
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            padding: 2rem;
            flex-direction: column;
        }

        .main-title {
            text-align: center;
            margin-top: 4rem;
        }

        .description {
            text-align: justify;
            margin: 5rem auto;
            max-width: 40rem;
        }

        img {
            max-width: 20rem;
        }
    </style>

</head>

<body class="theme-system bg-page font-sans text-base font-normal text-strong antialiased selection:bg-brand/50">
    <img src="./interledger_wallet.svg" />
    <h1 class="main-title">Maintenance Mode</h1>
    <p class="description">We are making updates to your favorite wallet, to fix some issues and add more features. Do
        not worry we'll finish shortly!
        We thank you for your patience and looking forward to seeing you come back soon!</p>
</body>

</html>
