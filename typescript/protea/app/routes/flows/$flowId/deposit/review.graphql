query GetFundingSources {
  fundingSources {
    id
    name
    verificationStatus
    mask
    type
    subType
  }
}

mutation InitiateDeposit($input: DepositInput!) {
  initiateDeposit(input: $input) {
    code
    success
    message
    deposit {
      id
      state
      amount
      timestamp
    }
  }
}
