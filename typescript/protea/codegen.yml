overwrite: true
schema: '../../go/backend/graph/schema.graphql'
documents: '**/*.graphql'
generates:
  generated/types.ts:
    plugins:
      - 'typescript'
      - 'typescript-operations'
      - 'typescript-react-apollo'
    config:
      reactApolloVersion: 3
      withHooks: false
      withHOC: false
      withComponent: false
