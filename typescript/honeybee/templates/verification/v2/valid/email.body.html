<template src="main">
  <p>Hello {{ .Identity.traits.firstName }},</p>
  <h1 style="margin: 24px auto 0">Verify your email address</h1>
  <p style="margin: 24px auto 0">
    Please click the button below to verify your email.
  </p>
  <p style="margin: 16px auto 0">
    If you didn't try register an account with us, you can safely ignore this
    email.
  </p>
  <a class="anchorButton" href="{{ .VerificationURL }}">
    <p style="margin: auto auto; color: white">Verify email</p>
  </a>
</template>
