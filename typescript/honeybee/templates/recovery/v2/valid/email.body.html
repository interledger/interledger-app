<template src="main">
  <p>Hello {{ .Identity.traits.firstName }},</p>
  <h1 style="margin: 24px auto 0">
    There was a request to recover your account
  </h1>
  <p style="margin: 24px auto 0">
    Please click on the button below to recover your account and set a new
    password!
  </p>
  <p style="margin: 16px auto 0">
    If you did not request to recover your account, you can safely ignore this
    email.
  </p>
  <a class="anchorButton" href="{{ .RecoveryURL }}">
    <p style="margin: auto auto; color: white">Recover account</p>
  </a>
</template>
