include:
  - //.gitlab-refs.yaml

.job_rules:
  rules:
    - changes:
        - typescript/botanist/**/*
    # we need to configure this pipeline to run on merge requests
    # https://gitlab.com/gitlab-org/gitlab/-/merge_requests/25611/diffs
#    - if: $CI_MERGE_REQUEST_ID

variables:
  BOTANIST_PROJECT_PATH: $CI_PROJECT_DIR/typescript/botanist
  BOTANIST_IMAGE_HASH: $CI_COMMIT_SHORT_SHA

build_botanist:
  interruptible: true
  tags:
    - hetzner
  image:
    name: registry.gitlab.com/fynbos/fynbos/debian-runner-base
    entrypoint: ['']
  before_script:
    - echo "changing directory to $BOTANIST_PROJECT_PATH"
    - cd $BOTANIST_PROJECT_PATH
  script:
    - docker build -t "823058932981.dkr.ecr.eu-west-1.amazonaws.com/botanist:${BOTANIST_IMAGE_HASH}" .
