include:
  - //.gitlab-refs.yaml

.job_rules:
  rules:
    - changes:
        - typescript/botanist/**/*
    # we need to configure this pipeline to run on merge requests
    # https://gitlab.com/gitlab-org/gitlab/-/merge_requests/25611/diffs
#    - if: $CI_MERGE_REQUEST_ID

variables:
  PROJECT_PATH: $CI_PROJECT_DIR/typescript/botanist
  PROTEA_IMAGE_HASH: $CI_COMMIT_SHORT_SHA

image: public.ecr.aws/docker/library/node:16-alpine3.11

default:
  before_script:
    - echo "changing directory to $PROJECT_PATH"
    - cd $PROJECT_PATH

build_protea:
  interruptible: true
  tags:
    - k8s
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: ['']
  script:
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s"
      "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d
      '\n')\"}},\"credHelpers\":{\"823058932981.dkr.ecr.eu-west-1.amazonaws.com\":\"ecr-login\"}}"
      > /kaniko/.docker/config.json
    - >-
      /kaniko/executor --context "${PROJECT_PATH}" --dockerfile
      "${PROJECT_PATH}/Dockerfile" --destination
      "823058932981.dkr.ecr.eu-west-1.amazonaws.com/botanist:${PROTEA_IMAGE_HASH}"
      --cache=true --cache-repo="${CI_REGISTRY}/fynbos/fynbos/botanist-cache"
      --snapshotMode=redo --use-new-run=true
