include:
  - //.gitlab-refs.yaml

.job_rules:
  rules:
    - changes:
        - typescript/botanist/**/*
    # we need to configure this pipeline to run on merge requests
    # https://gitlab.com/gitlab-org/gitlab/-/merge_requests/25611/diffs
#    - if: $CI_MERGE_REQUEST_ID

variables:
  BOTANIST_PROJECT_PATH: $CI_PROJECT_DIR/typescript/botanist
  BOTANIST_IMAGE_HASH: $CI_COMMIT_SHORT_SHA

build_botanist:
  interruptible: true
  tags:
    - hetzner
  image:
    name: registry.gitlab.com/fynbos/fynbos/debian-runner-base:b59a3751
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u
      $CI_REGISTRY_USER --password-stdin
    - cd $BOTANIST_PROJECT_PATH
  script:
    - docker build -t
      "$CI_REGISTRY/fynbos/fynbos/botanist:${BOTANIST_IMAGE_HASH}" .
    - docker push "$CI_REGISTRY/fynbos/fynbos/botanist:${BOTANIST_IMAGE_HASH}"
