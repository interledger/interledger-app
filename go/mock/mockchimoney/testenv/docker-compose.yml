services:
  redis:
    image: redis:7-alpine
    container_name: mockchimoney-test-redis
    ports:
      - "26381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10

  mockchimoney:
    build:
      context: ../../../..
      dockerfile: go/mock/mockchimoney/Dockerfile
    container_name: mockchimoney-test
    ports:
      - "24180:8080"
    environment:
      - MOCKCHIMONEY_PORT=8080
      - LOG_LEVEL=debug
      - MOCKCHIMONEY_API_KEY=local-test-api-key
      - MOCKCHIMONEY_ENFORCE_AUTHENTICATION=true
      - MOCKCHIMONEY_REDIS_URL=redis://redis:6379
      - MOCKCHIMONEY_REDIS_DB=5
      - WEBHOOK_URL=http://host.docker.internal:18080/webhooks/chimoney
      - CHIMONEY_WEBHOOK_SECRET=local_bG9jYWwtdGVzdC13ZWJob29rLXNlY3JldA==
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
