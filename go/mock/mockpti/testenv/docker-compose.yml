services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: mockpti-valkey-test
    ports:
      - "26380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 5
    volumes:
      - mockpti-valkey-data:/data

  mockpti:
    build:
      context: ../../../../
      dockerfile: go/mock/mockpti/Dockerfile
    container_name: mockpti-test
    ports:
      - "24025:8080"
    environment:
      - MOCKPTI_PORT=8080
      - MOCKPTI_CLIENT_ID=test-client-id
      - MOCKPTI_REDIS_URL=redis://valkey:6379
      - MOCKPTI_WEBHOOK_URL=http://host.docker.internal:24100/webhooks/pti
      - MOCKPTI_WEBHOOK_SIGNING_KEY_B64=${MOCKPTI_WEBHOOK_SIGNING_KEY_B64:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  mockpti-valkey-data:
