<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KYC Action — MockGatehub Admin</title>
<style>
body { font-family: sans-serif; margin: 2rem; }
label { display: block; margin: 0.75rem 0 0.25rem; font-weight: bold; }
select, input { padding: 0.4rem; width: 24rem; }
button { margin-top: 1rem; padding: 0.5rem 1.5rem; cursor: pointer; }
.flash-ok  { color: green; font-weight: bold; }
.flash-err { color: red;   font-weight: bold; }
a { color: #0070f3; }
</style>
</head>
<body>
<h1>KYC Action</h1>
<nav><a href="/ui/">Dashboard</a> | <a href="/ui/actions/kyc">KYC Action</a> | <a href="/ui/actions/card-transaction">Card Transaction</a></nav>
<hr>
{{if .Flash}}<p class="{{if .FlashOK}}flash-ok{{else}}flash-err{{end}}">{{.Flash}}</p>{{end}}
<form method="POST" action="/ui/actions/kyc">
  <label for="userID">User</label>
  <select name="userID" id="userID" required>
    <option value="">-- select user --</option>
    {{range .Users}}
    <option value="{{.ID}}" {{if eq $.SelectedUserID .ID}}selected{{end}}>{{.Email}} ({{.ID}})</option>
    {{end}}
  </select>

  <label for="gateway">Gateway</label>
  <input type="text" name="gateway" id="gateway" value="{{.Gateway}}" placeholder="paywiser-eu-sandbox" required>

  <label for="status">KYC Result</label>
  <select name="status" id="status">
    <option value="accepted" {{if eq .Status "accepted"}}selected{{end}}>Accepted</option>
    <option value="rejected" {{if eq .Status "rejected"}}selected{{end}}>Rejected</option>
    <option value="pending"  {{if eq .Status "pending"}} selected{{end}}>Pending</option>
  </select>

  <button type="submit">Send KYC Webhook</button>
</form>
</body>
</html>
