services:
  redis:
    image: valkey/valkey:8-alpine
    container_name: mockgatehub-test-redis
    ports:
      - "26380:6379"  # Use different port to avoid conflicts
    command: redis-server --save "" --appendonly no  # No persistence
    networks:
      - mockgatehub-test

  mockgatehub:
    build:
      context: ../../../..
      dockerfile: go/mock/mockgatehub/Dockerfile
    # container_name: mockgatehub-test
    ports:
      - "25151:8080"  # Use different port to avoid conflicts
    environment:
      - LOG_LEVEL=debug
      - MOCKGATEHUB_PORT=8080
      - MOCKGATEHUB_REDIS_URL=redis://redis:6379
      - MOCKGATEHUB_REDIS_DB=0
      - WEBHOOK_URL=http://mockgatehub:8080/test-webhook
      - WEBHOOK_SECRET=test-webhook-secret
      - MOCKGATEHUB_ENFORCE_AUTHENTICATION=true
      # Tests invoke card-data links from the host via the mapped port.
      - MOCKGATEHUB_PUBLIC_BASE_URL=http://localhost:25151
    depends_on:
      - redis
    networks:
      - mockgatehub-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  mockgatehub-test:
    driver: bridge
