services:
  redis:
    image: valkey/valkey:8-alpine
    container_name: mockgatehub-test-redis
    ports:
      - "26380:6379"  # Use different port to avoid conflicts
    command: redis-server --save "" --appendonly no  # No persistence
    networks:
      - mockgatehub-test

  mockgatehub:
    build:
      context: ../../../..
      dockerfile: go/mock/mockgatehub/Dockerfile
    # container_name: mockgatehub-test
    ports:
      - "25151:8080"  # Use different port to avoid conflicts
    environment:
      - CONFIG=/config/config.yaml
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    depends_on:
      - redis
    networks:
      - mockgatehub-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  mockgatehub-test:
    driver: bridge
