services:
  redis:
    image: valkey/valkey:8-alpine
    container_name: mockxago-redis-test
    ports:
      - "26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 5
    volumes:
      - mockxago-redis-data:/data

  mockxago:
    build:
      context: ../../../../
      dockerfile: go/mock/mockxago/Dockerfile
    container_name: mockxago-test
    ports:
      - "24024:8080"
    environment:
      - CONFIG=/config/config.yaml
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  mockxago-redis-data:

