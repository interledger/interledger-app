services:
  redis:
    image: redis:7-alpine
    container_name: mockxago-redis-test
    ports:
      - "26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5

  mockxago:
    build:
      context: ../../../../
      dockerfile: go/mock/mockxago/Dockerfile
    container_name: mockxago-test
    ports:
      - "24024:8080"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - XAGO_MOCK_PORT=8080
      - XAGO_API_PUBLIC_KEY=test_public_key_12345
      - XAGO_API_SECRET=test_secret_key_98765
      - XAGO_MOCK_TEST_MODE=true
      - WEBHOOK_URL=http://host.docker.internal:3000/xago/webhooks
      - WEBHOOK_SECRET=test-webhook-secret
      - REDIS_URL=redis:6379
      - REDIS_DB=0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s


