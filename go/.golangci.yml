version: "2"

run:
  timeout: 10m
  # Autogenerated files take too much time and memory to load,
  # even if we skip them with skip-dirs.
  # So we define this tag and use it in the autogenerated files.
  build-tags:
    - codeanalysis
linters:
  enable:
    - gocritic
  exclusions:
    paths:
      - proto
  # Disabled for now
  disable:
    - errcheck
    - staticcheck
  settings:
    gocritic:
      # Run only the ruleguard-backed custom rules; the rest of gocritic's
      # checks are out of scope for this repo for now.
      disable-all: true
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          failOn: all
          rules: "${base-path}/gorules/rules.go"
