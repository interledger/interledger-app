include:
  - //////.gitlab-refs.yaml

.go-cache-pacioli:
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  before_script:
    - mkdir -p .go
  cache:
    policy: pull
    key:
      files:
        - go/go.mod
    paths:
      - .go/pkg/mod/

.job_rules:
  rules:
    - changes:
      - go/go.mod
      - go/pacioli/*

variables:
  SERVICE_PATH: $CI_PROJECT_DIR/go/pacioli
  IMAGE_HASH: $CI_COMMIT_SHORT_SHA
  LD_LIBRARY_PATH: $LD_LIBRARY_PATH:./../../tigerbeetle_go
  DB_URL: postgres://root@crdb:26257/%s?sslmode=disable

test_pacioli:
  image: 823058932981.dkr.ecr.eu-west-1.amazonaws.com/docker:20.10
  extends:
    - .go-cache-pacioli
  needs:
    - go-mod
  services:
    - name: 823058932981.dkr.ecr.eu-west-1.amazonaws.com/cockroach:latest-v21.2
      alias: crdb
      command: ["start-single-node", "--insecure", "--store=type=mem,size=641MiB"]
  interruptible: true
  script:
    - mkdir -p ~/.docker
    - echo $DOCKER_AUTH_CONFIG > ~/.docker/config.json
    - cd $SERVICE_PATH
    - make pull
    - make testci

build_pacioli:
  tags:
    - k8s
  needs:
    - test_pacioli
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}},\"credHelpers\":{\"823058932981.dkr.ecr.eu-west-1.amazonaws.com\":\"ecr-login\"}}" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "${SERVICE_PATH}/../"
      --dockerfile "${SERVICE_PATH}/Dockerfile"
      --destination "823058932981.dkr.ecr.eu-west-1.amazonaws.com/pacioli:${PROTEA_IMAGE_HASH}"
      --cache=true
      --cache-repo="${CI_REGISTRY}/fynbos/fynbos/pacioli-cache"
