include:
  - //////.gitlab-refs.yaml

variables:
  DISCORDBOT_PATH: $CI_PROJECT_DIR/go/discordbot
  DISCORDBOT_REPO: 823058932981.dkr.ecr.eu-west-1.amazonaws.com/discordbot
  DISCORDBOT_IMAGE_HASH: $CI_COMMIT_SHORT_SHA
  GOCACHE: $CI_PROJECT_DIR/go/.cache/go-build
  DB_URL: postgres://postgres:password@postgres:5432/%s?sslmode=disable

test_discordbot:
  needs:
    - job: go-mod
      optional: true
  rules:
    - changes:
        - go/go.mod
        - go/discordbot/**/*
  cache:
    key: $CI_JOB_NAME-$CI_COMMIT_REF_SLUG
    paths:
      - $GOCACHE
    fallback_keys:
      - $CI_JOB_NAME-
  tags:
    - hetzner
  image: registry.gitlab.com/fynbos/fynbos/debian-runner-base:13295664
  services:
    - name: postgres:16.1
      alias: postgres
      variables:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: password
  interruptible: true
  script:
    - curl -o /bin/atlas https://release.ariga.io/atlas/atlas-linux-amd64-v0.23.0 && chmod +x /bin/atlas
    - cd $DISCORDBOT_PATH
    - make -C ../backend generatetestmigrations PG_HOST=postgres
    - make testci
