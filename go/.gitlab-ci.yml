.go-cache:
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  before_script:
    - mkdir -p .go
  cache:
    policy: pull-push
    key:
      files:
        - go/go.mod
    paths:
      - .go/pkg/mod/

go-mod:
  interruptible: true
  tags:
    - hetzner
  image:
    name: registry.gitlab.com/fynbos/fynbos/debian-runner-base:b59a3751
  extends: .go-cache
  rules:
    - changes:
        - go/go.mod
        - go/**/*.go
        - go/.golangci.yml
  script:
    - cd go
    - go mod download
    - make lintci
    - make lint
  artifacts:
    when: always
    reports:
      codequality: ./go/gl-code-quality-report.json
    paths:
      - ./go/gl-code-quality-report.json