type Query{
  identity: Identity
  fundingSources: [FundingSource]!
  account: Account
}

type Mutation {
  onboardAccount: CreateAccountMutationResponse!
  createAccount(input: CreateAccountInput!): CreateAccountMutationResponse!
  verifyAccount(input: VerifyAccountInput!): VerifyAccountMutationResponse!
  linkUsdBankAccount(input: LinkUsdBankAccountInput!): LinkFundingSourceMutationResponse!
  verifyUsdBankAccount(input: VerifyUsdBankAccountInput!): VerifyUsdBankAccountMutationResponse!
  initiateDeposit(input: DepositInput!): DepositMutationResponse!
  initiateWithdrawal(input: WithdrawalInput!): WithdrawalMutationResponse!
  initiateOutgoingPayment(input: OutgoingPaymentInput!): OutgoingPaymentMutationResponse!
}

interface MutationResponse {
  code: String!
  success: Boolean!
  message: String!
}

type Identity {
  id: ID!
  firstName: String!
  lastName: String!
  mobileNumber: String!
  email: String!
  country: String!
}

input CreateAccountInput {
  firstName: String!
  lastName: String!
  mobileNumber: String!
  country: String!
}

type CreateAccountMutationResponse implements MutationResponse {
  code: String!
  success: Boolean!
  message: String!
  account: Account
}

input VerifyAccountInput {
  DateOfBirth: String!
  Address: [String!]!
  State: String!
  City: String!
  PostalCode: String!
  TaxIdNumber: String!
}

type VerifyAccountMutationResponse implements MutationResponse {
  code: String!
  success: Boolean!
  message: String!
  account: Account
}

input LinkUsdBankAccountInput {
  name: String!
  accountNumber: String!
  routingNumber: String!
  institution: String!
  type: String!
}

type FundingSource {
  id: ID!
  name: String!
  verificationStatus: String!
  mask: String!
  type: String!
  subType: String!
}

type LinkFundingSourceMutationResponse implements MutationResponse {
  code: String!
  success: Boolean!
  message: String!
  fundingSource: FundingSource
}

type VerifyUsdBankAccountMutationResponse implements MutationResponse {
  code: String!
  success: Boolean!
  message: String!
  fundingSource: FundingSource
}

input VerifyUsdBankAccountInput {
  FundingSourceId: String!
}

input DepositInput {
  fundingSourceID: ID!
  amount: String!
}

type DepositMutationResponse implements MutationResponse {
  code: String!
  success: Boolean!
  message: String!
  transaction: Transaction
}

enum TransactionType {
  DEPOSIT
  WITHDRAWAL
  SENT
}

type Transaction {
  id: ID!
  type: TransactionType!
  description: String!
  amount: String!
  timestamp: String!
  status: String!
}

input WithdrawalInput {
  fundingSourceID: ID!
  amount: String!
}

type WithdrawalMutationResponse implements MutationResponse {
  code: String!
  success: Boolean!
  message: String!
  transaction: Transaction
}

input OutgoingPaymentInput{
  amount: String!
  to: String!
}

type OutgoingPaymentMutationResponse implements MutationResponse {
  code: String!
  success: Boolean!
  message: String!
  transaction: Transaction
}

type Account {
  id: ID!
  balance: String!
  recentTransactions: [Transaction!]!
}
