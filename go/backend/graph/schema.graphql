type Query{
  identity: Identity
}

type Mutation {
  createIdentity(input: CreateIdentityInput!): CreateIdentityMutationResponse!
  verify(input: VerificationInput!): VerifyMutationResponse!
  linkUsdBankAccount(input: LinkUsdBankAccountInput!): LinkFundingSourceMutationResponse!
  verifyUsdBankAccount(input: VerifyUsdBankAccountInput!): VerifyUsdBankAccountMutationResponse!
}

interface MutationResponse {
  code: String!
  success: Boolean!
  message: String!
}

type Identity {
  id: ID!
  firstName: String!
  lastName: String!
  mobileNumber: String!
  email: String!
  dateOfBirth: String!
  address: [String]!
  state: String!
  city: String!
  postalCode: String!
  country: String!
  taxIdNumber: String!
  verificationState: String!
}

input CreateIdentityInput {
  firstName: String!
  lastName: String!
  mobileNumber: String!
  country: String!
}

type CreateIdentityMutationResponse implements MutationResponse {
  code: String!
  success: Boolean!
  message: String!
  identity: Identity
}

input VerificationInput {
  DateOfBirth: String!
  Address: [String!]!
  State: String!
  City: String!
  PostalCode: String!
  TaxIdNumber: String!
}

type VerifyMutationResponse implements MutationResponse {
  code: String!
  success: Boolean!
  message: String!
  identity: Identity
}

input LinkUsdBankAccountInput {
  name: String!
  accountNumber: String!
  routingNumber: String!
  institution: String!
  type: String!
}

type FundingSource {
  id: ID!
  name: String!
  verificationStatus: String!
  mask: String!
  type: String!
  subType: String!
}

type LinkFundingSourceMutationResponse implements MutationResponse {
  code: String!
  success: Boolean!
  message: String!
  fundingSource: FundingSource
}

type VerifyUsdBankAccountMutationResponse implements MutationResponse {
  code: String!
  success: Boolean!
  message: String!
  fundingSource: FundingSource
}

input VerifyUsdBankAccountInput {
  FundingSourceId: String!
}