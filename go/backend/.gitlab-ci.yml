include:
  - //////.gitlab-refs.yaml

.go-cache:
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  before_script:
    - mkdir -p .go
  cache:
    policy: pull
    key:
      files:
        - go/go.mod
    paths:
      - .go/pkg/mod/

.job_rules:
  rules:
    - changes:
      - go/go.mod
      - go/backend/*

variables:
  BACKEND_PATH: $CI_PROJECT_DIR/go/backend
  DOCKER_CONTEXT: $CI_PROJECT_DIR/go
  BACKEND_REPO: 823058932981.dkr.ecr.eu-west-1.amazonaws.com/backend
  BACKEND_IMAGE_HASH: $CI_COMMIT_SHORT_SHA

build_backend:
  image: 823058932981.dkr.ecr.eu-west-1.amazonaws.com/docker:19.03.12
  services: !reference [.docker_services, services]
  variables:
     DOCKER_HOST: !reference [.docker_services, variables, DOCKER_HOST]
     DOCKER_TLS_CERTDIR: !reference [.docker_services, variables, DOCKER_TLS_CERTDIR]
     DOCKER_DRIVER: !reference [.docker_services, variables, DOCKER_DRIVER]
  extends:
    - .go-cache
  needs:
    - go-mod
  interruptible: true
  script:
    - cd $BACKEND_PATH
    - echo "Running tests"
    - go test ./...
    - echo "Test finished"
    - echo "Building Image"
    - mkdir -p ~/.docker
    - echo $DOCKER_AUTH_CONFIG > ~/.docker/config.json
    - >-
      DOCKER_BUILDKIT=1 docker build
      --cache-from ${BACKEND_REPO}:${BACKEND_IMAGE_HASH}-base
      -t ${BACKEND_REPO}:${BACKEND_IMAGE_HASH}
      -f $BACKEND_PATH/Dockerfile
      $DOCKER_CONTEXT
      - docker push ${BACKEND_REPO}:${BACKEND_IMAGE_HASH}
    - echo "Build Finished"