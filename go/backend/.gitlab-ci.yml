include:
  - //////.gitlab-refs.yaml

.go-cache-backend:
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  before_script:
    - mkdir -p .go
  cache:
    policy: pull
    key:
      files:
        - go/go.mod
    paths:
      - .go/pkg/mod/

variables:
  BACKEND_PATH: $CI_PROJECT_DIR/go/backend
  BACKEND_REPO: 823058932981.dkr.ecr.eu-west-1.amazonaws.com/backend
  BACKEND_IMAGE_HASH: $CI_COMMIT_SHORT_SHA
  DB_URL: postgres://postgres:password@postgres:5432/%s?sslmode=disable
  GOCACHE: $CI_PROJECT_DIR/go/.cache/go-build

test_backend:
  needs:
    - job: go-mod
      optional: true
  rules:
    - changes:
        - go/go.mod
        - go/backend/**/*
        - go/proto/**/*
  tags:
    - hetzner
  cache:
    key: $CI_JOB_NAME-$CI_COMMIT_REF_SLUG
    paths:
      - $GOCACHE
    fallback_keys:
      - $CI_JOB_NAME-
  image: registry.gitlab.com/fynbos/fynbos/debian-runner-base:13295664
  services:
    - name: postgres:16.1
      alias: postgres
      variables:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: password
  interruptible: true
  script:
    - curl -o /bin/atlas https://release.ariga.io/atlas/atlas-linux-amd64-v0.23.0 && chmod +x /bin/atlas
    - cd $BACKEND_PATH
    - make generatetestmigrations PG_HOST=postgres
    - make testci

build_backend:
  interruptible: true
  tags:
    - hetzner
  image:
    name: registry.gitlab.com/fynbos/fynbos/debian-runner-base:13295664
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - cd $BACKEND_PATH/../
  script:
    - docker build -t "$CI_REGISTRY/fynbos/fynbos/backend:${BACKEND_IMAGE_HASH}" -f backend/Dockerfile .
    - docker push "$CI_REGISTRY/fynbos/fynbos/backend:${BACKEND_IMAGE_HASH}"
