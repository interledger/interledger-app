include:
  - //////.gitlab-refs.yaml

.go-cache-backend:
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  before_script:
    - mkdir -p .go
  cache:
    policy: pull
    key:
      files:
        - go/go.mod
    paths:
      - .go/pkg/mod/

variables:
  BACKEND_PATH: $CI_PROJECT_DIR/go/backend
  BACKEND_REPO: 823058932981.dkr.ecr.eu-west-1.amazonaws.com/backend
  BACKEND_IMAGE_HASH: $CI_COMMIT_SHORT_SHA
  DB_URL: postgres://root@crdb:26257/%s?sslmode=disable

test_backend:
  rules:
    - changes:
        - go/go.mod
        - go/backend/**/*
        - go/proto/**/*
  tags:
    - hetzner
  image: registry.gitlab.com/fynbos/fynbos/debian-runner-base
  services:
    - name: cockroachdb/cockroach:latest-v21.2
      alias: crdb
      command: ["start-single-node", "--insecure", "--store=type=mem,size=641MiB"]
  interruptible: true
  script:
    - curl -o /bin/atlas https://release.ariga.io/atlas/atlas-linux-amd64-v0.8.1 && chmod +x /bin/atlas
    - cd $BACKEND_PATH
    - make testci

build_backend:
  interruptible: true
  tags:
    - hetzner
  image:
    name: registry.gitlab.com/fynbos/fynbos/debian-runner-base
    entrypoint: [ '' ]
  before_script:
    - echo "changing directory to $BOTANIST_PROJECT_PATH"
    - cd $BACKEND_PATH/../
  script:
    - docker build -t "823058932981.dkr.ecr.eu-west-1.amazonaws.com/backend:${BACKEND_IMAGE_HASH}" -f backend/Dockerfile .
