test-backend:
  stage: test
  script:
    - DIND_IP=$(cat /etc/hosts | awk '{if ($2 == "docker") print $1;}')
    # performing all steps here for now until ecr is set up
    - DOCKER_BUILDKIT=1 docker build -t $BACKEND_IMAGE:dev --target dev -f $BACKEND_PATH/Dockerfile $DOCKER_CONTEXT
    - docker run $BACKEND_IMAGE:dev lint
    # connect to docker dind network and tell Testcontainers to use dind as remote host.
    - docker run --network host --env DOCKER_HOST=tcp://$DIND_IP:2375 $BACKEND_IMAGE:dev test
    - DOCKER_BUILDKIT=1 docker build -t $BACKEND_IMAGE -f $BACKEND_PATH/Dockerfile $DOCKER_CONTEXT
  interruptible: true

