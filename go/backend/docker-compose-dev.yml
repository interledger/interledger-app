version: "3.5"

services:
  postgres:
    image: postgres:16.1
    networks:
      ilp-dev:
    ports:
      - "5432:5432"
    volumes:
      - "postgres:/var/lib/postgresql/data"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
volumes:
  postgres:

networks:
  ilp-dev:
