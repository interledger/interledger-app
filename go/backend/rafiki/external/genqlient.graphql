mutation CreateWalletAddress($input: CreateWalletAddressInput!){
    createWalletAddress(input: $input) {
        walletAddress {
            id
        }
    }
}
mutation DepositOutgoingPaymentLiquidity($input: DepositOutgoingPaymentLiquidityInput!) {
    depositOutgoingPaymentLiquidity(input: $input) {
        success
    }
}
mutation CreateWalletAddressKey($input: CreateWalletAddressKeyInput!){
    createWalletAddressKey(input: $input) {
        walletAddressKey {
            id
            walletAddressId
            jwk {
                kid
            }
        }
    }
}
mutation RevokeWalletAddressKey($input: RevokeWalletAddressKeyInput!){
    revokeWalletAddressKey(input: $input) {
        walletAddressKey {
            id
            walletAddressId
            revoked
            createdAt
        }
    }
}
mutation RevokeGrant ($input: RevokeGrantInput!) {
    revokeGrant (
        input: $input
    ) {
        id
    }
}

mutation UpdateWalletAddress($input: UpdateWalletAddressInput!) {
		updateWalletAddress(input: $input) {
		walletAddress {
					id
				}
			}
		}

mutation CancelOutgoingPayment($input: CancelOutgoingPaymentInput!) {
        cancelOutgoingPayment(input: $input) {
        payment {
                id
            }
        }
}
query GetGrant ($id: ID!) {
    grant (id: $id) {
        id
        client
        state
        finalizationReason
        createdAt
        access {
            id
            identifier
            type
            actions
            createdAt
            limits {
                receiver
                interval
                debitAmount {
                    value
                    assetCode
                    assetScale
                }
                receiveAmount {
                    value
                    assetCode
                    assetScale
                }
            }
        }
    }
}

query ListGrants ($filter: GrantFilter) {
    grants (
        filter: $filter
    ) {
        pageInfo {
            endCursor
            hasNextPage
            hasPreviousPage
            startCursor
        }
        edges {
            node {
                id
                client
                state
                finalizationReason
                createdAt
                access {
                    id
                    identifier
                    type
                    actions
                    createdAt
                    limits {
                        receiver
                        interval
                        debitAmount {
                            value
                            assetCode
                            assetScale
                        }
                        receiveAmount {
                            value
                            assetCode
                            assetScale
                        }
                    }
                }
            }
            cursor
        }
    }
}

query GetIncomingPayment ($id: String!) {
    incomingPayment(id: $id) {
        id
        walletAddressId
        state
        expiresAt
        createdAt
    }
}

query GetWalletAddress ($id: String!) {
    walletAddress(id: $id) {
        id
        status
        url
        asset {
            id
            code
            scale
        }
    }
}

query GetAssets () {
    assets() {
        edges {
            node {
                id
                code
            }
        }
    }
}

mutation CreateOutgoingPaymentWithdrawal($input: CreateOutgoingPaymentWithdrawalInput!) {
    createOutgoingPaymentWithdrawal(input: $input) {
        success
    }
}

mutation CreateIncomingPaymentWithdrawal($input: CreateIncomingPaymentWithdrawalInput!) {
    createIncomingPaymentWithdrawal(input: $input) {
        success
    }
}
