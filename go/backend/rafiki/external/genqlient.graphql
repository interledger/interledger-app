mutation CreateWalletAddress($input: CreateWalletAddressInput!){
    createWalletAddress(input: $input) {
        code
        success
        message
        walletAddress {
            id
        }
    }
}
mutation DepositEventLiquidity($input: DepositEventLiquidityInput!) {
    depositEventLiquidity(input: $input) {
        code
        error
        success
        message
    }
}
mutation CreateWalletAddressKey($input: CreateWalletAddressKeyInput!){
    createWalletAddressKey(input: $input) {
        code
        success
        message
        walletAddressKey {
            id
            walletAddressId
            jwk {
                kid
            }
        }
    }
}
mutation RevokeWalletAddressKey($input: RevokeWalletAddressKeyInput!){
    revokeWalletAddressKey(input: $input) {
        code
        success
        message
    }
}
mutation RevokeGrant ($input: RevokeGrantInput!) {
    revokeGrant (
        input: $input
    ) {
        code
        success
        message
    }
}

query GetGrant ($id: ID!) {
    grant (id: $id) {
        id
        client
        state
        finalizationReason
        createdAt
    }
}

query ListGrants ($after: String, $before: String, $first: Int, $last: Int, $filter: GrantFilter) {
    grants (
        after: $after,
        before: $before,
        first: $first,
        last: $last,
        filter: $filter
    ) {
        pageInfo {
            endCursor
            hasNextPage
            hasPreviousPage
            startCursor
        }
        edges {
            node {
                id
                client
                state
                finalizationReason
                createdAt
            }
            cursor
        }
    }
}