mutation CreateWalletAddress($input: CreateWalletAddressInput!){
    createWalletAddress(input: $input) {
        code
        success
        message
        walletAddress {
            id
        }
    }
}
mutation DepositEventLiquidity($input: DepositEventLiquidityInput!) {
    depositEventLiquidity(input: $input) {
        code
        error
        success
        message
    }
}
mutation CreateWalletAddressKey($input: CreateWalletAddressKeyInput!){
    createWalletAddressKey(input: $input) {
        code
        success
        message
        walletAddressKey {
            id
            walletAddressId
            jwk {
                kid
            }
        }
    }
}
mutation RevokeWalletAddressKey($input: RevokeWalletAddressKeyInput!){
    revokeWalletAddressKey(input: $input) {
        code
        success
        message
    }
}
mutation RevokeGrant ($input: RevokeGrantInput!) {
    revokeGrant (
        input: $input
    ) {
        code
        success
        message
    }
}

query GetGrant ($id: ID!) {
    grant (id: $id) {
        id
        client
        state
        finalizationReason
        createdAt
        access {
            id
            identifier
            type
            actions
            createdAt
            limits {
                receiver
                interval
                debitAmount {
                    value
                    assetCode
                    assetScale
                }
                receiveAmount {
                    value
                    assetCode
                    assetScale
                }
            }
        }
    }
}

query ListGrants ($filter: GrantFilter) {
    grants (
        filter: $filter
    ) {
        pageInfo {
            endCursor
            hasNextPage
            hasPreviousPage
            startCursor
        }
        edges {
            node {
                id
                client
                state
                finalizationReason
                createdAt
                access {
                    id
                    identifier
                    type
                    actions
                    createdAt
                    limits {
                        receiver
                        interval
                        debitAmount {
                            value
                            assetCode
                            assetScale
                        }
                        receiveAmount {
                            value
                            assetCode
                            assetScale
                        }
                    }
                }
            }
            cursor
        }
    }
}

query GetIncomingPayment ($id: String!) {
    incomingPayment(id: $id) {
        id
        walletAddressId
        state
        expiresAt
        createdAt
    }
}

query GetWalletAddress ($id: String!) {
    walletAddress(id: $id) {
        id
        status
        url
        asset {
            id
            code
            scale
        }
    }
}
