# =============================================================================
# Interledger App — Combined Helm Chart
#
# This chart deploys three components in a single release:
#   admin    — Botanist (admin portal, ilf-wallet-admin)
#   backend  — Go backend API server + Temporal worker (ilf-wallet-backend)
#   frontend — Protea (user-facing wallet frontend, ilf-wallet-frontend)
#
# Each component lives under its own top-level key so values never collide.
# Secrets are component-scoped: <fullname>-admin, <fullname>-backend, <fullname>-frontend.
# =============================================================================

# =============================================================================
# ADMIN — Botanist admin portal
# =============================================================================
admin:
  enabled: true

  imageOverride:
    repository: europe-west4-docker.pkg.dev/wallet-451208/interledger-app
    name: botanist
    # tag: vA.B.C  — defaults to .Chart.AppVersion

  # List of Kubernetes Secret names configa is allowed to read via the in-cluster
  # Secrets API. A Role + RoleBinding are created when this is non-empty and
  # admin.server.serviceAccount.name is set.
  secretAccess: []

  # Botanist start config — serialised verbatim as config.yaml in a ConfigMap and
  # mounted at /etc/admin/config.yaml. Secret values may use configa templates:
  #   myKey: '{{ secret "my-secret" "keyName" }}'
  # configa resolves these against the K8s Secrets API at pod startup.
  config:
    # Defaults to <fullname>-backend-service-grpc:8448 when unset (raw gRPC
    # dial target — host:port, no scheme).
    backend_grpc_url: ""
    payment_pointer_base: "development.ilp.link"

  server:
    name: admin-server
    enabled: true
    image:
      repository: europe-west4-docker.pkg.dev/wallet-451208/interledger-app
      name: botanist
      # tag: vA.B.C  — defaults to .Chart.AppVersion
    imagePullPolicy: Always
    minReadySeconds: 10
    replicaCount: 2
    serviceAccount:
      create: false
      annotations: {}
      name: ""
    envFrom: []
    env:
      - name: CONFIG
        value: /etc/admin/config.yaml
    volumeMounts:
      - name: config
        mountPath: /etc/admin
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 1024Mi
        cpu: 1000m
    livenessProbe:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 3
      httpGet:
        path: /healthz
        port: 3000
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 3
      httpGet:
        path: /healthz
        port: 3000
    ports:
      - name: http
        containerPort: 3000
    service:
      name: admin-service
      type: ClusterIP
      ports:
        - port: 3000
          targetPort: 3000
          protocol: TCP
          name: http
    podDisruptionBudget:
      enabled: true
      annotations: {}
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule

# =============================================================================
# BACKEND — Go API server + Temporal worker
# =============================================================================
backend:
  # Override the container image used across ALL backend resources (server,
  # worker, and migration job). Per-resource overrides take precedence.
  imageOverride:
    repository: europe-west4-docker.pkg.dev/wallet-451208/interledger-app
    name: backend
    # tag: vA.B.C  — defaults to .Chart.AppVersion

  # Migration job — runs as a pre-install/pre-upgrade Helm hook.
  # The job can use a different image than the main deployments.
  initialisation:
    serviceAccountName: ""
    imagePullPolicy: Always
    # image:
    #   repository: europe-west4-docker.pkg.dev/wallet-451208/interledger-app
    #   name: backend
    #   tag: vA.B.C

  # List of Kubernetes Secret names configa is allowed to read via the in-cluster
  # Secrets API. A Role + RoleBinding are created when this is non-empty and
  # backend.server.serviceAccount.name is set.
  secretAccess: []

  # Backend start config — serialised verbatim as config.yaml in a ConfigMap and
  # mounted at /etc/backend/config.yaml. Secret values may use configa templates:
  #   url: '{{ secret "my-secret" "keyName" }}'
  # configa resolves these against the K8s Secrets API at pod startup.
  config:
    environment:
      # mode is the behavioural switch (consumed by env.SetFynbosEnv). Valid values:
      # prod, sandbox, dev, local, test.
      mode: dev
      # label is the human-readable tag attached to monitoring signals (Sentry, OTEL, etc.).
      # Typically "production", "sandbox", or similar.
      label: unknown
    port: "8080"
    application_url: ""
    log_level: "info"
    log_output_path: "stdout"
    allowed_wallet_ids: []
    blocked_regions: []

    agreements:
      folder_name: ""
      signup_agreement_ids: []

    db:
      url: ""
      pacioli_url: ""

    kratos:
      url: "http://kratos.wallet:4433"
      admin_url: "http://kratos.wallet:4434"

    temporal:
      url: "temporal:7233"

    rafiki:
      node_enabled: false
      backend_graphql_url: "http://rafiki-backend:3001/graphql"
      auth_graphql_url: "http://rafiki-auth:3003/graphql"
      operator_tenant_id: ""
      admin_api_secret: ""
      signature_version: ""
      db_url: ""
      auth_db_url: ""

    gatehub:
      # helm-only flag: toggles Helm-level validation for GateHub fields (ignored by Go)
      enabled: true
      api_base_url: ""
      onboarding_base_url: ""
      on_off_ramp_base_url: ""
      fallback_webhook_url: ""
      organization_id: ""
      sending_user_id: ""
      sending_user_address: ""
      intermediary_user_id: ""
      intermediary_user_address: ""
      eur_ops_account: ""
      eur_ops_ledger_id: 0
      on_off_ramp_client_id: ""
      onboarding_client_id: ""
      exchange_client_id: ""
      card_account_product_code: ""
      app_id: ""
      secret: ""
      webhook_secret: ""
      gateway_id: ""
      paywiser_euro_vault_id: ""
      card_app_id: ""

    xago:
      api_base_url: ""
      identity_base_url: ""
      policy_id: ""
      api_secret: ""
      api_public_key: ""

    pti:
      enabled: false
      base_url: ""
      sdk_url: ""
      forms_url: ""
      jwk: ""
      public_key_jwk: ""
      client_id: ""

    persona:
      base_url: "https://api.withpersona.com/api/v1/"
      token: ""
      webhook_token: ""
      # Persona sandbox workaround: sandbox always returns an American profile so
      # the ZA ID field is null. Setting true makes the backend synthesise a ZA ID
      # (required for Xago subaccount creation). Must be false in production:
      # environment.mode=prod with sandbox_fake_za_id=true is rejected at render
      # time and on startup.
      sandbox_fake_za_id: false

    twilio:
      # When enabled=false the backend runs a no-op verification service that
      # "sends" codes without contacting Twilio and treats any submitted code as
      # valid. This is only permitted outside production: environment.mode=prod
      # with twilio.enabled=false is rejected at render time and on startup.
      # Defaults to disabled for non-prod; override to true to test real Twilio.
      enabled: false
      account_sid: ""
      service_sid: ""
      account_token: ""

    email:
      enabled: false
      sendgrid:
        api_key: ""
        from_name: ""
        from_email: ""
        one_template_id: ""
        support_email: ""

    slack:
      client_id: ""
      client_secret: ""
      signing_secret: ""
      token: ""
      channel_signup_kyc: ""
      channel_transaction: ""
      channel_error: ""

    chimoney:
      webhook_secret: ""
      token: ""

    admin:
      # Used to configure the admin portal's OIDC integration with Cloudflare Access.
      policy_aud: ""
      team_domain: ""
      # Used to create links to the admin portal for support purposes.
      base_url: ""

    mobile:
      apple_app_id: ""
      android_package_name: ""
      android_sha256: ""

    vault:
      addr: "http://vault:8200"
      transit_engine_path: "transit/prod/backend"

    sentry:
      dsn: ""

    # Not used at runtime; kept to satisfy struct validation.
    smarty:
      auth_id: "not_used"
      auth_token: "not_used"

    pusher:
      addr: ""

    segment:
      key: ""

  # Migration job config — serialised as config.yaml in a separate ConfigMap and
  # mounted at /etc/backend/config.yaml in the migration init-job.
  migration:
    config:
      environment:
        mode: ""
      agreements:
        folder_name: ""
      db_url: ""
      pacioli_db_url: ""
      kratos_url: "http://kratos.wallet:4434"
      log_level: "info"
      log_output_path: "stderr"
      label: ""
      sentry:
        dsn: ""

  server:
    enabled: true
    minReadySeconds: 10
    replicaCount: 2
    name: backend-server
    image:
      repository: europe-west4-docker.pkg.dev/wallet-451208/interledger-app
      name: backend
      # tag: vA.B.C  — defaults to .Chart.AppVersion
    imagePullPolicy: Always
    livenessProbe:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 3
      httpGet:
        path: /healthz
        port: 8080
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 3
      httpGet:
        path: /healthz
        port: 8080
    args:
      - "start"
    serviceAccount:
      create: false
      name: ""
    envFrom: []
    env:
      - name: PGSSLMODE
        value: disable
      - name: CONFIG
        value: /etc/backend/config.yaml
      - name: REDIS_URL
        valueFrom:
          secretKeyRef:
            name: '{{ include "common.fullname" . }}-backend'
            key: "redisURL"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "grpc://api.honeycomb.io:443"
      - name: OTEL_EXPORTER_OTLP_HEADERS
        valueFrom:
          secretKeyRef:
            name: '{{ include "common.fullname" . }}-backend'
            key: "otelExporterHeaders"
      - name: OTEL_SERVICE_NAME
        value: "backend"
    volumeMounts:
      - name: config
        mountPath: /etc/backend
        readOnly: true
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 1000Mi
        cpu: 1000m
    ports:
      - name: grpc
        containerPort: 8443
      - name: admin
        containerPort: 8448
      - name: http
        containerPort: 8080
    service:
      grpc:
        name: backend-service-grpc
        annotations:
          traefik.ingress.kubernetes.io/service.serversscheme: h2c
        type: ClusterIP
        ports:
          - port: 8448
            targetPort: 8448
            protocol: TCP
            name: admin
          - port: 8443
            targetPort: 8443
            protocol: TCP
            name: grpc
            appProtocol: HTTP2
      http:
        name: backend-service-http
        type: ClusterIP
        ports:
          - port: 8080
            targetPort: 8080
            protocol: TCP
            name: http
    podDisruptionBudget:
      enabled: true
      annotations: {}
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule

  worker:
    enabled: true
    replicaCount: 2
    minReadySeconds: 10
    name: backend-worker
    image:
      repository: europe-west4-docker.pkg.dev/wallet-451208/interledger-app
      name: backend
      # tag: vA.B.C  — defaults to .Chart.AppVersion
    imagePullPolicy: Always
    args:
      - "worker"
    livenessProbe:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 3
      httpGet:
        path: /healthz
        port: 8081
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 3
      httpGet:
        path: /healthz
        port: 8081
    envFrom: []
    env:
      - name: PGSSLMODE
        value: disable
      - name: CONFIG
        value: /etc/backend/config.yaml
      - name: REDIS_URL
        valueFrom:
          secretKeyRef:
            name: '{{ include "common.fullname" . }}-backend'
            key: "redisURL"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "grpc://api.honeycomb.io:443"
      - name: OTEL_EXPORTER_OTLP_HEADERS
        valueFrom:
          secretKeyRef:
            name: '{{ include "common.fullname" . }}-backend'
            key: "otelExporterHeaders"
      - name: OTEL_SERVICE_NAME
        value: "backend"
    volumeMounts:
      - name: config
        mountPath: /etc/backend
        readOnly: true
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 1000Mi
        cpu: 1000m
    podDisruptionBudget:
      enabled: true
      annotations: {}
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule


# =============================================================================
# FRONTEND — Protea user-facing wallet
# =============================================================================
frontend:
  enabled: true

  imageOverride:
    repository: europe-west4-docker.pkg.dev/wallet-451208/interledger-app
    name: protea
    # tag: vA.B.C  — defaults to .Chart.AppVersion

  # List of Kubernetes Secret names configa is allowed to read via the in-cluster
  # Secrets API. A Role + RoleBinding are created when this is non-empty and
  # frontend.server.serviceAccount.name is set.
  secretAccess: []

  # Protea start config — serialised verbatim as config.yaml in a ConfigMap and
  # mounted at /etc/frontend/config.yaml. Secret values may use configa templates:
  #   dsn: '{{ secret "my-secret" "keyName" }}'
  # configa resolves these against the K8s Secrets API at pod startup.
  config:
    environment: dev
    log_level: "info"
    log_pretty: false

    # A single Kubernetes Secret key can only hold a string, so in-cluster this
    # is usually set via a {{ secret ... }} template resolving to a
    # JSON-encoded array (e.g. '{{ secret "frontend-secrets" "cookieSecrets" }}'),
    # which the app JSON-decodes. Plain environments can list values directly.
    cookie_secrets: []

    backend:
      # Defaults to http://<fullname>-backend-service-grpc:8443 when unset.
      grpc_url: ""
      # Defaults to http://<fullname>-backend-service-http:8080 when unset.
      http_url: ""

    redis:
      url: ""

    kratos:
      url: http://kratos-public

    rafiki:
      auth_endpoint: http://rafiki-auth-service:3009
      auth_secret: ""

    pti:
      client_id: ""
      sdk_url: "https://sdk.staging.fiant.io/latest/index.js"
      forms_url: "https://forms.staging.fiant.io"

    sentry:
      dsn: ""
      env_label: ""

    pusher:
      app_key: ""
      app_cluster: "eu"

    rate_limit:
      requests: 4
      window_seconds: 3600

    payment_pointer_base: development.ilp.link

    # Base URL of the app itself (scheme + host). Used to build self-referential
    # links in legal and contact pages. Required.
    target_host: ""

    # Support email address shown in error messages and legal pages. Required.
    support_email: ""

    # Public hostname for the Open Payments auth server. Required.
    public_op_auth_host: ""

    # URL to the Persona identity verification SDK script. Defaults to the
    # current production Persona CDN URL; override per environment if needed.
    persona_sdk_url: "https://cdn.withpersona.com/dist/persona-v4.8.0-alpha.js"

    # Base URL for the Xago/Persona KYC iframe (`/v1/inquiries/<id>/iframe` is
    # appended at runtime). Empty string disables the Xago iframe flow and falls
    # back to the Persona SDK flow. Not required in environments that use Persona
    # SDK directly.
    mockxago_endpoint: ""

    google_maps_api_key: ""

    # Open Payments Interledger Pay (quick-pay) support. When disabled, the
    # remaining op_intpay.* values are unused and the quick-pay routes are
    # inaccessible. Validation of the required fields when enabled lives in
    # templates/validation.frontend.yaml.
    op_intpay:
      enabled: false
      # Public base URL of the wallet's Open Payments auth server used to build
      # quick-pay links. Required when enabled.
      host: ""
      # URL the client is redirected back to once a quick-pay grant completes.
      # Required when enabled.
      redirect_url: ""
      # Wallet address (payment pointer) used as the Open Payments client
      # identity for quick-pay grant requests. Required when enabled.
      wallet_address: ""
      # Key id and base64-encoded Ed25519 private key of the Open Payments
      # client. Typically set via a {{ secret ... }} template; required when enabled.
      key_id: ""
      private_key: ""

  server:
    name: frontend-server
    enabled: true
    image:
      repository: europe-west4-docker.pkg.dev/wallet-451208/interledger-app
      name: protea
      # tag: vA.B.C  — defaults to .Chart.AppVersion
    imagePullPolicy: Always
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    nodeSelector: {}
    serviceAccount:
      create: false
      annotations: {}
      name: ""
    service:
      name: frontend-service
      type: ClusterIP
      ports:
        - port: 3000
          targetPort: 3000
          protocol: TCP
          name: http
    livenessProbe:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 3
      httpGet:
        path: /healthz
        port: 3000
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 3
      httpGet:
        path: /healthz
        port: 3000
    envFrom: []
    env:
      - name: CONFIG
        value: /etc/frontend/config.yaml
    volumeMounts:
      - name: config
        mountPath: /etc/frontend
    ports:
      - name: http
        containerPort: 3000
    resources:
      requests:
        memory: 256Mi
        cpu: 80m
      limits:
        memory: 1024Mi
        cpu: 1000m
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
