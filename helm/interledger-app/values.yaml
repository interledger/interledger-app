# =============================================================================
# Interledger App — Combined Helm Chart
#
# This chart deploys three components in a single release:
#   admin    — Botanist (admin portal, ilf-wallet-admin)
#   backend  — Go backend API server + Temporal worker (ilf-wallet-backend)
#   frontend — Protea (user-facing wallet frontend, ilf-wallet-frontend)
#
# Each component lives under its own top-level key so values never collide.
# Secrets are component-scoped: <fullname>-admin, <fullname>-backend, <fullname>-frontend.
# =============================================================================

# =============================================================================
# ADMIN — Botanist admin portal
# =============================================================================
admin:
  enabled: true

  imageOverride:
    repository: europe-west4-docker.pkg.dev/wallet-451208/interledger-app
    name: botanist
    # tag: vA.B.C  — defaults to .Chart.AppVersion

  config:
    kratos:
      # Internal URL for the Kratos Admin API used by the admin portal.
      adminUrl: "http://kratos-admin:4434"

    backend:
      # Defaults to http://<fullname>-backend-service-grpc:8448 when unset.
      grpcUrl: ""

    payment_pointer_base: "development.ilp.link"

  server:
    name: admin-server
    enabled: true
    image:
      repository: europe-west4-docker.pkg.dev/wallet-451208/interledger-app
      name: botanist
      # tag: vA.B.C  — defaults to .Chart.AppVersion
    imagePullPolicy: Always
    minReadySeconds: 10
    replicaCount: 2
    serviceAccount:
      create: false
      annotations: {}
      name: ""
    envFrom:
      - configMapRef:
          name: '{{ include "common.fullname" . }}-admin-config'
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 1024Mi
        cpu: 1000m
    livenessProbe:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 3
      httpGet:
        path: /healthz
        port: 3000
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 3
      httpGet:
        path: /healthz
        port: 3000
    ports:
      - name: http
        containerPort: 3000
    service:
      name: admin-service
      type: ClusterIP
      ports:
        - port: 3000
          targetPort: 3000
          protocol: TCP
          name: http
    podDisruptionBudget:
      enabled: true
      annotations: {}
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule

  configMaps:
    config:
      name: admin-config
      contentMap:
        - key: BACKEND_GRPC_URL
          valueRef: admin.config.backend.grpcUrl
        - key: KRATOS_ADMIN_URL
          valueRef: admin.config.kratos.adminUrl

# =============================================================================
# BACKEND — Go API server + Temporal worker
# =============================================================================
backend:
  # Override the container image used across ALL backend resources (server,
  # worker, and migration job). Per-resource overrides take precedence.
  imageOverride:
    repository: europe-west4-docker.pkg.dev/wallet-451208/interledger-app
    name: backend
    # tag: vA.B.C  — defaults to .Chart.AppVersion

  # Migration job — runs as a pre-install/pre-upgrade Helm hook.
  # The job can use a different image than the main deployments.
  initialisation:
    serviceAccountName: ""
    backend:
      urlSecretRef: "dbBackendMigrationsURL"
    pacioli:
      urlSecretRef: "dbPacioliMigrationsURL"
    imagePullPolicy: Always
    # image:
    #   repository: europe-west4-docker.pkg.dev/wallet-451208/interledger-app
    #   name: backend
    #   tag: vA.B.C

  database:
    backend:
      urlSecretRef: "dbBackendURL"
    pacioli:
      urlSecretRef: "dbPacioliURL"
    rafiki_backend:
      urlSecretRef: "dbRafikiBackendURL"
    rafiki_auth:
      urlSecretRef: "dbRafikiAuthURL"

  config:
    application_url: ""
    environment: dev
    log_level: "info"
    port: "8080"
    apple_app_id: ""
    android_package_name: ""
    android_sha256: ""

    admin:
      # This is used to create links to the admin portal useful for support purposes
      base_url: ""
      # Used to configure the admin portal's OIDC integration with Cloudflare Access
      # for authentication and access control. See the admin portal docs for details.
      policy_aud_ref: adminPortalCloudFlarePolicyAud
      team_domain_ref: adminPortalCloudflareTeamDomain

    # Not used
    smarty:
      auth:
        id: "not_used"
        token: "not_used"

    region_blocking:
      blocked_regions: ""
      allowed_wallet_ids: ""

    twilio:
      enabled: "false"
      account_sid_ref: twilioAccountSID
      service_sid_ref: twilioServiceSID
      account_token_ref: twilioAccountToken

    kratos:
      url: "http://kratos.wallet:4433"
      admin_url: "http://kratos.wallet:4434"

    rafiki:
      graphql:
        auth_url: "http://rafiki-auth:3003/graphql"
        backend_url: "http://rafiki-backend:3001/graphql"
      # Rafiki multi-tenancy (required as of Rafiki v2.3.0-beta).
      operator_tenant_id_ref: "rafikiOperatorTenantID"
      admin_api_secret_ref: "rafikiAdminAPISecret"
      signature_version_ref: "rafikiSignatureVersion"

    temporal:
      url: "temporal:7233"

    otel:
      exporter_otlp_endpoint: "grpc://api.honeycomb.io:443"
      exporter_otlp_headers_ref: "otelExporterHeaders"
      service_name: "backend"

    vault:
      url: "http://vault:8200"
      transit_engine_path: "transit/prod/backend"

    gatehub:
      # Toggle Gatehub-specific validation and runtime config requirements.
      enabled: "true"
      api_base_url: ""
      onboarding_base_url: ""
      on_off_ramp_base_url: ""
      fallback_webhook_url: ""
      organization_id: ""
      sending_user_id: ""
      sending_user_address: ""
      eur_ops_account: ""
      eur_ops_ledger_id: ""
      on_off_ramp_client_id: ""
      onboarding_client_id: ""
      exchange_client_id: ""
      card_account_product_code: ""
      app_id_ref: "gatehubAppID"
      secret_ref: "gatehubSecret"
      webhook_secret_ref: "gatehubWebhookSecret"
      gateway_id_ref: "gatehubGatewayId"
      paywiser_euro_vault_id_ref: "gatehubPaywiserEuroVaultId"
      card_app_id_ref: "gatehubCardAppId"

    chimoney:
      webhook_secret_ref: "chimoneyWebhookSecret"
      token_ref: "chimoneyToken"

    email:
      enabled: "false"

    sendgrid:
      api_key_ref: "sendgridApiKey"
      from_name: ""
      from_email: ""
      one_template_id: ""

    pusher:
      addr_ref: "pusherAddr"

    segment:
      key_ref: "segmentKey"

    slack:
      client_id_ref: "slackClientID"
      client_secret_ref: "slackClientSecret"
      signing_secret_ref: "slackSigningSecret"
      token_ref: "slackToken"
      channel_signup_kyc: ""
      channel_transaction: ""
      channel_error: ""

    persona:
      base_url: "https://api.withpersona.com/api/v1/"
      token_ref: "personaToken"
      webhook_token_ref: "personaWebhookToken"

    xago:
      api_base_url: ""
      identity_base_url: ""
      policy_id: ""
      api_secret_ref: "xagoApiSecret"
      api_public_key_ref: "xagoApiPublicKey"

    sentry:
      dsn_ref: "sentryDSN"

    pti:
      enabled: "false"
      base_url: "https://pti-base-url.com"
      sdk_url: "https://sdk.staging.fiant.io/latest/index.js"
      forms_url: "https://forms.staging.fiant.io"
      jwk_ref: "ptiJwk"
      public_key_jwk_ref: "ptiPublicKeyJwk"
      client_id_ref: "ptiClientID"

    signup_agreement_ids: ""

    redis_url_ref: "redisURL"

  server:
    enabled: true
    minReadySeconds: 10
    replicaCount: 2
    name: backend-server
    image:
