suite: Interledger App - Frontend validation
templates:
  - validation.frontend.yaml
set:
  fullnameOverride: wallet
  frontend:
    config:
      target_host: "https://interledger.app"
      support_email: "support@interledger.app"
      public_op_auth_host: "auth.ilp.link"
release:
  name: wallet
tests:
  - it: 'Should succeed when replicaCount is 2 (default)'
    asserts:
      - isNull:
          path: spec

  - it: 'Should succeed when replicaCount is 3'
    set:
      frontend:
        server:
          replicaCount: 3
    asserts:
      - isNull:
          path: spec

  - it: 'Should fail when replicaCount is 1'
    set:
      frontend:
        server:
          replicaCount: 1
    asserts:
      - failedTemplate:
          errorMessage: "frontend.server.replicaCount must be at least 2"

  - it: 'Should fail when target_host is empty'
    set:
      frontend:
        config:
          target_host: ""
    asserts:
      - failedTemplate:
          errorMessage: "The following required frontend values are empty: frontend.config.target_host"

  - it: 'Should fail when support_email is empty'
    set:
      frontend:
        config:
          support_email: ""
    asserts:
      - failedTemplate:
          errorMessage: "The following required frontend values are empty: frontend.config.support_email"

  - it: 'Should fail when public_op_auth_host is empty'
    set:
      frontend:
        config:
          public_op_auth_host: ""
    asserts:
      - failedTemplate:
          errorMessage: "The following required frontend values are empty: frontend.config.public_op_auth_host"

  - it: 'Should report all missing required fields in one error'
    set:
      frontend:
        config:
          target_host: ""
          support_email: ""
          public_op_auth_host: ""
    asserts:
      - failedTemplate:
          errorMessage: "The following required frontend values are empty: frontend.config.target_host, frontend.config.support_email, frontend.config.public_op_auth_host"

  - it: 'Should succeed when op_intpay is disabled (default) even with no host/redirect_url/wallet_address'
    asserts:
      - isNull:
          path: spec

  - it: 'Should fail when op_intpay is enabled with no host/redirect_url/wallet_address'
    set:
      frontend:
        config:
          op_intpay:
            enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "The following frontend values are required when frontend.config.op_intpay.enabled is true: frontend.config.op_intpay.host, frontend.config.op_intpay.redirect_url, frontend.config.op_intpay.wallet_address"

  - it: 'Should succeed when op_intpay is enabled with host/redirect_url/wallet_address set'
    set:
      frontend:
        config:
          op_intpay:
            enabled: true
            host: "https://ilp.link/"
            redirect_url: "https://ilp.link/quick-pay/finish"
            wallet_address: "https://ilp.link/quickpay"
    asserts:
      - isNull:
          path: spec

  - it: 'Should skip all validation when frontend is disabled'
    set:
      frontend:
        enabled: false
        server:
          replicaCount: 1
        config:
          target_host: ""
          support_email: ""
          public_op_auth_host: ""
    asserts:
      - isNull:
          path: spec
