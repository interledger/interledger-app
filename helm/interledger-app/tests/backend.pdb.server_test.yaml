suite: Interledger App - Backend Server PodDisruptionBudget
templates:
  - pdb.backend.server.yaml
set:
  fullnameOverride: wallet
release:
  name: wallet
tests:
  - it: 'Should create a PodDisruptionBudget'
    documentSelector:
      path: kind
      value: PodDisruptionBudget
    asserts:
      - equal:
          path: metadata.name
          value: wallet-backend-server
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: wallet
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: wallet-backend-server
      - equal:
          path: spec.minAvailable
          value: 1

  - it: 'Should allow maxUnavailable to be set instead of minAvailable'
    set:
      backend:
        server:
          podDisruptionBudget:
            minAvailable: ""
            maxUnavailable: 2
    documentSelector:
      path: kind
      value: PodDisruptionBudget
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 2
      - isNotSubset:
          path: spec
          content:
            minAvailable: 1

  - it: 'Should produce no PDB when disabled'
    set:
      backend:
        server:
          podDisruptionBudget:
            enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should produce no PDB when backend server is disabled'
    set:
      backend:
        server:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
