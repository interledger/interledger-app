suite: Interledger App - Frontend Deployment secret references
templates:
  - deployment.frontend.yaml
set:
  fullnameOverride: wallet
release:
  name: wallet
tests:
  - it: 'COOKIE_SECRETS should reference the frontend secret'
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: COOKIE_SECRETS
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: wallet-frontend
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: cookieSecretsArrStr

  - it: 'REDIS_URL should reference the frontend secret'
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: wallet-frontend
                key: redisURL

  - it: 'RAFIKI_AUTH_SECRET should reference the frontend secret'
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RAFIKI_AUTH_SECRET
            valueFrom:
              secretKeyRef:
                name: wallet-frontend
                key: rafikiAuthSecret

  - it: 'Should not inject legacy frontend secrets'
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: BT_TOKEN
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CF_TURNSTILE_SITE_KEY
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CF_TURNSTILE_SECRET_KEY
