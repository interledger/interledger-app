suite: Interledger App - Frontend Deployment config delivery
templates:
  - deployment.frontend.yaml
set:
  fullnameOverride: wallet
release:
  name: wallet
tests:
  - it: 'Should set CONFIG to the mounted config.yaml path'
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONFIG
            value: /etc/frontend/config.yaml

  - it: 'Should mount the frontend config ConfigMap at /etc/frontend'
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /etc/frontend
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            configMap:
              name: wallet-frontend-config

  - it: 'Should not inject any secretKeyRef env vars — secrets are resolved by configa via {{ secret ... }} templates'
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: COOKIE_SECRETS
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RAFIKI_AUTH_SECRET
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OP_INTPAY_KEY_ID
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OP_INTPAY_PRIVATE_KEY

  - it: 'Should not inject legacy frontend env vars'
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: BT_TOKEN
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CF_TURNSTILE_SITE_KEY
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CF_TURNSTILE_SECRET_KEY

  - it: 'Should set the ServiceAccount name when configured'
    documentSelector:
      path: kind
      value: Deployment
    set:
      frontend:
        server:
          serviceAccount:
            name: wallet-frontend
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: wallet-frontend
