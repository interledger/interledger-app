suite: Interledger App - Backend ConfigMap
templates:
  - configMap.backend.yaml
set:
  fullnameOverride: wallet
release:
  name: wallet
tests:
  - it: 'Should create a ConfigMap called wallet-backend-config'
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - equal:
          path: metadata.name
          value: wallet-backend-config

  - it: 'Should have a config.yaml data key'
    asserts:
      - isNotNull:
          path: data["config.yaml"]

  - it: 'Should serialise gatehub config into config.yaml'
    set:
      backend:
        config:
          gatehub:
            api_base_url: "http://mockgatehub:8080"
            organization_id: "test-org"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "api_base_url: http://mockgatehub:8080"

  - it: 'Should serialise pti config into config.yaml'
    set:
      backend:
        config:
          pti:
            enabled: true
            base_url: "https://pti-base-url.com"
            sdk_url: "https://sdk.staging.fiant.io/latest/index.js"
            forms_url: "https://forms.staging.fiant.io"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "base_url: https://pti-base-url.com"

  - it: 'Should serialise plaid config into config.yaml'
    set:
      backend:
        config:
          plaid:
            enabled: true
            client_id: "plaid-client-id"
            env: "sandbox"
            products:
              - auth
              - transactions
            country_codes:
              - US
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "client_id: plaid-client-id"

  - it: 'Should serialise email config into config.yaml'
    set:
      backend:
        config:
          email:
            enabled: false
            sendgrid:
              from_name: "Interledger Wallet"
              from_email: "support@interledger.app"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "from_name: Interledger Wallet"

  - it: 'Should serialise mobile config into config.yaml'
    set:
      backend:
        config:
          mobile:
            apple_app_id: "6B7AFCRT3V.app.wallet.interledger.dev"
            android_package_name: "org.interledger.wallet"
            android_sha256: "AA:BB:CC:DD"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "apple_app_id: 6B7AFCRT3V.app.wallet.interledger.dev"

  - it: 'Should serialise environment config into config.yaml'
    set:
      backend:
        config:
          environment:
            mode: sandbox
            label: sandbox
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "mode: sandbox"

  - it: 'Should serialise signup_agreement_ids into config.yaml'
    set:
      backend:
        config:
          signup_agreement_ids:
            - privacy_policy-0.0.0
            - terms_of_service-0.0.0
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "signup_agreement_ids:"

  - it: 'Should serialise blocked_regions into config.yaml'
    set:
      backend:
        config:
          blocked_regions:
            - ZA
            - US
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "blocked_regions:"

  - it: 'Should serialise persona config into config.yaml'
    set:
      backend:
        config:
          persona:
            base_url: "https://api.withpersona.com/api/v1/"
            token: "test-token"
            webhook_token: "test-webhook"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "base_url: https://api.withpersona.com/api/v1/"
