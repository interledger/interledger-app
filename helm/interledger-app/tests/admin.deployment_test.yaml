suite: Interledger App - Admin Deployment
templates:
  - configMap.admin.yaml
  - deployment.admin.yaml
set:
  fullnameOverride: wallet
release:
  name: wallet
tests:
  - it: 'Should create a Deployment called wallet-admin-server'
    template: deployment.admin.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: wallet-admin-server

  - it: 'Should provide readinessProbe and livenessProbe'
    template: deployment.admin.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz

  - it: 'Should set topologySpreadConstraints'
    template: deployment.admin.yaml
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: DoNotSchedule

  - it: 'Should reference the admin ConfigMap via envFrom'
    template: deployment.admin.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: wallet-admin-config

  - it: 'Should set minReadySeconds to 10'
    template: deployment.admin.yaml
    asserts:
      - equal:
          path: spec.minReadySeconds
          value: 10

  - it: 'Should contain the configmap hash annotation'
    template: deployment.admin.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["ilf-configmap-admin-sha256"]

  - it: 'Should contain correct instance and name labels'
    template: deployment.admin.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: wallet
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: wallet-admin-server

  - it: 'Should contain standard metadata labels'
    template: deployment.admin.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - exists:
          path: metadata.labels["app.kubernetes.io/version"]
      - exists:
          path: metadata.labels["helm.sh/chart"]

  - it: 'Should honour image override on the server spec'
    template: deployment.admin.yaml
    set:
      admin:
        server:
          image:
            repository: europe-west4-docker.pkg.dev/wallet-451208/interledger-app
            name: zulu
            tag: v0.2.2
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: europe-west4-docker.pkg.dev/wallet-451208/interledger-app/zulu:v0.2.2

  - it: 'Should produce no Deployment when admin is disabled'
    template: deployment.admin.yaml
    set:
      admin:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
