suite: Interledger App - Backend Server Deployment metadata
templates:
  - configMap.backend.yaml
  - deployment.backend.server.yaml
set:
  fullnameOverride: wallet
release:
  name: wallet
tests:
  - it: 'Should create a Deployment called wallet-backend-server'
    template: deployment.backend.server.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: wallet-backend-server

  - it: 'Should contain correct instance and name labels on the pod template'
    template: deployment.backend.server.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: wallet
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: wallet-backend-server

  - it: 'Should contain standard metadata labels on the Deployment'
    template: deployment.backend.server.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - exists:
          path: metadata.labels["app.kubernetes.io/version"]
      - exists:
          path: metadata.labels["helm.sh/chart"]

  - it: 'Should contain the configmap hash annotation'
    template: deployment.backend.server.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["ilf-configmap-worker-sha256"]

  - it: 'Should honour image override on the server spec'
    template: deployment.backend.server.yaml
    set:
      backend:
        server:
          image:
            repository: europe-west4-docker.pkg.dev/wallet-451208/interledger-app
            name: zulu
            tag: v0.2.2
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: europe-west4-docker.pkg.dev/wallet-451208/interledger-app/zulu:v0.2.2

  - it: 'Should not override a sidecar image with the main container image'
    template: deployment.backend.server.yaml
    set:
      backend:
        server:
          image:
            repository: europe-west4-docker.pkg.dev/wallet-451208/interledger-app
            name: backend
            tag: v0.2.2
          sidecars:
            - name: cloud-sql-proxy
              image:
                name: cloud-sql-connectors/cloud-sql-proxy
                tag: latest
                repository: gcr.io
              args:
                - "someproject:europe-west4:6e4edacc"
    asserts:
      - equal:
          path: spec.template.spec.containers[1].image
          value: gcr.io/cloud-sql-connectors/cloud-sql-proxy:latest

  - it: 'Should produce no Deployment when server is disabled'
    template: deployment.backend.server.yaml
    set:
      backend:
        server:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
