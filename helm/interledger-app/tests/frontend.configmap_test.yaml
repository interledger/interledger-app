suite: Interledger App - Frontend ConfigMap
templates:
  - configMap.frontend.yaml
set:
  fullnameOverride: wallet
  frontend:
    config:
      target_host: "https://interledger.test"
      support_email: "support@interledger.app"
      public_op_auth_host: "auth.interledger.test"
release:
  name: wallet
tests:
  - it: 'Should create a ConfigMap called wallet-frontend-config'
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - equal:
          path: metadata.name
          value: wallet-frontend-config

  - it: 'Should have a config.yaml data key'
    asserts:
      - isNotNull:
          path: data["config.yaml"]

  - it: 'Should serialise log_level and log_pretty into config.yaml'
    set:
      frontend:
        config:
          log_level: "debug"
          log_pretty: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "log_level: debug"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "log_pretty: true"

  - it: 'Should serialise environment into config.yaml'
    set:
      frontend:
        config:
          environment: "prod"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "environment: prod"

  - it: 'Should serialise pti config into config.yaml'
    set:
      frontend:
        config:
          pti:
            client_id: "04d3e1b5-96d4-47e4-9eaa-13e9b4b0f219"
            sdk_url: "https://sdk.staging.fiant.io/latest/index.js"
            forms_url: "https://forms.staging.fiant.io"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "client_id: 04d3e1b5-96d4-47e4-9eaa-13e9b4b0f219"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "sdk_url: https://sdk.staging.fiant.io/latest/index.js"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "forms_url: https://forms.staging.fiant.io"

  - it: 'Should default backend.grpc_url to the in-cluster backend Service when unset'
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "grpc_url: http://wallet-backend-service-grpc:8443"

  - it: 'Should default backend.http_url to the in-cluster backend Service when unset'
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "http_url: http://wallet-backend-service-http:8080"

  - it: 'Should not override an explicitly set backend.grpc_url'
    set:
      frontend:
        config:
          backend:
            grpc_url: "http://custom-backend:9999"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "grpc_url: http://custom-backend:9999"

  - it: 'Should serialise op_intpay config into config.yaml'
    set:
      frontend:
        config:
          op_intpay:
            enabled: true
            host: "https://interledger.test/"
            redirect_url: "https://interledger.test/quick-pay/finish"
            wallet_address: "https://interledger.test/quickpay"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "enabled: true"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "host: https://interledger.test/"

  - it: 'Should serialise a {{ secret ... }} template verbatim (resolved by configa at pod startup, not Helm)'
    set:
      frontend:
        config:
          rafiki:
            auth_secret: '{{ secret "frontend-secrets" "rafikiAuthSecret" }}'
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'auth_secret: .*secret "frontend-secrets" "rafikiAuthSecret"'

  - it: 'Should produce no ConfigMap when frontend is disabled'
    set:
      frontend:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
