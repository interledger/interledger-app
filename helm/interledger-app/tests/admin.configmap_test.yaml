suite: Interledger App - Admin ConfigMap
templates:
  - configMap.admin.yaml
set:
  fullnameOverride: wallet
release:
  name: wallet
tests:
  - it: 'Should create a ConfigMap with the correct name'
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - equal:
          path: metadata.name
          value: wallet-admin-config

  - it: 'Should have a config.yaml data key'
    asserts:
      - isNotNull:
          path: data["config.yaml"]

  - it: 'Should default backend_grpc_url to the in-cluster backend Service gRPC target when unset'
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "backend_grpc_url: wallet-backend-service-grpc:8448"

  - it: 'Should not override an explicitly set backend_grpc_url'
    set:
      admin:
        config:
          backend_grpc_url: "custom-backend:9999"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "backend_grpc_url: custom-backend:9999"

  - it: 'Should serialise payment_pointer_base into config.yaml'
    set:
      admin:
        config:
          payment_pointer_base: "kind.ilp.link"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "payment_pointer_base: kind.ilp.link"

  - it: 'Should produce no ConfigMap when admin is disabled'
    set:
      admin:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
