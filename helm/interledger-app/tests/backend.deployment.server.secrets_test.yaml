suite: Interledger App - Backend Server Deployment secret references
templates:
  - configMap.backend.yaml
  - deployment.backend.server.yaml
set:
  fullnameOverride: wallet
release:
  name: wallet
tests:
  - it: 'DB_URL_WITH_CERTS should reference the backend secret'
    template: deployment.backend.server.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[3].name
          value: DB_URL_WITH_CERTS
      - equal:
          path: spec.template.spec.containers[0].env[3].valueFrom.secretKeyRef.name
          value: wallet-backend
      - equal:
          path: spec.template.spec.containers[0].env[3].valueFrom.secretKeyRef.key
          value: dbBackendURL

  - it: 'Should have GATEHUB_CARD_APP_ID referencing the backend secret'
    template: deployment.backend.server.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GATEHUB_CARD_APP_ID
            valueFrom:
              secretKeyRef:
                name: wallet-backend
                key: gatehubCardAppId

  - it: 'Should have PTI_PUBLIC_KEY_JWK referencing the backend secret'
    template: deployment.backend.server.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PTI_PUBLIC_KEY_JWK
            valueFrom:
              secretKeyRef:
                name: wallet-backend
                key: ptiPublicKeyJwk
