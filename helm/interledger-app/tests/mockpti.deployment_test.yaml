suite: Interledger App - MockPTI Deployment
templates:
  - configMap.mockpti.yaml
  - deployment.mockpti.yaml
set:
  fullnameOverride: wallet
  release:
    name: wallet
  mockpti:
    enabled: true  # boolean true — must not be a quoted string
tests:
  - it: 'Should produce no Deployment when mockpti.enabled is boolean false'
    template: deployment.mockpti.yaml
    set:
      mockpti:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should produce no Deployment when mockpti.enabled is the string "false" (guards against truthy-string bug)'
    template: deployment.mockpti.yaml
    set:
      mockpti:
        enabled: "false"
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should produce no Deployment when mockpti.enabled is the string "true" (only boolean true is accepted)'
    template: deployment.mockpti.yaml
    set:
      mockpti:
        enabled: "true"
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should create a Deployment when mockpti.enabled is boolean true'
    template: deployment.mockpti.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: wallet-mockpti-server

  - it: 'Should set replicaCount to 1'
    template: deployment.mockpti.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: 'Should reference the mockpti ConfigMap via envFrom'
    template: deployment.mockpti.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: wallet-mockpti-config

  - it: 'Should source MOCKPTI_WEBHOOK_SIGNING_KEY_B64 from the mockpti secret'
    template: deployment.mockpti.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: MOCKPTI_WEBHOOK_SIGNING_KEY_B64
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: wallet-mockpti
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: mockptiWebhookSigningKeyB64

  - it: 'Should provide readinessProbe and livenessProbe on /health'
    template: deployment.mockpti.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 8080

  - it: 'Should contain the configmap hash annotation'
    template: deployment.mockpti.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["ilf-configmap-mockpti-sha256"]

  - it: 'Should contain correct instance and name labels'
    template: deployment.mockpti.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: wallet
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: wallet-mockpti-server

  - it: 'Should contain standard metadata labels'
    template: deployment.mockpti.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - exists:
          path: metadata.labels["app.kubernetes.io/version"]
      - exists:
          path: metadata.labels["helm.sh/chart"]

  - it: 'Should honour image override on the server spec'
    template: deployment.mockpti.yaml
    set:
      mockpti:
        server:
          image:
            repository: europe-west4-docker.pkg.dev/wallet-dev-462809/interledger-app
            name: mockpti
            tag: v1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: europe-west4-docker.pkg.dev/wallet-dev-462809/interledger-app/mockpti:v1.2.3
