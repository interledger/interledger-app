suite: Interledger App - Admin RBAC
templates:
  - rbac.admin.yaml
set:
  fullnameOverride: wallet
release:
  name: wallet
tests:
  - it: 'Should render nothing when secretAccess is empty (default)'
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should render nothing when secretAccess is set but serviceAccount name is empty'
    set:
      admin:
        secretAccess:
          - admin-secrets
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should render a Role scoped to the configured secret names'
    set:
      admin:
        secretAccess:
          - admin-secrets
        server:
          serviceAccount:
            name: wallet-admin
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: metadata.name
          value: wallet-admin-secret-reader
      - equal:
          path: rules[0].resourceNames
          value:
            - admin-secrets

  - it: 'Should render a RoleBinding to the configured ServiceAccount'
    set:
      admin:
        secretAccess:
          - admin-secrets
        server:
          serviceAccount:
            name: wallet-admin
    documentSelector:
      path: kind
      value: RoleBinding
    asserts:
      - equal:
          path: metadata.name
          value: wallet-admin-secret-reader
      - equal:
          path: subjects[0].name
          value: wallet-admin
