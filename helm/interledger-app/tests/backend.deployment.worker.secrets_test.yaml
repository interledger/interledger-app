suite: Interledger App - Backend Worker Deployment secret references
templates:
  - configMap.backend.yaml
  - deployment.backend.worker.yaml
set:
  fullnameOverride: wallet
release:
  name: wallet
tests:
  - it: 'REDIS_URL should reference the backend secret'
    template: deployment.backend.worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: wallet-backend
                key: redisURL

  - it: 'OTEL_EXPORTER_OTLP_HEADERS should reference the backend secret'
    template: deployment.backend.worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_HEADERS
            valueFrom:
              secretKeyRef:
                name: wallet-backend
                key: otelExporterHeaders

  - it: 'CONFIG should point to the mounted config file'
    template: deployment.backend.worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONFIG
            value: /etc/backend/config.yaml
