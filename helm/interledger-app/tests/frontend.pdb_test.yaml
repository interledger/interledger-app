suite: Interledger App - Frontend PodDisruptionBudget
templates:
  - pdb.frontend.yaml
set:
  fullnameOverride: wallet
release:
  name: wallet
tests:
  - it: 'Should create a PodDisruptionBudget'
    documentSelector:
      path: kind
      value: PodDisruptionBudget
    asserts:
      - equal:
          path: metadata.name
          value: wallet-frontend-server
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: wallet
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: wallet-frontend-server
      - equal:
          path: spec.minAvailable
          value: 1

  - it: 'Should produce no PDB when frontend is disabled'
    set:
      frontend:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should produce no PDB when PDB is disabled'
    set:
      frontend:
        server:
          podDisruptionBudget:
            enabled: false
    asserts:
      - hasDocuments:
          count: 0
