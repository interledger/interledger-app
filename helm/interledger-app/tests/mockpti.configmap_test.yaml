suite: Interledger App - MockPTI ConfigMap
templates:
  - configMap.mockpti.yaml
set:
  fullnameOverride: wallet
  release:
    name: wallet
  mockpti:
    enabled: true
tests:
  - it: 'Should produce no ConfigMap when mockpti is disabled'
    set:
      mockpti:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should create a ConfigMap with the correct name'
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - equal:
          path: metadata.name
          value: wallet-mockpti-config

  - it: 'Should include LOG_LEVEL in the ConfigMap data'
    asserts:
      - equal:
          path: data.LOG_LEVEL
          value: "debug"

  - it: 'Should include MOCKPTI_REDIS_DB in the ConfigMap data'
    asserts:
      - equal:
          path: data.MOCKPTI_REDIS_DB
          value: "5"

  - it: 'Should default MOCKPTI_WEBHOOK_URL to the in-cluster backend endpoint'
    asserts:
      - equal:
          path: data.MOCKPTI_WEBHOOK_URL
          value: "http://wallet-backend-service-http:8080/webhooks/pti"

  - it: 'Should use the explicit MOCKPTI_WEBHOOK_URL when set'
    set:
      mockpti:
        config:
          webhook_url: "http://custom-backend:8080/webhooks/pti"
    asserts:
      - equal:
          path: data.MOCKPTI_WEBHOOK_URL
          value: "http://custom-backend:8080/webhooks/pti"

  - it: 'Should include WEBHOOK_MIN_DELAY_SEC in the ConfigMap data'
    asserts:
      - equal:
          path: data.WEBHOOK_MIN_DELAY_SEC
          value: "0.2"
