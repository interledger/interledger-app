suite: Interledger App - Frontend Service
templates:
  - service.frontend.yaml
set:
  fullnameOverride: wallet
release:
  name: wallet
tests:
  - it: 'Should create a Service called wallet-frontend-service'
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: metadata.name
          value: wallet-frontend-service
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 3000
      - equal:
          path: spec.ports[0].name
          value: http

  - it: 'Service selector should target the frontend-server deployment'
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: wallet-frontend-server
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: wallet

  - it: 'Should produce no Service when frontend is disabled'
    set:
      frontend:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
