suite: Interledger App - Backend HTTP Service
templates:
  - service.backend.http.yaml
set:
  fullnameOverride: wallet
release:
  name: wallet
tests:
  - it: 'Should create a Service called wallet-backend-service-http'
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: metadata.name
          value: wallet-backend-service-http
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].name
          value: http
      - equal:
          path: spec.ports[0].port
          value: 8080

  - it: 'Service selector should target the backend-server deployment'
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: wallet-backend-server
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: wallet

  - it: 'Should produce no Service when backend server is disabled'
    set:
      backend:
        server:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
