suite: Interledger App - Backend Worker Deployment metadata
templates:
  - configMap.backend.yaml
  - deployment.backend.worker.yaml
set:
  fullnameOverride: wallet
release:
  name: wallet
tests:
  - it: 'Should create a Deployment called wallet-backend-worker'
    template: deployment.backend.worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: wallet-backend-worker

  - it: 'Should contain correct instance and name labels on the pod template'
    template: deployment.backend.worker.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: wallet
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: wallet-backend-worker

  - it: 'Should contain standard metadata labels on the Deployment'
    template: deployment.backend.worker.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - exists:
          path: metadata.labels["app.kubernetes.io/version"]
      - exists:
          path: metadata.labels["helm.sh/chart"]

  - it: 'Should contain the configmap hash annotation'
    template: deployment.backend.worker.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["ilf-configmap-worker-sha256"]

  - it: 'Should honour image override on the worker spec'
    template: deployment.backend.worker.yaml
    set:
      backend:
        worker:
          image:
            repository: europe-west4-docker.pkg.dev/wallet-451208/interledger-app
            name: zulu
            tag: v0.2.2
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: europe-west4-docker.pkg.dev/wallet-451208/interledger-app/zulu:v0.2.2

  - it: 'Should produce no Deployment when worker is disabled'
    template: deployment.backend.worker.yaml
    set:
      backend:
        worker:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
