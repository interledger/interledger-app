{{- define "interledger-app.frontend.deployment" -}}
{{- $top := first . }}
{{- if $top.Values.frontend.enabled }}
{{- $cfgObj := include "interledger-app.frontend.configMap" $top | fromYaml -}}
{{- $dataHash := $cfgObj.data | toJson | sha256sum -}}
spec:
  template:
    metadata:
      annotations:
        ilf-configmap-frontend-sha256: {{ $dataHash | quote }}
{{- end }}
{{- end }}
{{- if .Values.frontend.enabled }}
{{- $frontendServer := deepCopy .Values.frontend.server }}
{{- if not .Values.frontend.config.op_intpay.enabled }}
{{- $filteredEnv := list }}
{{- range $frontendServer.env }}
{{- if not (hasPrefix "OP_INTPAY_" .name) }}
{{- $filteredEnv = append $filteredEnv . }}
{{- end }}
{{- end }}
{{- $_ := set $frontendServer "env" $filteredEnv }}
{{- end }}
{{- include "common.deployment" (list . $frontendServer .Values.frontend.server.autoscaling .Values.frontend.server.serviceAccount "interledger-app.frontend.deployment") }}
{{- end }}
