{{- if .Values.frontend.enabled -}}

{{- if lt (int .Values.frontend.server.replicaCount) 2 -}}
  {{- fail "frontend.server.replicaCount must be at least 2" -}}
{{- end -}}

{{- $requiredFields := list
  (dict "path" "frontend.config.target_host"       "value" .Values.frontend.config.target_host)
  (dict "path" "frontend.config.support_email"     "value" .Values.frontend.config.support_email)
  (dict "path" "frontend.config.public_op_auth_host" "value" .Values.frontend.config.public_op_auth_host)
-}}

{{- $missingFields := list -}}
{{- range $requiredFields -}}
  {{- if eq (trim (default "" .value)) "" -}}
    {{- $missingFields = append $missingFields .path -}}
  {{- end -}}
{{- end -}}

{{- if gt (len $missingFields) 0 -}}
  {{- fail (printf "The following required frontend values are empty: %s" (join ", " $missingFields)) -}}
{{- end -}}

{{- if .Values.frontend.config.op_intpay.enabled -}}
{{- $requiredIntPayFields := list
  (dict "path" "frontend.config.op_intpay.host"           "value" .Values.frontend.config.op_intpay.host)
  (dict "path" "frontend.config.op_intpay.redirect_url"   "value" .Values.frontend.config.op_intpay.redirect_url)
  (dict "path" "frontend.config.op_intpay.wallet_address" "value" .Values.frontend.config.op_intpay.wallet_address)
-}}

{{- $missingIntPayFields := list -}}
{{- range $requiredIntPayFields -}}
  {{- if eq (trim (default "" .value)) "" -}}
    {{- $missingIntPayFields = append $missingIntPayFields .path -}}
  {{- end -}}
{{- end -}}

{{- if gt (len $missingIntPayFields) 0 -}}
  {{- fail (printf "The following frontend values are required when frontend.config.op_intpay.enabled is true: %s" (join ", " $missingIntPayFields)) -}}
{{- end -}}
{{- end -}}

{{- end -}}
