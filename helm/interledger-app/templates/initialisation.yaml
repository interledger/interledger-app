{{- define "interledger-app.backend.initialisation" -}}
{{- $top := first . }}
{{- $initialisation := $top.Values.backend.initialisation }}

{{- $globalSelectedRepository := $top.Values.backend.imageOverride.repository }}
{{- $globalSelectedName := $top.Values.backend.imageOverride.name }}
{{- $globalSelectedVersion := $top.Values.backend.imageOverride.tag | default $top.Chart.AppVersion }}

{{- if not $initialisation.image }}
  {{- $initialisation = dict "image" (dict) | merge $initialisation }}
{{- end }}

{{- $initialisationSelectedRepository := $initialisation.image.repository | default $globalSelectedRepository }}
{{- $initialisationSelectedName := $initialisation.image.name | default $globalSelectedName }}
{{- $initialisationSelectedTag := $initialisation.image.tag | default $globalSelectedVersion }}

{{- $migrationImageString := printf "%s/%s:%s" $initialisationSelectedRepository $initialisationSelectedName $initialisationSelectedTag }}

# templates/initialisation.yaml
# Job responsible for running backend database migrations before install/upgrade
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "common.fullname" $top }}-migration
  namespace: {{ $top.Release.Namespace }}
  {{- include "common.metadata" (list $top) | nindent 2 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    spec:
      {{- if $initialisation.serviceAccountName }}
      serviceAccountName: {{ $initialisation.serviceAccountName | quote }}
      {{- end }}
      restartPolicy: OnFailure
      volumes:
        - name: config
          configMap:
            name: {{ include "common.fullname" $top }}-backend-migration-config
      containers:
        - name: migration
          image: {{ $migrationImageString }}
          imagePullPolicy: {{ $initialisation.imagePullPolicy }}
          env:
            - name: CONFIG
              value: /etc/backend/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/backend
              readOnly: true
          args: ["migrate"]
{{- end }}
{{- include "interledger-app.backend.initialisation" (list . ) | nindent 0 }}
