{{- if and (kindIs "bool" .Values.mockgatehub.enabled) .Values.mockgatehub.enabled -}}

{{- $requiredFields := list
  (dict "path" "mockgatehub.config.webhook_url" "value" .Values.mockgatehub.config.webhook_url)
-}}

{{- $missingFields := list -}}
{{- range $requiredFields -}}
  {{- if eq (trim (default "" .value)) "" -}}
    {{- $missingFields = append $missingFields .path -}}
  {{- end -}}
{{- end -}}

{{- if gt (len $missingFields) 0 -}}
  {{- fail (printf "The following required values are empty: %s" (join ", " $missingFields)) -}}
{{- end -}}

{{- end -}}
