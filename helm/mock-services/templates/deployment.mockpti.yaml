{{- define "mock-services.mockpti.deployment" -}}
{{- $top := first . }}
{{- if and (kindIs "bool" $top.Values.mockpti.enabled) $top.Values.mockpti.enabled }}
{{- $cfgObj := include "mock-services.mockpti.configMap" $top | fromYaml -}}
{{- $dataHash := $cfgObj.data | toJson | sha256sum -}}
spec:
  template:
    metadata:
      annotations:
        ilf-configmap-mockpti-sha256: {{ $dataHash | quote }}
    spec:
      volumes:
        - name: config
          configMap:
            name: {{ include "common.fullname" $top }}-{{ $top.Values.mockpti.configMaps.config.name }}
{{- end }}
{{- end }}
{{- if and (kindIs "bool" .Values.mockpti.enabled) .Values.mockpti.enabled }}
{{- $sa := include "mock-services.saSpec" (list . .Values.mockpti "mockpti") | fromYaml }}
{{- include "common.deployment" (list . .Values.mockpti.server .Values.mockpti.server.autoscaling $sa "mock-services.mockpti.deployment") }}
{{- end }}
