      periodSeconds: 5
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 3
      httpGet:
        path: /health
        port: 8080
    ports:
      - name: http
        containerPort: 8080
    service:
      name: mockxago-service
      type: ClusterIP
      ports:
        - port: 8080
          targetPort: 8080
          protocol: TCP
          name: http
    envFrom:
      - configMapRef:
          name: '{{ include "common.fullname" . }}-mockxago-config'
    env:
      - name: WEBHOOK_SECRET
        valueFrom:
          secretKeyRef:
            name: '{{ include "common.fullname" . }}-mockxago'
            key: "{{ .Values.mockxago.config.webhook_secret_ref }}"
      - name: XAGO_API_PUBLIC_KEY
        valueFrom:
          secretKeyRef:
            name: '{{ include "common.fullname" . }}-mockxago'
            key: "{{ .Values.mockxago.config.api_public_key_ref }}"
      - name: XAGO_API_SECRET
        valueFrom:
          secretKeyRef:
            name: '{{ include "common.fullname" . }}-mockxago'
            key: "{{ .Values.mockxago.config.api_secret_ref }}"
      - name: PERSONA_WEBHOOK_TOKEN
        valueFrom:
          secretKeyRef:
            name: '{{ include "common.fullname" . }}-mockxago'
            key: "{{ .Values.mockxago.config.persona_webhook_token_ref }}"
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 500m
