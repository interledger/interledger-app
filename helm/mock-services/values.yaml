# =============================================================================
# MOCK-SERVICES — Standalone chart for mock provider services
#
# All services are disabled by default. Set <service>.enabled: true (boolean)
# to render resources for that service.
#
# Each service requires a pre-created Secret (not created by this chart).
# See the individual service sections below for the expected Secret name and
# key contract.
#
# enabled MUST be a boolean (true/false). A quoted string "true" or "false"
# is rejected — the templates use `kindIs "bool"` to prevent accidental
# deployment from a misconfigured values file.
# =============================================================================

# =============================================================================
# MOCKPTI — Mock PTI (Fiant) service
#
# Resources rendered when enabled:
#   - ConfigMap       <fullname>-mockpti-config
#   - Deployment      <fullname>-mockpti-server
#   - Service         <fullname>-mockpti-service
#   - ServiceAccount  <fullname>-mockpti           (when serviceAccount.create: true)
#   - Role            <fullname>-mockpti-secret-reader  (when secretAccess is non-empty)
#   - RoleBinding     <fullname>-mockpti-secret-reader  (when secretAccess is non-empty)
#
# Required values (chart will fail to render if empty):
#   mockpti.config.webhook_url
# =============================================================================
mockpti:
  # Boolean — must be true or false, not a quoted string.
  enabled: false

  # Set create: true for the chart to create a ServiceAccount, Role, and RoleBinding.
  # The SA name defaults to <fullname>-mockpti; override with name.
  # Only needed when config values reference {{ secret "name" "key" }} — the SA must
  # be able to call the Kubernetes Secrets API for configa to resolve those at startup.
  serviceAccount:
    create: false
    name: ""

  # Names of Kubernetes Secrets this service needs to read at runtime via configa's
  # {{ secret "name" "key" }} syntax. Ignored when serviceAccount.create is false.
  # A Role granting get on exactly these secret names is created alongside the SA.
  secretAccess: []

  # The config section is serialised verbatim as config.yaml inside the ConfigMap.
  # All keys must match the yaml struct tags in go/mock/mockpti/internal/config/config.go.
  # Sensitive values (webhook_signing_key) should be supplied by the operator at deploy
  # time, either as a plain value or using configa's {{ secret "name" "key" }} syntax.
  config:
    log_level: "debug"
    redis_url: ""
    redis_db: "5"
    client_id: ""
    webhook_url: ""
    webhook_signing_key: ""
    forms_mutation_token: ""

  configMaps:
    config:
      name: mockpti-config

  server:
    name: mockpti-server
    image:
      repository: europe-west4-docker.pkg.dev/wallet-451208/interledger-app
      name: mockpti
      # tag: vA.B.C  — defaults to .Chart.AppVersion
    imagePullPolicy: Always
    replicaCount: 1
    livenessProbe:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 3
      httpGet:
        path: /health
        port: 8080
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 3
      httpGet:
        path: /health
        port: 8080
    ports:
      - name: http
        containerPort: 8080
    service:
      name: mockpti-service
      type: ClusterIP
      ports:
        - port: 8080
          targetPort: 8080
          protocol: TCP
          name: http
    env:
      - name: CONFIG
        value: /etc/mockpti/config.yaml
    volumeMounts:
      - name: config
        mountPath: /etc/mockpti
        readOnly: true
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 500m

# =============================================================================
# MOCKGATEHUB — Mock GateHub service
#
# Resources rendered when enabled:
#   - ConfigMap       <fullname>-mockgatehub-config
#   - Deployment      <fullname>-mockgatehub-server
#   - Service         <fullname>-mockgatehub-service
#   - ServiceAccount  <fullname>-mockgatehub           (when serviceAccount.create: true)
#   - Role            <fullname>-mockgatehub-secret-reader  (when secretAccess is non-empty)
#   - RoleBinding     <fullname>-mockgatehub-secret-reader  (when secretAccess is non-empty)
#
# Required values (chart will fail to render if empty):
#   mockgatehub.config.webhook_url
# =============================================================================
mockgatehub:
  # Boolean — must be true or false, not a quoted string.
  enabled: false

  # See mockpti.serviceAccount for full description.
  serviceAccount:
    create: false
    name: ""

  # See mockpti.secretAccess for full description.
  secretAccess: []

  # The config section is serialised verbatim as config.yaml inside the ConfigMap.
  # All keys must match the yaml struct tags in go/mock/mockgatehub/internal/config/config.go.
  # Sensitive values (webhook_secret, valid_credentials) should be supplied by the operator
  # at deploy time, either as plain values or using configa's {{ secret "name" "key" }} syntax.
  config:
    log_level: "info"
    redis_url: ""
    redis_db: 2
    webhook_url: ""
    webhook_secret: ""
    webhook_min_delay_sec: 2
    enforce_authentication: true
    valid_credentials: {}
    default_organization_id: "default-org"
    public_base_url: "https://mockgatehub.interledger.test"
    card_data_token_secret: ""

  configMaps:
    config:
      name: mockgatehub-config

  server:
    name: mockgatehub-server
    image:
      repository: europe-west4-docker.pkg.dev/wallet-451208/interledger-app
      name: mockgatehub
      # tag: vA.B.C  — defaults to .Chart.AppVersion
    imagePullPolicy: Always
    replicaCount: 1
    livenessProbe:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 3
      httpGet:
        path: /health
        port: 8080
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 3
      httpGet:
        path: /health
        port: 8080
    ports:
      - name: http
        containerPort: 8080
    service:
      name: mockgatehub-service
      type: ClusterIP
      ports:
        - port: 8080
          targetPort: 8080
          protocol: TCP
          name: http
    env:
      - name: CONFIG
        value: /etc/mockgatehub/config.yaml
    volumeMounts:
      - name: config
        mountPath: /etc/mockgatehub
        readOnly: true
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 500m

