suite: Mock Services - MockPTI ServiceAccount / RBAC
templates:
  - serviceaccount.mockpti.yaml
set:
  fullnameOverride: wallet
  release:
    name: wallet
  mockpti:
    enabled: true
    config:
      webhook_url: "http://wallet-backend-service-http:8080/webhooks/pti"
tests:
  - it: 'Should produce no resources when serviceAccount.create is false (default)'
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should produce no resources when mockpti is disabled'
    set:
      mockpti:
        enabled: false
        serviceAccount:
          create: true
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should create only a ServiceAccount when create is true and secretAccess is empty'
    set:
      mockpti:
        serviceAccount:
          create: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount

  - it: 'Should default the ServiceAccount name to <fullname>-mockpti'
    set:
      mockpti:
        serviceAccount:
          create: true
    asserts:
      - equal:
          path: metadata.name
          value: wallet-mockpti

  - it: 'Should use the explicit name when serviceAccount.name is set'
    set:
      mockpti:
        serviceAccount:
          create: true
          name: my-custom-ksa
    asserts:
      - equal:
          path: metadata.name
          value: my-custom-ksa

  - it: 'Should create SA + Role + RoleBinding when secretAccess is non-empty'
    set:
      mockpti:
        serviceAccount:
          create: true
        secretAccess:
          - wallet-mockpti
    asserts:
      - hasDocuments:
          count: 3

  - it: 'Should name the Role and RoleBinding <fullname>-mockpti-secret-reader'
    set:
      mockpti:
        serviceAccount:
          create: true
        secretAccess:
          - wallet-mockpti
    asserts:
      - documentIndex: 1
        equal:
          path: metadata.name
          value: wallet-mockpti-secret-reader
      - documentIndex: 2
        equal:
          path: metadata.name
          value: wallet-mockpti-secret-reader

  - it: 'Should scope the Role to exactly the listed secret names'
    set:
      mockpti:
        serviceAccount:
          create: true
        secretAccess:
          - wallet-mockpti
          - wallet-mockpti-other
    asserts:
      - documentIndex: 1
        equal:
          path: rules[0].resources[0]
          value: secrets
      - documentIndex: 1
        equal:
          path: rules[0].resourceNames[0]
          value: wallet-mockpti
      - documentIndex: 1
        equal:
          path: rules[0].resourceNames[1]
          value: wallet-mockpti-other
      - documentIndex: 1
        equal:
          path: rules[0].verbs[0]
          value: get

  - it: 'Should bind the RoleBinding to the ServiceAccount'
    set:
      mockpti:
        serviceAccount:
          create: true
        secretAccess:
          - wallet-mockpti
    asserts:
      - documentIndex: 2
        equal:
          path: subjects[0].kind
          value: ServiceAccount
      - documentIndex: 2
        equal:
          path: subjects[0].name
          value: wallet-mockpti
      - documentIndex: 2
        equal:
          path: roleRef.kind
          value: Role
      - documentIndex: 2
        equal:
          path: roleRef.name
          value: wallet-mockpti-secret-reader
