suite: Mock Services - MockXago Service
templates:
  - service.mockxago.yaml
set:
  fullnameOverride: wallet
  release:
    name: wallet
  mockxago:
    enabled: true
    config:
      webhook_url: "http://wallet-backend-service-http:8080/webhooks/xago"
tests:
  - it: 'Should produce no Service when mockxago.enabled is boolean false'
    set:
      mockxago:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should create a Service when mockxago.enabled is boolean true'
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service

  - it: 'Should name the Service <fullname>-mockxago-service'
    asserts:
      - equal:
          path: metadata.name
          value: wallet-mockxago-service

  - it: 'Should expose port 8080'
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].targetPort
          value: 8080

  - it: 'Should be of type ClusterIP'
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
