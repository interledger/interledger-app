suite: Mock Services - MockPTI ConfigMap
templates:
  - configMap.mockpti.yaml
set:
  fullnameOverride: wallet
  release:
    name: wallet
  mockpti:
    enabled: true
    config:
      webhook_url: "http://wallet-backend-service-http:8080/webhooks/pti"
tests:
  - it: 'Should produce no ConfigMap when mockpti.enabled is boolean false'
    set:
      mockpti:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should produce no ConfigMap when mockpti.enabled is the string "false"'
    set:
      mockpti:
        enabled: "false"
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should produce no ConfigMap when mockpti.enabled is the string "true"'
    set:
      mockpti:
        enabled: "true"
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should create a ConfigMap when mockpti.enabled is boolean true'
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap

  - it: 'Should name the ConfigMap <fullname>-mockpti-config'
    asserts:
      - equal:
          path: metadata.name
          value: wallet-mockpti-config

  - it: 'Should set LOG_LEVEL from config'
    set:
      mockpti:
        config:
          log_level: "info"
          webhook_url: "http://wallet-backend-service-http:8080/webhooks/pti"
    asserts:
      - equal:
          path: data.LOG_LEVEL
          value: "info"

  - it: 'Should set MOCKPTI_WEBHOOK_URL from config'
    asserts:
      - equal:
          path: data.MOCKPTI_WEBHOOK_URL
          value: "http://wallet-backend-service-http:8080/webhooks/pti"

  - it: 'Should set MOCKPTI_REDIS_DB from config'
    asserts:
      - equal:
          path: data.MOCKPTI_REDIS_DB
          value: "5"

  - it: 'Should set WEBHOOK_MIN_DELAY_SEC from config'
    asserts:
      - equal:
          path: data.WEBHOOK_MIN_DELAY_SEC
          value: "0.2"
