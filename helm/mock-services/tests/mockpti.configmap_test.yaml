suite: Mock Services - MockPTI ConfigMap
templates:
  - configMap.mockpti.yaml
set:
  fullnameOverride: wallet
  release:
    name: wallet
  mockpti:
    enabled: true
    config:
      webhook_url: "http://wallet-backend-service-http:8080/webhooks/pti"
tests:
  - it: 'Should produce no ConfigMap when mockpti.enabled is boolean false'
    set:
      mockpti:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should produce no ConfigMap when mockpti.enabled is the string "false"'
    set:
      mockpti:
        enabled: "false"
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should produce no ConfigMap when mockpti.enabled is the string "true"'
    set:
      mockpti:
        enabled: "true"
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should create a ConfigMap when mockpti.enabled is boolean true'
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap

  - it: 'Should name the ConfigMap <fullname>-mockpti-config'
    asserts:
      - equal:
          path: metadata.name
          value: wallet-mockpti-config

  - it: 'Should store config as a single config.yaml file entry'
    asserts:
      - exists:
          path: data["config.yaml"]

  - it: 'Should include log_level in config.yaml'
    set:
      mockpti:
        config:
          log_level: "info"
          webhook_url: "http://wallet-backend-service-http:8080/webhooks/pti"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "log_level: info"

  - it: 'Should include webhook_url in config.yaml'
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "webhook_url: http://wallet-backend-service-http:8080/webhooks/pti"

  - it: 'Should include redis_db in config.yaml'
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'redis_db: "5"'

  - it: 'Should preserve configa secret reference syntax verbatim — Helm must not interpret it'
    # Operators can use {{ secret "k8s-secret-name" "key" }} inside config values to
    # trigger configa's runtime k8s secret resolution.  The Helm engine must never execute
    # that syntax; it must appear literally in config.yaml so configa can act on it later.
    set:
      mockpti:
        config:
          webhook_url: "http://wallet-backend-service-http:8080/webhooks/pti"
          webhook_signing_key: '{{ secret "wallet-mockpti" "signingKey" }}'
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'webhook_signing_key:.*secret.*wallet-mockpti.*signingKey'
