suite: Mock Services - MockGatehub ServiceAccount / RBAC
templates:
  - serviceaccount.mockgatehub.yaml
set:
  fullnameOverride: wallet
  release:
    name: wallet
  mockgatehub:
    enabled: true
    config:
      webhook_url: "http://wallet-backend-service-http:8080/webhooks/gatehub"
tests:
  - it: 'Should produce no resources when serviceAccount.create is false (default)'
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should default the ServiceAccount name to <fullname>-mockgatehub'
    set:
      mockgatehub:
        serviceAccount:
          create: true
    asserts:
      - equal:
          path: metadata.name
          value: wallet-mockgatehub

  - it: 'Should create SA + Role + RoleBinding when secretAccess is non-empty'
    set:
      mockgatehub:
        serviceAccount:
          create: true
        secretAccess:
          - wallet-mockgatehub
    asserts:
      - hasDocuments:
          count: 3
      - documentIndex: 1
        equal:
          path: rules[0].resourceNames[0]
          value: wallet-mockgatehub
