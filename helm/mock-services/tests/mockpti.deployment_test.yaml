suite: Mock Services - MockPTI Deployment
templates:
  - configMap.mockpti.yaml
  - deployment.mockpti.yaml
set:
  fullnameOverride: wallet
  release:
    name: wallet
  mockpti:
    enabled: true
    config:
      webhook_url: "http://wallet-backend-service-http:8080/webhooks/pti"
tests:
  - it: 'Should produce no Deployment when mockpti.enabled is boolean false'
    template: deployment.mockpti.yaml
    set:
      mockpti:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should produce no Deployment when mockpti.enabled is the string "false"'
    template: deployment.mockpti.yaml
    set:
      mockpti:
        enabled: "false"
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should produce no Deployment when mockpti.enabled is the string "true"'
    template: deployment.mockpti.yaml
    set:
      mockpti:
        enabled: "true"
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should create a Deployment when mockpti.enabled is boolean true'
    template: deployment.mockpti.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: wallet-mockpti-server

  - it: 'Should set replicaCount to 1'
    template: deployment.mockpti.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: 'Should set CONFIG env var pointing to the mounted config file'
    template: deployment.mockpti.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: CONFIG
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: /etc/mockpti/config.yaml

  - it: 'Should mount the config ConfigMap as a volume'
    template: deployment.mockpti.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: config
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: wallet-mockpti-config

  - it: 'Should mount the config volume into the container'
    template: deployment.mockpti.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: config
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /etc/mockpti

  - it: 'Should provide readinessProbe and livenessProbe on /health'
    template: deployment.mockpti.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 8080

  - it: 'Should contain the configmap hash annotation'
    template: deployment.mockpti.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["ilf-configmap-mockpti-sha256"]

  - it: 'Should contain correct instance and name labels'
    template: deployment.mockpti.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: wallet
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: wallet-mockpti-server

  - it: 'Should honour image override on the server spec'
    template: deployment.mockpti.yaml
    set:
      mockpti:
        server:
          image:
            repository: europe-west4-docker.pkg.dev/wallet-dev-462809/interledger-app
            name: mockpti
            tag: v1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: europe-west4-docker.pkg.dev/wallet-dev-462809/interledger-app/mockpti:v1.2.3

  - it: 'Should set serviceAccountName when serviceAccount.create is true'
    template: deployment.mockpti.yaml
    set:
      mockpti:
        serviceAccount:
          create: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: wallet-mockpti

  - it: 'Should set serviceAccountName when an external SA name is provided'
    template: deployment.mockpti.yaml
    set:
      mockpti:
        serviceAccount:
          create: false
          name: my-workload-identity-ksa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-workload-identity-ksa
