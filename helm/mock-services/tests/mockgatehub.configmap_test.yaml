suite: Mock Services - MockGatehub ConfigMap
templates:
  - configMap.mockgatehub.yaml
set:
  fullnameOverride: wallet
  release:
    name: wallet
  mockgatehub:
    enabled: true
    config:
      webhook_url: "http://wallet-backend-service-http:8080/webhooks/gatehub"
tests:
  - it: 'Should produce no ConfigMap when mockgatehub.enabled is boolean false'
    set:
      mockgatehub:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should produce no ConfigMap when mockgatehub.enabled is the string "false"'
    set:
      mockgatehub:
        enabled: "false"
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should produce no ConfigMap when mockgatehub.enabled is the string "true"'
    set:
      mockgatehub:
        enabled: "true"
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should create a ConfigMap when mockgatehub.enabled is boolean true'
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap

  - it: 'Should name the ConfigMap <fullname>-mockgatehub-config'
    asserts:
      - equal:
          path: metadata.name
          value: wallet-mockgatehub-config

  - it: 'Should set WEBHOOK_URL from config'
    asserts:
      - equal:
          path: data.WEBHOOK_URL
          value: "http://wallet-backend-service-http:8080/webhooks/gatehub"

  - it: 'Should set MOCKGATEHUB_REDIS_DB from config'
    asserts:
      - equal:
          path: data.MOCKGATEHUB_REDIS_DB
          value: "2"

  - it: 'Should set MOCKGATEHUB_PUBLIC_BASE_URL from config'
    asserts:
      - equal:
          path: data.MOCKGATEHUB_PUBLIC_BASE_URL
          value: "https://mockgatehub.interledger.test"

  - it: 'Should set MOCKGATEHUB_ENFORCE_AUTHENTICATION from config'
    asserts:
      - equal:
          path: data.MOCKGATEHUB_ENFORCE_AUTHENTICATION
          value: "true"

  - it: 'Should not include sensitive credentials in ConfigMap'
    asserts:
      - notExists:
          path: data.WEBHOOK_SECRET
      - notExists:
          path: data.MOCKGATEHUB_VALID_CREDENTIALS
