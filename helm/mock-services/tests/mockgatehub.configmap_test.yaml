suite: Mock Services - MockGatehub ConfigMap
templates:
  - configMap.mockgatehub.yaml
set:
  fullnameOverride: wallet
  release:
    name: wallet
  mockgatehub:
    enabled: true
    config:
      webhook_url: "http://wallet-backend-service-http:8080/webhooks/gatehub"
tests:
  - it: 'Should produce no ConfigMap when mockgatehub.enabled is boolean false'
    set:
      mockgatehub:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should produce no ConfigMap when mockgatehub.enabled is the string "false"'
    set:
      mockgatehub:
        enabled: "false"
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should produce no ConfigMap when mockgatehub.enabled is the string "true"'
    set:
      mockgatehub:
        enabled: "true"
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should create a ConfigMap when mockgatehub.enabled is boolean true'
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap

  - it: 'Should name the ConfigMap <fullname>-mockgatehub-config'
    asserts:
      - equal:
          path: metadata.name
          value: wallet-mockgatehub-config

  - it: 'Should store config as a single config.yaml file entry'
    asserts:
      - exists:
          path: data["config.yaml"]

  - it: 'Should include webhook_url in config.yaml'
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "webhook_url: http://wallet-backend-service-http:8080/webhooks/gatehub"

  - it: 'Should include public_base_url in config.yaml'
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "public_base_url: https://mockgatehub.interledger.test"

  - it: 'Should include enforce_authentication in config.yaml'
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "enforce_authentication: true"

  - it: 'Should include webhook_secret in config.yaml (sensitive value — empty by default)'
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "webhook_secret:"
