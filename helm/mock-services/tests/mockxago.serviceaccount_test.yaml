suite: Mock Services - MockXago ServiceAccount / RBAC
templates:
  - serviceaccount.mockxago.yaml
set:
  fullnameOverride: wallet
  release:
    name: wallet
  mockxago:
    enabled: true
    config:
      webhook_url: "http://wallet-backend-service-http:8080/webhooks/xago"
tests:
  - it: 'Should produce no resources when serviceAccount.create is false (default)'
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should default the ServiceAccount name to <fullname>-mockxago'
    set:
      mockxago:
        serviceAccount:
          create: true
    asserts:
      - equal:
          path: metadata.name
          value: wallet-mockxago

  - it: 'Should create SA + Role + RoleBinding when secretAccess is non-empty'
    set:
      mockxago:
        serviceAccount:
          create: true
        secretAccess:
          - wallet-mockxago
    asserts:
      - hasDocuments:
          count: 3
      - documentIndex: 1
        equal:
          path: rules[0].resourceNames[0]
          value: wallet-mockxago
