suite: Mock Services - MockXago ConfigMap
templates:
  - configMap.mockxago.yaml
set:
  fullnameOverride: wallet
  release:
    name: wallet
  mockxago:
    enabled: true
    config:
      webhook_url: "http://wallet-backend-service-http:8080/webhooks/xago"
tests:
  - it: 'Should produce no ConfigMap when mockxago.enabled is boolean false'
    set:
      mockxago:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should produce no ConfigMap when mockxago.enabled is the string "false"'
    set:
      mockxago:
        enabled: "false"
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should produce no ConfigMap when mockxago.enabled is the string "true"'
    set:
      mockxago:
        enabled: "true"
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should create a ConfigMap when mockxago.enabled is boolean true'
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap

  - it: 'Should name the ConfigMap <fullname>-mockxago-config'
    asserts:
      - equal:
          path: metadata.name
          value: wallet-mockxago-config

  - it: 'Should store config as a single config.yaml file entry'
    asserts:
      - exists:
          path: data["config.yaml"]

  - it: 'Should include webhook_url in config.yaml'
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "webhook_url: http://wallet-backend-service-http:8080/webhooks/xago"

  - it: 'Should include test_mode in config.yaml'
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "test_mode: true"

  - it: 'Should include sensitive fields in config.yaml (empty by default)'
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "webhook_secret:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "public_key:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "secret:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "persona_webhook_token:"
