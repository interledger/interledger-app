suite: Mock Services - MockXago ConfigMap
templates:
  - configMap.mockxago.yaml
set:
  fullnameOverride: wallet
  release:
    name: wallet
  mockxago:
    enabled: true
    config:
      webhook_url: "http://wallet-backend-service-http:8080/webhooks/xago"
tests:
  - it: 'Should produce no ConfigMap when mockxago.enabled is boolean false'
    set:
      mockxago:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should produce no ConfigMap when mockxago.enabled is the string "false"'
    set:
      mockxago:
        enabled: "false"
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should produce no ConfigMap when mockxago.enabled is the string "true"'
    set:
      mockxago:
        enabled: "true"
    asserts:
      - hasDocuments:
          count: 0

  - it: 'Should create a ConfigMap when mockxago.enabled is boolean true'
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap

  - it: 'Should name the ConfigMap <fullname>-mockxago-config'
    asserts:
      - equal:
          path: metadata.name
          value: wallet-mockxago-config

  - it: 'Should set WEBHOOK_URL from config'
    asserts:
      - equal:
          path: data.WEBHOOK_URL
          value: "http://wallet-backend-service-http:8080/webhooks/xago"

  - it: 'Should set MOCKXAGO_REDIS_DB from config'
    asserts:
      - equal:
          path: data.MOCKXAGO_REDIS_DB
          value: "4"

  - it: 'Should set XAGO_MOCK_TEST_MODE from config'
    asserts:
      - equal:
          path: data.XAGO_MOCK_TEST_MODE
          value: "true"

  - it: 'Should set MOCKXAGO_ENFORCE_AUTHENTICATION from config'
    asserts:
      - equal:
          path: data.MOCKXAGO_ENFORCE_AUTHENTICATION
          value: "true"

  - it: 'Should not include sensitive credentials in ConfigMap'
    asserts:
      - notExists:
          path: data.WEBHOOK_SECRET
      - notExists:
          path: data.XAGO_API_PUBLIC_KEY
      - notExists:
          path: data.XAGO_API_SECRET
      - notExists:
          path: data.PERSONA_WEBHOOK_TOKEN
