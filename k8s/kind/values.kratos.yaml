# Kratos values for the local kind environment.

replicaCount: 1

image:
  repository: oryd/kratos
  tag: v1.3.1

kratos:
  automigration:
    enabled: true

  config:
    dsn: "postgres://postgres:postgres@postgres-postgresql.interledger:5432/kratos?sslmode=disable"

    cookies:
      same_site: Strict


    hashers:
      algorithm: argon2
      argon2:
        dedicated_memory: 1GB
        expected_deviation: 500ms
        expected_duration: 500ms
        iterations: 1
        key_length: 16
        memory: 128MB
        parallelism: 1
        salt_length: 16

    identity:
      default_schema_id: default
      schemas:
        - id: default
          url: base64:

    log:
      format: text
      leak_sensitive_values: true
      level: debug

    selfservice:
      allowed_return_urls:
        - http://interledger.kind
        - https://interledger.kind
        - https://interledger.kind/*
      default_browser_return_url: https://interledger.kind
      flows:
        error:
          ui_url: https://interledger.kind/error
        login:
          after:
            default_browser_return_url: https://interledger.kind
          lifespan: 10m
          ui_url: https://interledger.kind/login
        logout:
          after:
            default_browser_return_url: https://interledger.kind
        recovery:
          enabled: false
        registration:
          after:
            default_browser_return_url: https://interledger.kind
            password:
              default_browser_return_url: https://interledger.kind
              hooks:
                - hook: session
          enabled: true
          lifespan: 10m
          ui_url: https://interledger.kind/signup
        settings:
          privileged_session_max_age: 15m
          ui_url: https://interledger.kind/settings
        verification:
          enabled: false
      methods:
        link:
          config:
            base_url: https://interledger.kind
            lifespan: 1h
          enabled: true
        password:
          enabled: true
        totp:
          enabled: true
          config:
            issuer: interledger.kind
        lookup_secret:
          enabled: true

    serve:
      admin:
        port: 4434
      public:
        base_url: https://interledger.kind
        cors:
          enabled: true
        port: 4433

    session:
      cookie:
        domain: ""
        name: ory_kratos_session
        path: ""
        persistent: true
        same_site: Strict
      earliest_possible_extend: 24h
      lifespan: 420h
      whoami:
        required_aal: highest_available
