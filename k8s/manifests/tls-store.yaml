# Traefik TLSStore — sets the wildcard *.interledger.kind cert as the
# default TLS certificate for all HTTPS routes.
# The secret `kind-tls` is created by `make certs-apply`.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: interledger
spec:
  defaultCertificate:
    secretName: kind-tls
