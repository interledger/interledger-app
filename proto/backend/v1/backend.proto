syntax = "proto3";

package backend.v1;

import "google/rpc/code.proto";
import "google/rpc/error_details.proto";
import "google/rpc/status.proto";
import "google/protobuf/timestamp.proto";

option go_package = "./backend/v1;backend";

message PaginationRequest {
  int32 pageSize = 1;
  optional string pageToken = 2;
}

service OpenPaymentService {
  rpc CreatePaymentPointer(CreatePaymentPointerRequest) returns (Empty);
  rpc GetPaymentPointer(GetPaymentPointerRequest) returns (PaymentPointer);
  rpc PaymentPointerExists(PaymentPointerExistsRequest) returns (PaymentPointerExistsResponse);
  rpc ListWalletPaymentPointers(Empty) returns (ListWalletPaymentPointersResponse);
  rpc CreateQuote(CreateQuoteRequest) returns (Quote);
  rpc LookupQuote(LookupQuoteRequest) returns (Quote);
  rpc CreateIncomingPayment(CreateIncomingPaymentRequest) returns (IncomingPayment);
  rpc LookupIncomingPayment(LookupIncomingPaymentRequest) returns (IncomingPayment);
  rpc PreCheckOutgoingPayment(PreCheckOutgoingPaymentRequest) returns (PreCheckOutgoingPaymentResponse);
  rpc CreateOutgoingPayment(CreateOutgoingPaymentRequest) returns (OutgoingPayment);
  rpc LookupOutgoingPayment(LookupOutgoingPaymentRequest) returns (OutgoingPayment);
  rpc CanSendToPaymentPointer(CanSendToPaymentPointerRequest) returns (CanSendToPaymentPointerResponse);
}

message CanSendToPaymentPointerRequest {
  string paymentPointer = 1;
}

message CanSendToPaymentPointerResponse {
  bool canSend = 1;
}

message Transaction {
  string id = 1;
  string type = 2;
  Amount amount = 3;
  string source = 4;
  string destination = 5;
  google.protobuf.Timestamp timestamp = 6;
  string state = 7;
  repeated Transfer transfers = 8;
  string foreignId = 9;
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  string nextPageToken = 2;
}

message Amount {
  uint64 amount = 1;
  string asset = 2;
  int32 assetScale = 3;
}

message LookupOutgoingPaymentRequest {
  string id = 1;
}

message OutgoingPayment {
  string id = 1;
  string paymentPointer = 2;
  string toPaymentPointer = 11;
  bool failed = 3;
  string receiver = 4;
  Amount sendAmount = 5;
  Amount receiveAmount = 6;
  Amount sentAmount = 7;
  string description = 8;
  google.protobuf.Timestamp createdAt = 9;
  google.protobuf.Timestamp updatedAt = 10;
}

message PreCheckOutgoingPaymentRequest {
  string quoteID = 1;
}

message PreCheckOutgoingPaymentResponse {
  bool exceedsLimits = 1;
  string limitType = 2; // ANNUAL, MONTHLY, DAILY, HOLD (MAX BALANCE)
  bool insufficientBalance = 3;
}

message CreateOutgoingPaymentRequest {
  string quoteID = 1;
  string description = 2;
  string externalRef = 3;
  string ipAddress = 4;
  string idempotencyKey = 5;
}

message LookupIncomingPaymentRequest {
  string id = 1;
}

message CreateIncomingPaymentRequest {
  string paymentPointer = 1;
  optional Amount amount = 2;
  string reference = 3;
  google.protobuf.Timestamp expiresAt = 4;
}

message IncomingPayment{
  string id = 1;
  string paymentPointer = 2;
  string fromPaymentPointer = 10;
  optional Amount incomingAmount = 3;
  optional Amount receivedAmount = 4;
  bool completed = 5;
  string externalRef = 6;
  google.protobuf.Timestamp expiresAt = 7;
  google.protobuf.Timestamp createdAt = 8;
  google.protobuf.Timestamp updatedAt = 9;
}

message LookupQuoteRequest {
  string id = 1;
}

message CreateQuoteRequest {
  string sendPaymentPointer = 1;
  string receivePaymentPointer = 2;
  Amount amount = 3;
  google.protobuf.Timestamp expiresAt = 4;
  string description = 5;
  optional string sendLinkedAccount = 6;
}

message Quote {
  string id = 1;
  string paymentPointer = 2;
  string receiver = 3;
  Amount sendAmount = 4;
  Amount receiveAmount = 5;
  google.protobuf.Timestamp expiresAt = 6;
  google.protobuf.Timestamp createdAt = 7;
}

message PaymentPointerExistsRequest {
  string url = 1;
}

message PaymentPointerExistsResponse {
  bool exists = 1;
}

message GetPaymentPointerRequest {
  string url = 1;
}

message ListWalletPaymentPointersResponse {
  repeated PaymentPointer pointers = 1;
}

message CreatePaymentPointerRequest {
  string url = 1;
  string asset = 2;
  int32 assetScale = 3;
  string alias = 4;
}

message PaymentPointer {
  string url = 1;
  string asset = 2;
  int32 assetScale = 3;
  string alias = 4;
  string walletID = 5;
  string formatted = 6;
  string legalName = 7;
}

message Empty {}

service BackendService {
  rpc UpdateIndividualKYC(UpdateIndividualKYCRequest) returns (Empty);
  rpc IsUSPSAddress(Address) returns (IsUSPSAddressResponse);
  rpc SetSignupUserData(SetSignupUserDataRequest) returns (SetSignupUserDataResponse);
  rpc SetSignupMobileNumber(SetSignupMobileNumberRequest) returns (Empty);
  // Returns the current signup flow.
  rpc GetSignup(GetSignupRequest) returns (Signup);
  // Called after the user is created on Kratos with the new userID.
  rpc CompleteSignup(CompleteSignupRequest) returns (Empty);
  rpc CreateUserDefaultWallet(CreateUserDefaultWalletRequest) returns (Empty);
  // Allows sending and checking an sms verification.
  rpc SendPhoneVerification(SendPhoneVerificationRequest) returns (Empty);
  rpc SendOTP(Empty) returns (Empty);
  // Allows signing agreements and getting agreements by id.
  rpc GetAgreement(GetAgreementRequest) returns (Agreement);
  rpc SignAgreements(SignAgreementsRequest) returns (SignAgreementsResponse);
  rpc GetLinkedAccounts(Empty) returns (GetLinkedAccountsResponse);
  rpc GetLinkedAccount(GetLinkedAccountRequest) returns (LinkedAccount);
  rpc SetNicknameLinkedAccount(SetNicknameLinkedAccountRequest) returns (LinkedAccount);
  rpc DeleteLinkedAccount(DeleteLinkedAccountRequest) returns (Empty);
  rpc CreateSupportTicket(CreateSupportTicketRequest) returns (Empty);
  rpc GetCountries(Empty) returns (GetCountriesResponse);
  rpc GetCurrentWallet(Empty) returns (GetCurrentWalletResponse);

  //Machnet
  rpc GetMachnetWidgetToken(Empty) returns (MachnetWidgetToken);
  rpc ListBanks(Empty) returns (ListBanksResponse);
  rpc CreateReceiveBankAccount(CreateReceiveBankAccountRequest) returns (LinkedAccount);
  rpc StartMachnetKYC(Empty) returns(Empty);
  rpc HasSendUser(Empty) returns (HasSendUserResponse);
  rpc KYCStatus(Empty) returns (KYCStatusResponse);
  rpc CreateWallet(CreateWalletRequest) returns (LinkedAccount);
  rpc GetWalletBalance(Empty) returns (WalletBalance);
  rpc CheckMachnetWithdrawalLimit(CheckMachnetTXLimitRequest) returns (CheckMachnetTXLimitResponse);
  rpc StartWithdrawFromMachnetWallet(WithdrawFromMachnetWalletRequest) returns (Empty);
  rpc CheckMachnetTopupLimit(CheckMachnetTXLimitRequest) returns (CheckMachnetTXLimitResponse);
  rpc StartMachnetWalletTopup(StartMachnetWalletTopupRequest) returns(Empty);

  //Waitlist
  rpc JoinWaitlist(JoinWaitlistRequest) returns (JoinWaitlistResponse);
  rpc CanSignup(CanSignupRequest) returns(CanSignupResponse);
  rpc SetSignupComplete(SetSignupCompleteRequest) returns(Empty);
  rpc IsMugAvailable(IsMugAvailableRequest) returns(IsMugAvailableResponse);

  //Transactions
  rpc ListTransactions(PaginationRequest) returns (ListTransactionsResponse);
  rpc ListTransactionsCompleted(PaginationRequest) returns (ListTransactionsResponse);
  rpc ListTransactionsWithPending(PaginationRequest) returns (ListTransactionsResponse);
  rpc LookupTransaction(LookupTransactionRequest) returns (Transaction);

  // Limits
  rpc GetUserLimits(Empty) returns (GetUserLimitsResponse);

  //Statements
  rpc GetStatementPDF(GetStatementPDFRequest) returns (StatementPDF);

  //Client keys
  rpc CreateClientPublicKey(JWK) returns (Empty);
}

// example edDSA public key
// {
//   "kty": "OKP",
//   "kid": "test-key",
//   "alg": "EdDSA",
//   "crv": "Ed25519",
//   "use": "sign",
//   "x": "<base64 encoded public key>"
// }
message JWK {
  string kty = 1;
  string kid = 2;
  string alg = 3;
  string x = 4;
  string crv = 5;
  string use = 6;
}

message Transfer {
  string type = 1;
  string state = 2;
  google.protobuf.Timestamp timestamp = 3;
  Amount amount = 4;
  string foreignId = 5;
  string linkedAccountId = 6;
}

message ListStatementsResponse {
  repeated string periods = 1;
  string nextPageToken = 2;
}

message GetStatementPDFRequest {
  string period = 1;
}

message StatementPDF {
  bytes chunks = 1;
}

message CreateSupportTicketRequest {
  string description = 1;
  string firstName = 2;
  string lastName = 3;
  string email = 4;
}

message UpdateIndividualKYCRequest {
  optional string firstName = 1;
  optional string lastName = 2;
  optional string countryCode = 3;
  optional int32 gender = 4; // 0 Unknown, 1 Male, 2 Female, 3 Other
  optional google.protobuf.Timestamp dateOfBirth = 5;
  optional Address address = 6;
  string ipAddress = 7;
}

message Address {
  optional string line1 = 1;
  optional string line2 = 2;
  optional string building = 3;
  optional string apartment = 4;
  optional string city = 5;
  optional string state = 6;
  optional string zipCode = 7;
  optional string countryCode = 8;
  optional string placeID = 9;
  optional string formattedAddress = 10;
}

message IsUSPSAddressResponse {
  bool valid = 1;
}

message GetBankAccountWidgetRequest {}

message GetBankAccountWidgetResponse {
  string url = 1;
}

message AddBankAccountRequest {
  string userGuid = 1;
  string memberGuid = 2;
}

message AddBankAccountResponse {
  string fundingsourceId = 1;
}

message LinkedAccount {
  string id = 1;
  string type = 2;
  string name = 3;
  string mask = 4;
  string nickname = 5;
}

message GetSignupRequest {
  string id = 1;
}

message SetSignupUserDataRequest {
  optional string id = 1;
  string firstName = 2;
  string lastName = 3;
  string email = 4;
  string countryCode = 5;
}

message SetSignupUserDataResponse {
  string id = 1;
}

message SetSignupMobileNumberRequest {
  string id = 1;
  string mobile = 2;
  string otp = 3;
}

message Signup {
  string id = 1;
  string firstName = 2;
  string lastName = 3;
  string email = 4;
  string countryCode = 5;
  string mobileNumber = 6;
  string userId = 7;
  bool completed = 8;
}

message CompleteSignupRequest {
  string id = 1;
  string userId = 2;
}

message CreateUserDefaultWalletRequest {
  string userID = 1;
}

message SendPhoneVerificationRequest {
  string to = 1;
}

message GetAgreementRequest {
  string id = 1;
}

message Agreement {
  string content = 1;
}

message SignAgreementsRequest {
  repeated string agreementIds = 1;
  string userId = 2;
  string ipAddress = 3;
}

message SignAgreementsResponse {
  bool signed = 1;
}

message JoinWaitlistRequest {
  string email = 1;
  string country_code = 2;
  string full_name = 3;
  bool  beta_opt_in = 4;
  optional string mug_id = 5;
}

message JoinWaitlistResponse {}

message IsMugAvailableRequest {
  string mug_id = 1;
}

message IsMugAvailableResponse {
  bool available = 1;
}

message GetLinkedAccountsResponse {
  repeated LinkedAccount linkedAccounts = 1;
}

message GetLinkedAccountRequest {
  string id = 1;
}

message SetNicknameLinkedAccountRequest {
  string id = 1;
  string nickname = 2;
}

message DeleteLinkedAccountRequest {
  string id = 1;
}

message Country {
  string id = 1;
  string name = 2;
}

message GetCountriesResponse {
  repeated Country countries = 1;
}

message MachnetWidgetToken {
  string value = 1;
  int64 expiresInMinutes = 2;
  string userId = 3;
}

message Branch {
  uint32 id = 1;
  string name = 2;
}

message Bank {
  uint32 id = 1;
  string name = 2;
  repeated Branch branches = 3;
}

message ListBanksResponse {
  repeated Bank banks = 1;
}

message CreateReceiveBankAccountRequest {
  string name = 1;
  uint32 bank_id = 2;
  uint32 branch_id = 3;
  string account_type = 4;
  string account_number = 5;
  string otp = 6;
}

message CanSignupRequest{
  string id = 1;
}

message CanSignupResponse{
  bool canSignup = 1;
}

message SetSignupCompleteRequest{
  string id = 1;
  string userId = 2;
}

message HasSendUserResponse{
  bool hasSendUser = 1;
}

message KYCStatusResponse {
  bool hasSendUser = 1;
  int32 kycStatus = 2;
  repeated string failedFields = 3;
}

message CreateWalletRequest{
  string nickname = 1;
}

message WalletBalance{
  uint64 balance = 1;
  uint64 available = 2;
}

message WithdrawFromMachnetWalletRequest {
  string toLinkedAccountId = 1;
  uint64 amount = 2;  
  string ipAddress = 3;
  string idempotencyKey = 4;
}

message CheckMachnetTXLimitRequest {
  uint64 amount = 1;
  string currency = 2;
}

message CheckMachnetTXLimitResponse {
  bool exceedsLimits = 1;
  string limitType = 2; // ANNUAL, MONTHLY, DAILY, HOLD (MAX BALANCE)
}

message StartMachnetWalletTopupRequest {
  string fromLinkedAccountId = 1;
  uint64 amount = 2;
  string ipAddress = 3;
  string currency = 4;
  string idempotencyKey = 5;
}

message LookupTransactionRequest {
  string id = 1;
}

message GetCurrentWalletResponse {
  string id = 1;
}

message GetUserLimitsResponse {
  Limit FundWallet = 1;
  Limit Withdrawal = 2;
  Limit Transfer = 3;
}

message Limit {
  LimitAmount Annual = 1;
  LimitAmount Daily = 2;
  LimitAmount Monthly = 3;
  LimitAmount WalletHold = 4;
}

message LimitAmount {
  string remaining = 1;
  string total = 2;
  int32 percentage = 3;
}
