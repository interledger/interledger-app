syntax = "proto3";

package backend.v1;

import "google/protobuf/timestamp.proto";

import "google/rpc/code.proto";
import "google/rpc/error_details.proto";
import "google/rpc/status.proto";

option go_package = "./backend/v1;backend";

message PaginationRequest {
  int32 pageSize = 1;
  optional string pageToken = 2;
}

message Empty {}

service BackendService {
  rpc UpdateIndividualKYC(UpdateIndividualKYCRequest) returns (Empty);
  rpc GetIndividualKYC(Empty) returns (IndividualKYCResponse);
  rpc IsUSPSAddress(Address) returns (IsUSPSAddressResponse);
  rpc SetSignupUserData(SetSignupUserDataRequest) returns (SetSignupUserDataResponse);
  rpc SetSignupMobileNumber(SetSignupMobileNumberRequest) returns (Empty);
  // Returns the current signup flow.
  rpc GetSignup(GetSignupRequest) returns (Signup);
  // Called after the user is created on Kratos with the new userID.
  rpc CompleteSignup(CompleteSignupRequest) returns (Empty);
  rpc CreateUserDefaultWallet(CreateUserDefaultWalletRequest) returns (Empty);
  // Wallet
  rpc CreateWalletAddress(CreateWalletAddressRequest) returns (Empty);
  rpc WalletAddressValid(WalletAddressValidRequest) returns (WalletAddressValidResponse);
  rpc SetWalletName(SetWalletNameRequest) returns (Empty);
  rpc GetWalletInfo(Empty) returns (WalletInfo);
  rpc GetPublicWalletInfo(GetPublicWalletInfoRequest) returns (PublicWalletInfo);
  // Allows sending and checking an sms verification.
  rpc SendPhoneVerification(SendPhoneVerificationRequest) returns (Empty);
  rpc CheckPhoneVerification(CheckPhoneVerificationRequest) returns (Empty);
  rpc SendOTP(Empty) returns (Empty);
  // Allows signing agreements and getting agreements by id.
  rpc GetAgreement(GetAgreementRequest) returns (Agreement);
  rpc SignAgreements(SignAgreementsRequest) returns (SignAgreementsResponse);
  rpc GetLinkedAccounts(Empty) returns (GetLinkedAccountsResponse);
  rpc GetLinkedAccount(GetLinkedAccountRequest) returns (LinkedAccount);
  rpc SetDefaultReceiveLinkedAccount(SetDefaultReceiveLinkedAccountRequest) returns (LinkedAccount);
  rpc SetDefaultSendLinkedAccount(SetDefaultSendLinkedAccountRequest) returns (LinkedAccount);
  rpc SetNicknameLinkedAccount(SetNicknameLinkedAccountRequest) returns (LinkedAccount);
  rpc DeleteLinkedAccount(DeleteLinkedAccountRequest) returns (Empty);
  rpc GetCountries(Empty) returns (GetCountriesResponse);
  rpc GetCurrentWallet(Empty) returns (GetCurrentWalletResponse);

  //Waitlist
  rpc JoinWaitlist(JoinWaitlistRequest) returns (JoinWaitlistResponse);
  rpc CanSignup(CanSignupRequest) returns (CanSignupResponse);
  rpc SetSignupComplete(SetSignupCompleteRequest) returns (Empty);
  rpc IsMugAvailable(IsMugAvailableRequest) returns (IsMugAvailableResponse);

  //Transactions
  rpc ListTransactions(PaginationRequest) returns (ListTransactionsResponse);
  rpc ListTransactionsCompleted(PaginationRequest) returns (ListTransactionsResponse);
  rpc ListTransactionsWithPending(PaginationRequest) returns (ListTransactionsResponse);
  rpc LookupTransaction(LookupTransactionRequest) returns (Transaction);
  rpc ListPendingWebMonetization(Empty) returns (ListTransactionsResponse);

  // Connections
  rpc CreateConnection(CreateConnectionRequest) returns (Empty);
  rpc ListConnections(Empty) returns (ListConnectionsResponse);
  rpc GetConnection(GetConnectionRequest) returns (Connection);
  rpc DeleteConnection(DeleteConnectionRequest) returns (Empty);

  // Public Wallet Data
  rpc GetPublicWalletDetails(GetPublicWalletDetailsRequest) returns (GetPublicWalletDetailsResponse);

  // Contacts
  rpc CreateContact(CreateContactRequest) returns (Contact);
  rpc ListContacts(ListContactsRequest) returns (ListContactsResponse);

  // Identities
  rpc ListIdentities(Empty) returns (ListIdentitiesResponse);
  rpc ListPublicIdentities(ListPublicIdentitiesRequest) returns (ListIdentitiesResponse);
  rpc DeleteIdentity(DeleteIdentityRequest) returns (Empty);
  rpc SetIdentityPublic(SetIdentityPublicRequest) returns (Identity);
  rpc GetIdentity(GetIdentityRequest) returns (GetIdentityResponse);
  rpc GetIdentityBySignatureHash(GetIdentityBySignatureHashRequest) returns (GetIdentityResponse);
  rpc VerifyIdentity(VerifyIdentityRequest) returns (Empty);

  // KYC
  rpc KYCStatus(Empty) returns (KYCStatusResponse);
  rpc SetKYCStatusPending(Empty) returns (Empty);
  rpc GetPersonaInquiry(KYCPersonaInquiryRequest) returns (KYCPersonaInquiryResponse);
  rpc GetKYCProviderWidget(GetKYCProviderWidgetRequest) returns (KYCProviderWidget);

  // Basistheory
  rpc GetCardDetails(GetCardDetailsRequest) returns (CardDetails);

  // Features
  rpc ListFeatures(Empty) returns (Features);

  // Twitter
  rpc CreateTwitterAuthURL(Empty) returns (CreateTwitterAuthURLResponse);
  rpc TwitterCallback(TwitterCallbackRequest) returns (TwitterCallbackResponse);

  // Domain Identities
  rpc CreateDomainIdentity(CreateDomainIdentityRequest) returns (CreateDomainIdentityResponse);

  // Payments
  rpc GetPaymentAddress(GetPaymentAddressRequest) returns (GetPaymentAddressResponse);
  rpc CreatePayment(CreatePaymentRequest) returns (Payment);
  rpc UpdatePayment(UpdatePaymentRequest) returns (Payment);
  rpc GetPayment(GetPaymentRequest) returns (Payment);
  rpc ConfirmPayment(ConfirmPaymentRequest) returns (Payment);
  rpc GetLinkedAccountsForPayment(GetLinkedAccountsForPaymentRequest) returns (GetLinkedAccountsForPaymentResponse);

  // Balances
  rpc GetBalances(Empty) returns (GetBalancesResponse);

  rpc GetLinkedAccountsForWithdraw(GetLinkedAccountsForTransferRequest) returns (GetLinkedAccountsForPaymentResponse);
  rpc WithdrawBalance(TransferBalanceRequest) returns (Payment);

  rpc GetLinkedAccountsForDeposit(GetLinkedAccountsForTransferRequest) returns (GetLinkedAccountsForPaymentResponse);
  rpc DepositBalance(TransferBalanceRequest) returns (Payment);

  // Search
  rpc SearchWallets(SearchWalletsRequest) returns (SearchWalletsResponse);

  // Slack
  rpc CreateSlackAuthURL(Empty) returns (CreateSlackAuthURLResponse);
  rpc SlackCallback(SlackCallbackRequest) returns (SlackCallbackResponse);

  // Xago
  rpc AddXagoBankAccount(AddXagoBankAccountRequest) returns (LinkedAccount);
  rpc AddXagoBalanceAccount(AddXagoBalanceAccountRequest) returns (LinkedAccount);
  rpc WithdrawXagoBalance(WithdrawXagoBalanceRequest) returns (Payment);
  rpc GetXagoBalances(Empty) returns (GetXagoBalanceResponse);
  rpc GetXagoDepositDetails(GetXagoDepositDetailsRequest) returns (GetXagoDepositDetailsResponse);
  rpc DepositTestXago(Empty) returns (Empty);

  // Pti
  rpc GetPtiBalances(Empty) returns (GetPtiBalancesResponse);
  rpc CreatePtiToken(PtiTokenRequest) returns (PtiTokenResponse);
  rpc CreateCard(CreateCardRequest) returns (LinkedAccount);
  rpc CreatePtiBankAccount(CreatePtiBankAccountRequest) returns (LinkedAccount);
  rpc PtiCreateDeposit(PtiCreateDepositRequest) returns (Empty);
  rpc CreatePTIWithdrawal(CreatePTIWithdrawalRequest) returns (CreatePTIWithdrawalResponse);
  
  // Rafiki
  rpc ListRafikiGrants(Empty) returns (ListRafikiGrantsResponse);
  rpc GetRafikiGrant(GetRafikiGrantRequest) returns (RafikiGrant);
  rpc RevokeRafikiGrant(RevokeRafikiGrantRequest) returns (Empty);

  // Gatehub
  rpc GetGatehubOnboardingWidget(Empty) returns (GatehubWidget);
  rpc GetOnOffRampProvider(Empty) returns (GetOnOffRampProviderResponse);
  rpc GetGatehubDepositWidget(Empty) returns (GatehubWidget);
  rpc GetGatehubWithdrawalWidget(Empty) returns (GatehubWidget);
  rpc CreateGatehubWithdrawal(CreateGatehubWithdrawalRequest) returns (CreateGatehubWithdrawalResponse);

  // Chimoney
  rpc SetChimoneyInterlocEmail(SetChimoneyInterlocEmailRequest) returns (ChimoneyInterlocEmail);
  rpc GetChimoneyInterlocEmail(Empty) returns (ChimoneyInterlocEmail);
  rpc CreateChimoneyWallet(Empty) returns (Empty);
  rpc GetChimoneyDepositLink(Amount) returns (GetChimoneyDepositLinkResponse);

  // Cards
  rpc ListCards(Empty) returns (ListCardsResponse);
  rpc GetCardOrderOptions(Empty) returns (GetCardOrderOptionsResponse);
  rpc OrderCard(OrderCardRequest) returns (Empty);
  rpc GetCardToken(GetCardTokenRequest) returns (GetCardTokenResponse);
  rpc FreezeCard(FreezeCardRequest) returns (Empty);
  rpc UnfreezeCard(UnfreezeCardRequest) returns (Empty);
  rpc BlockCard(BlockCardRequest) returns (Empty);
  rpc GetPendingThreeDSConfirmations(Empty) returns (GetPendingThreeDSConfirmationsResponse);
  rpc ThreeDSPaymentConfirmation(ThreeDSPaymentConfirmationRequest) returns (Empty);

  // Phone confirmation
  rpc ConfirmUserPhone(ConfirmUserPhoneRequest) returns (Empty);
  rpc UpdateUserPhone(UpdateUserPhoneRequest) returns (Empty);
}

message ThreeDSPaymentConfirmationRequest {
  string transactionId = 1;
  bool confirmed = 2;
}

message ConfirmUserPhoneRequest {
  string otp = 1;
}

message UpdateUserPhoneRequest {
  string phone = 1;
}

message PendingThreeDSConfirmation {
  string transactionId = 1;
  string merchantName = 2;
  string purchaseAmount = 3;
  string purchaseCurrency = 4;
  string purchaseDate = 5;
  string timeout = 6;
}

message GetPendingThreeDSConfirmationsResponse {
  repeated PendingThreeDSConfirmation confirmations = 1;
}

message FreezeCardRequest {
  string cardId = 1;
}

message UnfreezeCardRequest {
  string cardId = 1;
}

message BlockCardRequest {
  string cardId = 1;
}

enum CardTokenType {
  CARD_TOKEN_TYPE_PIN = 0;
  CARD_TOKEN_TYPE_PIN_CHANGE = 1;
  CARD_TOKEN_TYPE_CARD_DATA = 2;
  CARD_TOKEN_TYPE_APPLE_PROVISIONING = 3;
  CARD_TOKEN_TYPE_GOOGLE_PROVISIONING = 4;
  CARD_TOKEN_TYPE_DIGITALIZATION_PAI = 5;
}

message TokenLink {
  string href = 1;
  string rel = 2;
  string method = 3;
}

message GetCardTokenRequest {
  CardTokenType tokenType = 1;
  string cardId = 2;
  optional string publicKey = 3;
}

message GetCardTokenResponse {
  string token = 1;
  repeated TokenLink links = 2;
}

message GetCardOrderOptionsResponse {
  bool isWaitingForCreation = 1;
  repeated CardApplicationProduct products = 2;;
  repeated CustomerDeliveryAddress addresses = 3;;
  repeated Country countries = 4;
}

message OrderCardRequest {
  CardType type = 1;
  string cardProductCode = 2;

  oneof deliveryAddress {
    string deliveryAddressId = 3;
    NewCustomerDeliveryAddress newDeliveryAddress = 4;
  }
}

message CardApplicationProduct {
  string code = 1;
  string name = 2;
}

enum CustomerDeliveryAddressType {
  CUSTOMER_DELIVERY_ADDRESS_OTHER = 0;
  CUSTOMER_DELIVERY_ADDRESS_PERMANENT_RESIDENCE = 1;
  CUSTOMER_DELIVERY_ADDRESS_TEMPORARY_RESIDENCE = 2;
  CUSTOMER_DELIVERY_ADDRESS_WORK = 3;
}

message CustomerDeliveryAddressBase {
  CustomerDeliveryAddressType type = 1;
  string countryCode = 2;
  string line1 = 3;
  optional string line2 = 4;
  optional string line3 = 5;
  optional string postOffice = 6;
  string city = 7;
  string zipCode = 8;
}

message CustomerDeliveryAddress {
  CustomerDeliveryAddressBase details = 1;
  string id = 2;
}

message NewCustomerDeliveryAddress {
  CustomerDeliveryAddressBase details = 1;
  string reason = 2;
}

enum CardType {
  CARD_TYPE_UNKNOWN = 0;
  CARD_TYPE_PHYSICAL = 1;
  CARD_TYPE_VIRTUAL = 2;
}

enum CardStatus {
  CARD_STATUS_UNKNOWN = 0;
  CARD_STATUS_ACTIVE = 1;
  CARD_STATUS_BLOCKED = 2;
  CARD_STATUS_TEMPORARY_BLOCKED = 3;
  CARD_STATUS_REPLACED = 4;
  CARD_STATUS_SOFT_DELETE = 5;
  CARD_STATUS_ACCOUNT_BLOCKED = 6;
  CARD_STATUS_IN_CREATION = 7;
}

enum CardStatusReasonCode {
  CARD_STATUS_REASON_CODE_UNKNOWN = 0;
  CARD_STATUS_REASON_CODE_NONE = 1;
  CARD_STATUS_REASON_CODE_CLIENT_REQUESTED_LOCK = 2;
  CARD_STATUS_REASON_CODE_LOST_CARD = 3;
  CARD_STATUS_REASON_CODE_STOLEN_CARD = 4;
  CARD_STATUS_REASON_CODE_ISSUER_REQUEST_GENERAL = 5;
  CARD_STATUS_REASON_CODE_ISSUER_REQUEST_FRAUD = 6;
  CARD_STATUS_REASON_CODE_ISSUER_REQUEST_LEGAL = 7;
  CARD_STATUS_REASON_CODE_ISSUER_REQUEST_INCORRECT_OPENING = 8;
  CARD_STATUS_REASON_CODE_CARD_DAMAGED_OR_NOT_WORKING = 9;
  CARD_STATUS_REASON_CODE_USER_REQUEST = 10;
  CARD_STATUS_REASON_CODE_ISSUER_REQUEST_CUSTOMER_DECEASED = 11;
  CARD_STATUS_REASON_CODE_PRODUCT_DOES_NOT_RENEW = 12;
  CARD_STATUS_REASON_CODE_PRODUCT_CHANGE = 13;
  CARD_STATUS_REASON_CODE_RENEWED = 14;
}

enum CardLockLevel {
  CARD_LOCK_LEVEL_UNKNOWN = 0;
  CARD_LOCK_LEVEL_NONE = 1;
  CARD_LOCK_LEVEL_CLIENT = 2;
  CARD_LOCK_LEVEL_ADMIN = 3;
}

message Card {
  reserved 7;
  string id = 1;
  string nameOnCard = 2;
  string maskedPan = 3;
  CardStatus status = 4;
  CardStatusReasonCode statusReasonCode = 5;
  CardLockLevel lockLevel = 6;
  CardType type = 8;
  string productCode = 9;
  }

message ListCardsResponse {
  bool isWaitingForCreation = 1;
  repeated Card cards = 2;
}

message CreatePtiBankAccountRequest {
  string bankName = 1;
  string accountNumber = 2;
  string routingNumber = 3;
  string accountType = 4;
}

message PtiTokenRequest{
  string url = 1;
  string method = 2;
}

message PtiTokenResponse {
  string accessToken = 1;
  double expiresAt = 2;
  string tokenType = 3;
}

message GetChimoneyDepositLinkResponse {
  string link = 1;
}

message ChimoneyInterlocEmail {
  string email = 1;
}

message SetChimoneyInterlocEmailRequest {
  string email = 1;
}

message CreateGatehubWithdrawalRequest {
  string externalTransactionId = 1;
}

message CreateGatehubWithdrawalResponse {
  string transactionId = 1;
}

message CreatePTIWithdrawalRequest {
  string paymentId = 1;
}

message CreatePTIWithdrawalResponse {
  string paymentId = 1;
}

message GetOnOffRampProviderResponse {
  string provider = 1;
}

message GetKYCProviderWidgetRequest {
  string idempotencyKey = 1;
}

message KYCProviderWidget {
  string provider = 1;
  GatehubWidget gatehubWidget = 2;
  KYCPersonaInquiryResponse personaInquiry = 3;
  string chimoneyWidget = 4;
  PtiWidget ptiWidget = 5;
}

message PtiWidget {
  string scenarioId = 1;
  string userId = 2;
  string requestId = 3;
  string clientId = 4;
  string generateTokenPath = 5;
  string sdkUrl = 6;
  string formsUrl = 7;
}

message GatehubWidget {
  string widgetUrl = 1;
}

message RevokeRafikiGrantRequest {
  string id = 1;
}

message GetRafikiGrantRequest {
  string id = 1;
}

message ListRafikiGrantsResponse {
  repeated RafikiGrant grants = 1;
}

message RafikiGrant {
  string id = 1;
  string client = 2;
  string state = 3;
  string finalizationReason = 4;
  string createdAt = 5;
  repeated RafikiAccess access = 6;
}

message RafikiAccess {
  string id = 1;
  string identifier = 2;
  string type = 3;
  repeated string actions = 4;
  RafikiLimits limits = 5;
}

message RafikiLimits {
  string receiver = 1;
  string interval = 2;
  Amount debitAmount = 3;
  Amount receiveAmount = 4;
  string formattedDebitAmount = 5;
  string formattdReceiveAmount = 6;
}

message GetLinkedAccountsForTransferRequest {
  // The ID of the linked account for the balance to deposit to/withdraw from.
  string linkedAccountId = 1;
}

message GetLinkedAccountsForPaymentRequest {
  string paymentId = 1;
}

message GetLinkedAccountsForPaymentResponse {
  repeated LinkedAccountForPayment linkedAccounts = 1;
}

message LinkedAccountForPayment {
  LinkedAccount details = 1;
  bool enabled = 2;
}

message GetXagoDepositDetailsRequest {
  string linkedAccount = 1;
}

message GetXagoDepositDetailsResponse {
  repeated XagoDepositDetails details = 1;
}

message XagoDepositDetails {
  string currency = 1;
  string accountNumber = 2;
  string branchCode = 3;
  string bankName = 4;
  string depositReference = 5;
}

message GetBalancesResponse {
  repeated Balance balances = 1;
}

message Balance {
  Amount balance = 1;
  string currency = 2;
  string countryCode = 3;
  string linkedAccount = 4;
  string formattedBalance = 5;
}

message GetPtiBalancesResponse {
  repeated PtiBalance balances = 1;
}

message PtiBalance {
  Amount balance = 1;
  Amount available = 2;
  string currency = 3;
  string linkedAccount = 4;
  string formattedBalance = 5;
  string formattedAvailableBalance = 6;
}

message PtiCreateDepositRequest {
  string id = 1;
  optional string ipAddress = 2;
}

message GetXagoBalanceResponse {
  repeated XagoBalance balances = 2;
}

message XagoBalance {
  Amount balance = 1;
  Amount available = 2;
  string currency = 3;
  string linkedAccount = 4;
  string formattedBalance = 5;
  string formattedAvailableBalance = 6;
}

message WithdrawXagoBalanceRequest {
  string fromLinkedAccount = 1;
  string toLinkedAccount = 2;
  Amount amount = 3;
  string note = 4;
}

message AddXagoBalanceAccountRequest {
  string currencyCode = 1; // e.g. USD or ZAR
  string nickname = 2;
  string title = 3;
}

message AddXagoBankAccountRequest {
  string accountNumber = 1;
  string branchCode = 2;
  string bankName = 3;
  string iban = 4;
  string bic = 5;
}

message SetDefaultSendLinkedAccountRequest {
  string id = 1;
}

message SetDefaultReceiveLinkedAccountRequest {
  string id = 1;
}

message SlackCallbackRequest {
  string state = 1;
  string code = 2;
}

message SlackCallbackResponse {
  string id = 1;
}

message CreateSlackAuthURLResponse {
  string url = 1;
}

message Amount {
  int64 amount = 1;
  string asset = 2;
  int32 assetScale = 3;
  string country = 4;
}

message CardTransactionDetails {
  string card_id = 1;
  string card_masked_pan = 2;
  int64 type = 3;
}

message Transaction {
  reserved 8;
  string id = 1;
  string type = 2;
  Amount amount = 3;
  string source = 4;
  string destination = 5;
  google.protobuf.Timestamp timestamp = 6;
  string state = 7;
  string foreignId = 9;
  string receiverAccountId = 10;
  string senderAccountId = 11;

  // Display
  string title = 12;
  string formattedAmount = 13;
  string formattedTime = 14;
  string formattedDate = 15;
  string subtotal = 16;
  string fees = 17;
  string accountTitle = 18;
  string reference = 19;
  string destinationIdentity = 20;
  string destinationIdentityType = 21;
  int32 refundState = 22; // NA , PENDING , COMPLETE
  string fundsReceived = 23;

  optional CardTransactionDetails cardTransactionDetails = 24;
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  string nextPageToken = 2;
}

message ConfirmPaymentRequest {
  string id = 1; // id or publicID
}

message GetPaymentRequest {
  string id = 1; // id or publicID
}

message UpdatePaymentRequest {
  string id = 1; // id or publicID
  optional Amount senderAmount = 2;
  optional Amount receiverAmount = 3;
  optional string note = 4;
  optional string senderAccount = 5; // Linked Account ID
  optional string receiverAccount = 6; // Linked Account ID
  optional string receiverIdentity = 7;
  optional int32 receiverIdentityType = 8; // 1 - Twitter, 2 - WalletID, 3 - WalletURL
  optional string threeDSID = 9;
  optional string ipAddress = 10;
}

message Payment {
  string id = 1;
  string publicID = 2;
  int32 state = 3; // 1 - Created, 2 - Confirmed, 3 - Processing, 4 - Completed, 5 - Failed
  string receiverWalletUrl = 4;
  string receiverIdentity = 5;
  int32 receiverIdentityType = 6; // 1 - Twitter, 2 - WalletID, 3 - WalletURL
  Amount senderAmount = 7;
  string senderAccount = 8; // Linked Account ID
  string note = 9;
  repeated int32 requiredActions = 10; // 1 - ThreeDS
  string fxRate = 11;
  Amount receiverAmount = 12;
  string totalSendAmount = 13; // total debit amount
  string receiverLinkedAccountCountryCode = 14;
  string formattedFees = 15;
  string receiverAccount = 16; // Linked account ID. Only populated on withdrawals
  string receivedNetAmount = 17; // withdrawal net amount received after fees
}

message CreatePaymentRequest {
  Amount senderAmount = 1;
  Amount receiverAmount = 2;
  string receiverIdentity = 3;
  int32 receiverIdentityType = 4; // 1 - Twitter, 2 - WalletID, 3 - WalletURL
  optional string senderAccount = 5; // Linked Account ID
  optional string receiverAccount = 6; // Linked Account ID
  optional string note = 7;
  optional string ipAddress = 8;
}

message TransferBalanceRequest {
  string fromLinkedAccount = 1;
  string toLinkedAccount = 2;
  Amount amount = 3;
  string note = 4;
}

message GetCardDetailsRequest {
  string id = 1;
}

message CardDetails {
  string id = 1;
  string network = 2;
  string bin = 3;
  string last4 = 4;
  string type = 5;
  string expiration = 6;
  string nickname = 7;
  string state = 8;
  bool canSend = 9;
  bool canReceive = 10;
}

message SearchWalletsRequest {
  string term = 1;
}

message SearchWalletsResponse {
  repeated SearchResult results = 1;
}

message SearchResult {
  string walletID = 1;
  string walletUrl = 5;
  bool canSend = 4 [deprecated = true];
  string identifier = 2;
  string identifierType = 3;
  repeated SearchResult subResults = 6;
}

message GetPublicWalletInfoRequest {
  string walletAddress = 1;
}

message PublicWalletInfo {
  string walletID = 1;
  string address = 2;
  string shortAddress = 3;
  string publicName = 4;
  repeated Identity identities = 5;
  bool canReceive = 6;
}

message WalletInfo {
  string walletID = 1;
  string url = 2;
  string formattedURL = 3;
  bool hasCard = 4;
  bool hasBank = 5;
  bool hasIdentities = 6;
  bool hasTransacted = 7;
  bool hasWalletAddress = 8;
  bool hasBalances = 9;
  bool exceededLimits = 10;
  string country = 11;
}

message Features {
  bool sendEnabled = 1;
  bool receiveEnabled = 2;
  bool linkedAccountsEnabled = 3;
  bool cardsEnabled = 4;
  bool banksEnabled = 5;
  bool identitiesEnabled = 6;
  bool twitterEnabled = 7;
  bool addCardsEnabled = 8;
  bool interacEnabled = 9;
  bool zarBalanceEnabled = 10;
  bool manageWalletCardsEnabled = 11;
  bool accountEnabled = 12;
  bool accountsTabEnabled = 13;
}

message CreateCardRequest {
  string tokenID = 1;
}

message InitQuote3DSRequest {
  string quoteID = 1;
}

message Connection {
  string id = 1;
  string applicationName = 2;
  string publicKeyFingerprint = 3;
  string createdAt = 4;
  string lastUsedAt = 5;
}

message CreateConnectionRequest {
  string applicationName = 1;
  string publicKey = 2; // pem encoded ed25519 public key
}

message GetConnectionRequest {
  string id = 1;
}

message DeleteConnectionRequest {
  string id = 1;
}

message ListConnectionsResponse {
  repeated Connection keys = 1;
}

message Transfer {
  string type = 1;
  string state = 2;
  google.protobuf.Timestamp timestamp = 3;
  Amount amount = 4;
  string foreignId = 5;
  string linkedAccountId = 6;
}

message IndividualKYCResponse {
  string firstName = 1;
  string lastName = 2;
  string countryCode = 3;
  int32 gender = 4; // 0 Unknown, 1 Male, 2 Female, 3 Other
  google.protobuf.Timestamp dateOfBirth = 5;
  Address address = 6;
  string placeOfBirth = 7;
  string nationality = 8;
}

message UpdateIndividualKYCRequest {
  optional string firstName = 1;
  optional string lastName = 2;
  optional string countryCode = 3;
  optional int32 gender = 4; // 0 Unknown, 1 Male, 2 Female, 3 Other
  optional google.protobuf.Timestamp dateOfBirth = 5;
  optional Address address = 6;
  string ipAddress = 7;
  optional string placeOfBirth = 8;
  optional string nationality = 9;
}

message Address {
  optional string line1 = 1;
  optional string line2 = 2;
  optional string building = 3;
  optional string apartment = 4;
  optional string city = 5;
  optional string state = 6;
  optional string zipCode = 7;
  optional string countryCode = 8;
  optional string placeID = 9;
  optional string formattedAddress = 10;
}

message IsUSPSAddressResponse {
  bool valid = 1;
}

message GetBankAccountWidgetRequest {}

message GetBankAccountWidgetResponse {
  string url = 1;
}

message AddBankAccountRequest {
  string userGuid = 1;
  string memberGuid = 2;
}

message AddBankAccountResponse {
  string fundingsourceId = 1;
}

message LinkedAccount {
  string id = 1;
  string type = 2;
  string name = 3;
  string mask = 4;
  string nickname = 5;

  // Display
  bool canSend = 6;
  bool canReceive = 7;
  string title = 8;

  string sendCurrencyCode = 9; // e.g. USD
  string sendCurrencyCountryCode = 10; // e.g. US
  string receiveCurrencyCode = 11;
  string receiveCurrencyCountryCode = 12;
  bool defaultSend = 13;
  bool defaultReceive = 14;
  string state = 15;
  string createdAt = 16;
}

message GetSignupRequest {
  string id = 1;
}

message SetSignupUserDataRequest {
  optional string id = 1;
  string firstName = 2;
  string lastName = 3;
  string email = 4;
  string countryCode = 5;
}

message SetSignupUserDataResponse {
  string id = 1;
}

message SetSignupMobileNumberRequest {
  string id = 1;
  string mobile = 2;
  string otp = 3;
}

message Signup {
  string id = 1;
  string firstName = 2;
  string lastName = 3;
  string email = 4;
  string countryCode = 5;
  string mobileNumber = 6;
  string userId = 7;
  bool completed = 8;
}

message CompleteSignupRequest {
  string id = 1;
  string userId = 2;
}

message CreateUserDefaultWalletRequest {
  string userID = 1;
}

message SendPhoneVerificationRequest {
  string to = 1;
}

message CheckPhoneVerificationRequest {
  string to = 1;
  string otp = 2;
}

message GetAgreementRequest {
  string id = 1;
}

message Agreement {
  string content = 1;
}

message SignAgreementsRequest {
  repeated string agreementIds = 1;
  string userId = 2;
}

message SignAgreementsResponse {
  bool signed = 1;
}

message JoinWaitlistRequest {
  string email = 1;
  string country_code = 2;
  string full_name = 3;
  bool beta_opt_in = 4;
  optional string mug_id = 5;
}

message JoinWaitlistResponse {}

message IsMugAvailableRequest {
  string mug_id = 1;
}

message IsMugAvailableResponse {
  bool available = 1;
}

message GetLinkedAccountsResponse {
  repeated LinkedAccount linkedAccounts = 1;
}

message GetLinkedAccountRequest {
  string id = 1;
}

message SetNicknameLinkedAccountRequest {
  string id = 1;
  string nickname = 2;
}

message DeleteLinkedAccountRequest {
  string id = 1;
}

message Country {
  string id = 1;
  string name = 2;
}

message GetCountriesResponse {
  repeated Country countries = 1;
}

message CanSignupRequest {
  string id = 1;
}

message CanSignupResponse {
  bool canSignup = 1;
}

message SetSignupCompleteRequest {
  string id = 1;
  string userId = 2;
}

message LookupTransactionRequest {
  string id = 1;
}

message GetCurrentWalletResponse {
  string id = 1;
  string country = 2;
}

message Limit {
  LimitAmount Annual = 1;
  LimitAmount Daily = 2;
  LimitAmount Monthly = 3;
  LimitAmount WalletHold = 4;
}

message LimitAmount {
  string remaining = 1;
  string total = 2;
  int32 percentage = 3;
}

message WalletAddressValidRequest {
  string url = 1;
}

message WalletAddressValidResponse {
  bool exists = 1;
}

message CreateWalletAddressRequest {
  string url = 1;
  string asset = 2;
  int32 assetScale = 3;
  string alias = 4;
}

message SetWalletNameRequest {
  string name = 1;
}

message GetPublicWalletDetailsRequest {
  string id = 1;
}

message GetPublicWalletDetailsResponse {
  string id = 1;
  string publicName = 2;
}

message ConfiguredLimit {
  string foreignId = 1;
  string foreignDisplay = 2;
  string foreignType = 3;
  Amount daily = 4;
  Amount monthly = 5;
  Amount overall = 6;
}

message Contact {
  string id = 1;
  string payment_pointer = 2;
  string name = 3;
  string wallet_id = 4;
}

message ListContactsRequest {
  int32 page_size = 1;
  optional string page_token = 2;
  optional string order_by = 3;
}

message ListContactsResponse {
  repeated Contact contacts = 1;
  string next_page_token = 2;
}

message CreateContactRequest {
  string payment_pointer = 1;
}

message ListIdentitiesResponse {
  repeated Identity identities = 1;
}

message Identity {
  string id = 1;
  string wallet = 2;
  string platform = 3;
  string identifier = 4;
  string state = 5;
  string key_id = 6;
  string signature = 7;
  string signature_hash = 8;
  string proof = 9;
  string ctime = 10;
  bool public = 11;
  google.protobuf.Timestamp verified_at = 12;
  string wallet_id = 13;
  optional string txt_record = 14;
}

message IdentityVerificationInstructions {
  string identity_id = 1;
  string code = 2;
  string instructions = 3;
}

message DeleteIdentityRequest {
  string id = 1;
}

message SetIdentityPublicRequest {
  string id = 1;
  bool public = 2;
}

message ListPublicIdentitiesRequest {
  string wallet_id = 1;
}

message KYCStatusResponse {
  int32 kyc_status = 1;
}

message KYCPersonaInquiryRequest {
  optional string idempotency_key = 1;
}

message KYCPersonaInquiryResponse {
  string id = 1;
  optional string session_token = 2 [deprecated = true];
}

message CreateTwitterAuthURLResponse {
  string url = 1;
}

message TwitterCallbackRequest {
  string state = 1;
  string code = 2;
}

message TwitterCallbackResponse {
  string id = 1;
}

message GetIdentityRequest {
  string id = 1;
}

message GetIdentityResponse {
  Identity identity = 1;
}

message GetIdentityBySignatureHashRequest {
  string signature_hash = 1;
}

message GetPaymentAddressRequest {
  string address = 1;
}

message GetPaymentAddressResponse {
  string wallet_url = 1;
  string type = 2; // wallet, twitter
  string handle = 3; // url or twitter handle
  bool canSendToAddress = 4;
}

message CreateDomainIdentityRequest {
  string url = 1;
}

message CreateDomainIdentityResponse {
  string id = 1;
}

message VerifyIdentityRequest {
  string id = 1;
}
