syntax = "proto3";

package backend.v1;

import "google/rpc/code.proto";
import "google/rpc/error_details.proto";
import "google/rpc/status.proto";

option go_package = "./backend/v1;backend";

service BackendAdminService {
  rpc GetUserAccountByEmail(GetUserAccountByEmailRequest) returns (Account);
  rpc GetUnitCustomerByAccountID(GetUnitCustomerByAccountRequest) returns (UnitCustomer);
}

message GetUserAccountByEmailRequest {
  string email = 1;
}

message Account {
  string id = 1;
  int64 balance = 2;
  uint64 debitsReserved = 3;
  uint64 debitsAccepted = 4;
  uint64 creditsReserved = 5;
  uint64 creditsAccepted = 6;
}

message GetUnitCustomerByAccountRequest {
  string account_id = 1;
}

message UnitCustomer {
  string id = 1;
  string account_id = 2; // Fynbos account id
  string type = 3;
}

service BackendService {
  rpc GetBankAccountWidget(GetBankAccountWidgetRequest) returns (GetBankAccountWidgetResponse);
  rpc InitiateCreateBankAccount (InitiateCreateBankAccountRequest) returns (InitiateCreateBankAccountResponse);
  // Returns the current onboarding flow.
  rpc GetOnboarding(GetOnboardingRequest) returns (Onboarding);
  // Creates the onboarding flow if it does not already exist.
  rpc UpdateOnboarding(Onboarding) returns (Onboarding);
  // Allows sending and checking an sms verification.
  rpc SendPhoneVerification(SendPhoneVerificationRequest) returns (PhoneVerificationResponse);
  rpc CheckPhoneVerificationCode(CheckPhoneVerificationCodeRequest) returns (PhoneVerificationResponse);
  // Will get a quote that details transaction fees and how much the receiver will get.
  rpc GetQuote(GetQuoteRequest) returns (Quote);
}

message GetBankAccountWidgetRequest {}

message GetBankAccountWidgetResponse {
  string url = 1;
}

message InitiateCreateBankAccountRequest {
  string userGuid = 1;
  string memberGuid = 2;
  string name = 3;
}

message InitiateCreateBankAccountResponse {
  string reference = 1;
}

message FundingSource {
  string id = 1;
  string state = 2;
  string name = 3;
  string mask = 4;
}

message GetOnboardingRequest {
  string id = 1;
}

message Onboarding {
  optional string id = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional string country_of_residence = 4;
  optional string email = 5;
  optional string phone = 6;
  optional bool phone_verified = 7;
  optional bool service_agreement = 8;
}

message SendPhoneVerificationRequest {
  string to = 1;
  string onboardingId = 2;
}

message CheckPhoneVerificationCodeRequest {
  string to = 1;
  string code = 2;
  string onboardingId = 3;
}

message PhoneVerificationResponse {
  // The status from twilio. Can be "approved" or "pending"
  string status = 1;
}

message GetQuoteRequest {
  // e.g. R1 -> receiveAmount = 100. Assumes assetScale = 2.
  uint64 sendAmount = 1;
  // ISO4217 code
  string sendCurrencyCode = 2;
  // e.g. R1 -> receiveAmount = 100. Assumes assetScale = 2.
  uint64 receiveAmount = 3;
  // ISO4217 code
  string receiveCurrencyCode = 4;
  // To whom the user is sending the payment
  string receiverPaymentPointer = 5;
}

// This is not finalised. Revisit when the `Quoting` service is implemented.
message Quote {
  string id = 1;
  uint64 receiveAmount = 2;
  string receiveCurrencyCode = 3;
  uint64 sendAmount = 4;
  string sendCurrencyCode = 5;
  string expiresAt = 6;
}
