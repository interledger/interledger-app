syntax = "proto3";

package backend.v1;

option go_package = "./backend/v1;backend";

service BackendService {
  rpc GetUserAccountByEmail(GetUserAccountByEmailRequest) returns (Account);
  rpc GetUnitCustomerByAccountID(GetUnitCustomerByAccountRequest) returns (UnitCustomer);
}

message GetUserAccountByEmailRequest {
	string email = 1;
}

message Account {
  string id = 1;
  int64 balance = 2;
  uint64 debitsReserved = 3;
  uint64 debitsAccepted = 4;
  uint64 creditsReserved = 5;
  uint64 creditsAccepted = 6;
}

message GetUnitCustomerByAccountRequest {
  string account_id = 1;
}

message UnitCustomer {
  string id = 1;
  string account_id = 2; // Fynbos account id
  string type = 3;
}
