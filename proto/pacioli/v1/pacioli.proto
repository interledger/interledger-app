syntax = "proto3";

package pacioli.v1;

option go_package = "./pacioli/v1;pacioli";

service PacioliService {
  rpc CreateLedger(CreateLedgerRequest) returns (Ledger);
  rpc CreateAccount(CreateAccountRequest) returns (Account);
  rpc GetAccount(GetAccountRequest) returns (Account);
  rpc CreateTransfers(CreateTransfersRequest) returns (CreateTransfersResponse);
  rpc GetTransfers(GetTransfersRequest) returns (GetTransfersResponse);
}

message Ledger {
  string id = 1;
  string name = 2;
  uint32 code = 3;
}

message CreateLedgerRequest {
  string name = 1;
  uint32 code = 2;
}

message Account {
  string id = 1;
  uint32 ledgerCode = 2;
  uint32 code = 3;
  uint64 debitsReserved = 4;
  uint64 debitsAccepted = 5;
  uint64 creditsReserved = 6;
  uint64 creditsAccepted = 7;
}

message CreateAccountRequest {
  string ledgerID = 1;
  uint32 unit = 2;
  uint32 code = 3;
}

message GetAccountRequest {
  string id = 1;
  string ledgerID = 2;
}

message Transfer {
  string id = 1;
  string debitAccountId = 2;
  string creditAccountId = 3;
  uint64 amount = 4;
  uint32 code = 5;
  TransferFlags flags = 6;
}

message TransferFlags {
  bool linked = 1;
  bool twoPhaseCommit = 2;
  bool condition = 3;
}

message CreateTransfersRequest {
  string ledgerID = 1;
  repeated Transfer transfers = 2;
}

message EventError {
  uint32 index = 1;
  uint32 code = 2;
}

message CreateTransfersResponse {
  repeated EventError errors = 1;
}

message GetTransfersRequest {
  string ledgerID = 1;
  repeated string TransferIDs = 2;
}

message GetTransfersResponse {
  repeated Transfer transfers = 1;
}