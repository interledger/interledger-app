site_name: Interledger App Wallet
site_description: >-
  Documentation for the Interledger App Wallet — a reference implementation
  for Account Servicing Entities (ASEs) integrating with the Interledger network.

validation:
  links:
    anchors: warn

theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: deep purple
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Getting Started:
      - Terminology: terminology.md
      - Signup Flow: signup-guide.md
      - KYC & Identity Verification: kyc-guide.md
      - KYC Resubmission Flow: kyc-resubmission-flow.md
      - Account Deletion Flow: account-deletion-guide.md
  - Architecture:
      - Wallets, Accounts & Addresses: wallets-accounts-addresses-guide.md
      - Dual-Ledger System: ledger-system-guide.md
      - Agreements & Legal Consent: agreements-guide.md
  - Payments:
      - Payments & Transactions: payments-guide.md
      - Transaction Types Reference: transaction-types-reference.md
      - Provider Comparison: provider-payments-reference.md
  - Integrations:
      - GateHub Cards: gatehub-cards-guide.md
      - Rafiki Full Node Upgrade: rafiki-full-node-upgrade-guide.md
  - Operations:
      - Payment Troubleshooting: payment-troubleshooting-guide.md
      - Migration Email Job: migration-email-job.md
  - Developers:
      - Error Handling Guide: error-handling-guide.md
      - Logging Reference: logging-reference.md
      - Configuration Strategy Guide: configuration-strategy-guide.md
      - Environment Mode Guide: environment-mode-guide.md
      - Backend Configuration Guide: backend-configuration-guide.md
      - Environment Variables: env-variables.md

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.snippets
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  version:
    provider: mike

